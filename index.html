<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;background:#000}html,body{width:100%;height:100%;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');

let W,H;
function resize(){
  c.width=W=window.innerWidth;
  c.height=H=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

const MW=10,MH=10,TW=128,TH=64;

// Mundo
const world=[];
for(let y=0;y<MH;y++){
  world[y]=[];
  for(let x=0;x<MW;x++){
    const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
    let t=0;
    if(v%8<1)t=1; // agua
    world[y][x]=t;
  }
}

// Jugador con posición en grid
const pl={gx:5,gy:5,frame:0,ft:0};

// Movimiento
function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  // Fondo
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  
  const cam=iso(pl.gx,pl.gy);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  
  // Tiles
  for(let y=0;y<MH;y++){
    for(let x=0;x<MW;x++){
      const s=iso(x,y),sx=s.x+ox,sy=s.y+oy;
      
      // Tile diamond
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.lineTo(sx+TW/2,sy+TH/2);
      ctx.lineTo(sx,sy+TH);
      ctx.lineTo(sx-TW/2,sy+TH/2);
      ctx.closePath();
      
      const t=world[y][x];
      ctx.fillStyle=t===1?'#1565c0':'#4caf50';
      ctx.fill();
      ctx.strokeStyle=t===1?'#0d47a1':'#388e3c';
      ctx.lineWidth=1;
      ctx.stroke();
      
      // Detalles pasto
      if(t===0){
        ctx.fillStyle='#7cb342';
        ctx.fillRect(sx-10,sy+10,2,4);
        ctx.fillRect(sx+5,sy+15,2,4);
      }
      
      // Detalles agua
      if(t===1){
        ctx.fillStyle='rgba(255,255,255,0.3)';
        ctx.fillRect(sx-15,sy+15,10,2);
      }
      
      // Bordes de celda más visibles
      ctx.strokeStyle='rgba(0,0,0,0.15)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.lineTo(sx+TW/2,sy+TH/2);
      ctx.lineTo(sx,sy+TH);
      ctx.lineTo(sx-TW/2,sy+TH/2);
      ctx.closePath();
      ctx.stroke();
      
      // Borde inferior más oscuro (efecto 3D)
      ctx.strokeStyle='rgba(0,0,0,0.3)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(sx,sy+TH);
      ctx.lineTo(sx-TW/2,sy+TH/2);
      ctx.stroke();
    }
  }
  
  // Jugador centrado en su celda (más grande)
  const p=iso(pl.gx,pl.gy);
  const px=p.x+ox,py=p.y-20;
  
  // Sombra
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(px,p.y+14,18,6,0,0,Math.PI*2);
  ctx.fill();
  
  // Zapatos
  ctx.fillStyle='#3e2723';
  ctx.fillRect(px-12,py+32,8,5);
  ctx.fillRect(px+4,py+32,8,5);
  
  // Piernas
  ctx.fillStyle='#5d4037';
  ctx.fillRect(px-10,py+20,7,14);
  ctx.fillRect(px+3,py+20,7,14);
  
  // Cuerpo (más grande)
  ctx.fillStyle='#1976d2';
  ctx.fillRect(px-12,py+0,24,22);
  ctx.fillStyle='#1565c0';
  ctx.fillRect(px-12,py+0,24,6); // Hombreras
  ctx.fillStyle='#0d47a1';
  ctx.fillRect(px-12,py+16,24,6); // Cintura
  
  // Cinturón dorado
  ctx.fillStyle='#ffc107';
  ctx.fillRect(px-12,py+14,24,4);
  ctx.fillStyle='#ff8f00';
  ctx.fillRect(px-3,py+14,6,4); // Hebulla
  
  // Brazos
  ctx.fillStyle='#ffe0b2';
  ctx.fillRect(px-16,py+3,5,16);
  ctx.fillRect(px+11,py+3,5,16);
  ctx.fillStyle='#1976d2';
  ctx.fillRect(px-16,py+3,5,8);
  ctx.fillRect(px+11,py+3,5,8);
  
  // Cabeza (más grande)
  ctx.fillStyle='#ffe0b2';
  ctx.beginPath();
  ctx.arc(px,py-8,14,0,Math.PI*2);
  ctx.fill();
  
  // Pelo
  ctx.fillStyle='#3e2723';
  ctx.beginPath();
  ctx.arc(px,py-12,14,Math.PI,0);
  ctx.fill();
  ctx.fillRect(px-14,py-16,28,6);
  
  // Ojos
  ctx.fillStyle='#fff';
  ctx.fillRect(px-7,py-10,5,5);
  ctx.fillRect(px+2,py-10,5,5);
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(px-5,py-8,3,3);
  ctx.fillRect(px+4,py-8,3,3);
  ctx.fillStyle='#fff';
  ctx.fillRect(px-5,py-8,1,1);
  ctx.fillRect(px+4,py-8,1,1);
  
  // Boca
  ctx.fillStyle='#d78a7a';
  ctx.fillRect(px-3,py-2,6,2);
  
  // HP Bar
  ctx.fillStyle='#333';
  ctx.fillRect(px-15,py-28,30,6);
  ctx.fillStyle='#4f4';
  ctx.fillRect(px-14,py-27,28,4);
  
  // Joystick
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.beginPath();ctx.arc(90,H-100,70,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.stroke();
  
  // UI
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.fillRect(10,10,150,50);
  ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='left';
  ctx.fillText('🦸 Hero Lv.1',18,28);
  ctx.fillStyle='#4a0000';ctx.fillRect(18,36,120,8);
  ctx.fillStyle='#e44';ctx.fillRect(19,37,118,6);
  ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.fillText('100/100',65,43);
  
  // Debug
  ctx.fillStyle='#0f0';ctx.font='12px monospace';ctx.textAlign='left';
  ctx.fillText('W:'+W+' H:'+H+' Pos:'+pl.gx+','+pl.gy,10,H-15);
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
