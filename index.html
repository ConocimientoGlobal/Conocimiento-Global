<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const MW=18,MH=18,TW=80,TH=40;

// Mundo con más variedad
const world=[];
for(let y=0;y<MH;y++){world[y]=[];for(let x=0;x<MW;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%8<1)t=1;else if(v%14<1)t=2;else if(v%18<1)t=3;else if(v%22<1)t=4;else if(v%10<1)t=5;else if(v%16<1)t=6;world[y][x]=t;}}

// Jugador con posición exacta en grid
const pl={
  gx:9,gy:9,         // Grid position
  px:9,py:9,         // Pixel position (for animation)
  dir:'down',
  frame:0,ft:0,
  hp:100,mhp:100,mp:50,mmp:50,
  lv:1,xp:0,g:0,
  moving:false,      // Animation state
  path:[]            // Path for movement
};

// Enemigos
const en=[
  {x:6,y:6,hp:40,mhp:40,c:'#4caf50',name:'Goblin',lv:1},
  {x:12,y:7,hp:60,mhp:60,c:'#e0e0e0',name:'Esqueleto',lv:2},
  {x:8,y:13,hp:50,mhp:50,c:'#03a9f4',name:'Slime',lv:1},
  {x:14,y:11,hp:35,mhp:35,c:'#757575',name:'Lobo',lv:1},
  {x:5,y:14,hp:80,mhp:80,c:'#c62828',name:'Orco',lv:3}
];

// Partículas
const particles=[];

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

// Joystick
let jx=0,jy=0,ja=false,jsx=0,jsy=0;
let moveCooldown=0;

// Input
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  
  // Mitad izquierda = joystick
  if(t.clientX<W*0.55){
    ja=true;jsx=t.clientX;jsy=t.clientY;jx=0;jy=0;
  }
  // Mitad derecha = tap en tile
  else if(!pl.moving && moveCooldown<=0){
    handleTileTap(t.clientX,t.clientY);
  }
},{passive:false});

c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!ja)return;
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    const dx=t.clientX-jsx,dy=t.clientY-jsy;
    const d=Math.sqrt(dx*dx+dy*dy),m=30;
    if(d>m){jx=dx/d;jy=dy/d;}else{jx=dx/m;jy=dy/m;}
  }
},{passive:false});

c.addEventListener('touchend',e=>{ja=false;jx=0;jy=0;},{passive:false});

// Convertir pantalla a grid
function screenToGrid(sx,sy){
  const cam=iso(pl.gx,pl.gy);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  const wx=sx-ox, wy=sy-oy;
  const gx=Math.floor((wx/(TW/2)+wy/(TH/2))/2);
  const gy=Math.floor((wy/(TH/2)-wx/(TW/2))/2);
  return {x:gx,y:gy};
}

// Tap en tile
function handleTileTap(sx,sy){
  const g=screenToGrid(sx,sy);
  // Solo celdas adyacentes (Waven-style)
  const dx=Math.abs(g.x-pl.gx);
  const dy=Math.abs(g.y-pl.gy);
  if(dx<=1 && dy<=1 && (dx+dy)>0){
    moveToCell(g.x,g.y);
  }
}

// Mover a celda adyacente
function moveToCell(gx,gy){
  if(gx<0||gx>=MW||gy<0||gy>=MH)return;
  if(world[gy][gx]===1)return; // No agua
  // Verificar enemigo
  for(const e of en){if(e.x===gx&&e.y===gy&&e.hp>0)return;}
  
  pl.gx=gx;pl.gy=gy;
  pl.moving=true;
  moveCooldown=0.25;
}

// Botones UI
const buttons=[
  {l:'⚔️',x:0,y:0,r:28,c:'#c62828',cd:0},
  {l:'✨',x:0,y:0,r:24,c:'#1565c0',cd:0},
  {l:'🐾',x:0,y:0,r:22,c:'#2e7d32',cd:0}
];

function positionButtons(){
  buttons[0].x=W-55;buttons[0].y=H-180;
  buttons[1].x=W-55;buttons[1].y=H-110;
  buttons[2].x=W-55;buttons[2].y=H-50;
}
positionButtons();
window.addEventListener('resize',positionButtons);

function attack(){
  if(buttons[0].cd>0)return;
  buttons[0].cd=0.5;
  for(const e of en){
    if(e.hp>0&&Math.abs(e.x-pl.gx)<=1&&Math.abs(e.y-pl.gy)<=1){
      e.hp-=18;
      spawnParticles(e.x,e.y,'#f44336',8);
      if(e.hp<=0){pl.xp+=25;pl.g+=15;spawnParticles(e.x,e.y,'#ffc107',12);}
      return;
    }
  }
}

function castSpell(){
  if(buttons[1].cd>0||pl.mp<12)return;
  buttons[1].cd=1;pl.mp-=12;
  for(const e of en){if(e.hp>0){e.hp-=14;spawnParticles(e.x,e.y,'#ff5722',5);}}
}

function petAttack(){
  if(buttons[2].cd>0)return;
  buttons[2].cd=2;
  for(const e of en){if(e.hp>0&&Math.abs(e.x-pl.gx)<=2&&Math.abs(e.y-pl.gy)<=2){e.hp-=10;spawnParticles(e.x,e.y,'#8bc34a',6);}}
}

function spawnParticles(gx,gy,color,n){
  const s=iso(gx,gy);
  for(let i=0;i<n;i++){
    particles.push({x:s.x,y:s.y-10,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-2,l:1,c:color});
  }
}

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  // Cooldowns
  moveCooldown=Math.max(0,moveCooldown-dt);
  for(const b of buttons)b.cd=Math.max(0,b.cd-dt);
  
  // Movimiento con joystick (celda por celda)
  if(ja&&(jx>0.5||jx<-0.5||jy>0.5||jy<-0.5)&&moveCooldown<=0&&!pl.moving){
    let dx=0,dy=0;
    if(Math.abs(jx)>Math.abs(dy)){dx=jx>0?1:-1;}else{dy=jy>0?1:-1;}
    moveToCell(pl.gx+dx,pl.gy+dy);
  }
  
  // Animación suave entre celdas
  const speed=8*dt;
  if(pl.px<pl.gx)pl.px=Math.min(pl.gx,pl.px+speed);
  else if(pl.px>pl.gx)pl.px=Math.max(pl.gx,pl.px-speed);
  if(pl.py<pl.gy)pl.py=Math.min(pl.py,pl.py+speed);
  else if(pl.py>pl.gy)pl.py=Math.max(pl.gy,pl.py-speed);
  
  if(Math.abs(pl.px-pl.gx)<0.02&&Math.abs(pl.py-pl.gy)<0.02){
    pl.px=pl.gx;pl.py=pl.gy;pl.moving=false;
    pl.ft+=dt;if(pl.ft>0.15){pl.ft=0;pl.frame=(pl.frame+1)%2;}
  }
  
  // Partículas
  for(let i=particles.length-1;i>=0;i--){
    particles[i].x+=particles[i].vx;particles[i].y+=particles[i].vy;
    particles[i].vy+=0.1;particles[i].l-=dt*2.5;
    if(particles[i].l<=0)particles.splice(i,1);
  }
  
  // === RENDER ===
  // Fondo con gradiente
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0a1a');bg.addColorStop(1,'#1a2a1a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  
  const cam=iso(pl.gx,pl.gy);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  
  // Tiles con profundidad
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const s=iso(x,y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-TW||sx>W+TW||sy<-TH*2||sy>H+TH)continue;
    const t=world[y][x];
    
    // Sombra del tile
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath();ctx.moveTo(sx+4,sy+4);ctx.lineTo(sx+TW/2+4,sy+TH/2+4);ctx.lineTo(sx+4,sy+TH+4);ctx.lineTo(sx-TW/2+4,sy+TH/2+4);ctx.closePath();ctx.fill();
    
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();
    
    if(t===0){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#7cb342';ctx.fillRect(sx-6,sy+5,1,3);ctx.fillRect(sx+4,sy+7,1,3);ctx.fillRect(sx+9,sy+6,1,2);}
    else if(t===1){ctx.fillStyle='#1565c0';ctx.fill();ctx.strokeStyle='#0d47a1';ctx.stroke();ctx.fillStyle='#42a5f5';ctx.fillRect(sx-7,sy+10,5,1);ctx.fillRect(sx+5,sy+16,4,1);}
    else if(t===2){ctx.fillStyle='#8d6e63';ctx.fill();ctx.strokeStyle='#5d4037';ctx.stroke();ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(sx-6,sy+8,2,2);ctx.fillRect(sx+5,sy+10,3,2);}
    else if(t===3){ctx.fillStyle='#757575';ctx.fill();ctx.strokeStyle='#424242';ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.arc(sx-3,sy+9,2,0,Math.PI*2).fill();}
    else if(t===4){ctx.fillStyle='#e0c878';ctx.fill();ctx.strokeStyle='#c8a840';ctx.stroke();}
    else if(t===5){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy+4,4,12);ctx.fillStyle='#33691e';ctx.beginPath();ctx.moveTo(sx,sy-18);ctx.lineTo(sx-12,sy+2);ctx.lineTo(sx+12,sy+2);ctx.closePath().ctx.fill();ctx.fillStyle='#4caf50';ctx.beginPath();ctx.moveTo(sx,sy-24);ctx.lineTo(sx-8,sy-6);ctx.lineTo(sx+8,sy-6);ctx.closePath().ctx.fill();ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(sx+8,sy+4,10,4,0.3,0,Math.PI*2).fill();}
    else if(t===6){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();ctx.fillStyle='#757575';ctx.beginPath();ctx.ellipse(sx,sy+6,12,7,0,Math.PI,0).fill();ctx.fillStyle='#9e9e9e';ctx.beginPath();ctx.ellipse(sx-2,sy+4,8,5,0,Math.PI,0).fill();ctx.fillStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.ellipse(sx-4,sy+2,4,2,0,Math.PI*2).fill();}
    
    // Indicador de celda válida (borde verde sutil)
    const dx=Math.abs(x-pl.gx),dy=Math.abs(y-pl.gy);
    if(dx<=1&&dy<=1&&(dx+dy)>0&&t!==1&&!pl.moving){
      ctx.strokeStyle='rgba(76,175,80,0.2)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();ctx.stroke();
    }
  }
  
  // Enemigos con detalle
  for(const e of en){
    if(e.hp<=0)continue;
    const s=iso(e.x,e.y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-60||sx>W+60||sy<-60||sy>H+60)continue;
    
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+14,10,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=e.c;ctx.fillRect(sx-7,sy-5,14,14);
    ctx.fillStyle='#1a1a1a';ctx.fillRect(sx-7,sy+5,14,4);
    ctx.fillStyle='#fff';ctx.fillRect(sx-5,sy-3,3,3);ctx.fillRect(sx+2,sy-3,3,3);
    ctx.fillStyle='#000';ctx.fillRect(sx-4,sy-2,2,2);ctx.fillRect(sx+3,sy-2,2,2);
    ctx.fillStyle='#333';ctx.fillRect(sx-12,sy-12,24,4);ctx.fillStyle='#e44';ctx.fillRect(sx-11,sy-11,22*e.hp/e.mhp,2);
    ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';
    ctx.fillText(`${e.name} Lv${e.lv}`,sx,sy-14);
  }
  
  // Jugador
  const p=iso(pl.px,pl.py),px=p.x+ox,py=p.y+oy,bo=pl.frame===0?0:1;
  
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(px,py+16,10,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';ctx.fillRect(px-5,py+4,3,8+bo);ctx.fillRect(px+2,py+4,3,8+bo);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-6,py+11+bo,4,3);ctx.fillRect(px+2,py+11+bo,4,3);
  ctx.fillStyle='#1976d2';ctx.fillRect(px-7,py-6,14,12);
  ctx.fillStyle='#1565c0';ctx.fillRect(px-7,py-6,14,3);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-7,py,14,2);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-5,py-12,10,6);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-5,py-14,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(px-3,py-10,2,2);ctx.fillRect(px+1,py-10,2,2);
  ctx.fillStyle='#000';ctx.fillRect(px-2,py-9,1,1);ctx.fillRect(px+2,py-9,1,1);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-9,py-4,2,5);ctx.fillRect(px+7,py-4,2,5);
  
  // Partículas
  ctx.save();ctx.translate(ox,oy);
  for(const pt of particles){
    ctx.globalAlpha=pt.l;ctx.fillStyle=pt.c;
    ctx.beginPath();ctx.arc(pt.x,pt.y-10,4*pt.l,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.restore();
  
  // Joystick
  if(ja){ctx.fillStyle='rgba(255,255,255,0.08)';ctx.beginPath();ctx.arc(jsx,jsy,55,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.arc(jsx,jsy,35,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(jsx+jx*40,jsy+jy*40,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.arc(jsx+jx*40,jsy+jy*40,8,0,Math.PI*2);ctx.fill();}
  
  // Botones
  for(const b of buttons){
    const cdP=b.cd>0?b.cd:0;
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=b.c;ctx.lineWidth=3;ctx.stroke();
    if(cdP>0){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2*cdP);ctx.fill();}
    ctx.fillStyle='#fff';ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.l,b.x,b.y);
  }
  
  // UI superior
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.fillRect(0,0,W,42);
  ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(`🦸 Hero Nv.${pl.lv}`,10,14);
  ctx.fillStyle='#4a0000';ctx.fillRect(10,22,90,10);
  ctx.fillStyle='#e44';ctx.fillRect(11,23,88*pl.hp/pl.mhp,8);
  ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.fillText(`${pl.hp}/${pl.mhp}`,48,28);
  ctx.fillStyle='#4488ff';ctx.fillRect(100,22,60,6);ctx.fillStyle='#000a4a';ctx.fillRect(101,23,58*pl.mp/pl.mmp,4);
  ctx.fillStyle='#ffc107';ctx.font='11px monospace';ctx.textAlign='right';ctx.fillText(`💰${pl.g}`,W-10,14);ctx.fillStyle='#ffeb3b';ctx.font='10px monospace';ctx.fillText(`✨${pl.xp}XP`,W-10,30);
  
  // Debug
  ctx.fillStyle='#0f0';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText(`Grid:${pl.gx},${pl.gy} Move:${pl.moving?'Sí':'No'}`,10,H-10);
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
