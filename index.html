function getBioma(x,y){
  const bx=Math.min(7,Math.floor(x/8)),by=Math.min(7,Math.floor(y/8));
  const m=[[0,1,1,2,2,5,5,5],[1,1,2,2,3,5,5,6],[1,2,2,3,3,5,6,6],[2,2,3,3,4,5,6,6],[2,3,3,4,4,6,6,6],[3,3,4,4,4,6,6,6],[3,4,4,4,6,6,6,6],[4,4,4,6,6,6,6]];
  return m[by][bx];
}

// === MUNDO ===
const world=[];
for(let y=0;y<WORLD_H;y++){
  world[y]=[];
  for(let x=0;x<WORLD_W;x++){
    if(x<1||x>=WORLD_W-1||y<1||y>=WORLD_H-1)world[y][x]=1;
    else{const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;world[y][x]=(v%20<1)?1:0;}
  }
}
world[8][8]=0;

let frameCount=0;
const particles=[];

// === FUNCIONES ===
function showMsg(title,text){
  msgEl.innerHTML='<b style="font-size:16px">'+(title||'')+'</b><br><br>'+(text||'').replace(/\n/g,'<br>');

function addParticle(x,y,color,speed){
  particles.push({x,y,vx:(Math.random()-0.5)*speed,vy:-Math.random()*speed,life:1,color});
}

// === TILE CON TEXTURA 16-BIT ===
function drawTile16(sx,sy,w,h,bio,x,y){
  const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
  const ps=Math.max(2,Math.floor(w/16));
  
  // Rellenar con textura de pixels
  for(let py=0;py<h;py+=ps){
    for(let px=0;px<w;px+=ps){
      const idx=((px+py+v)%bio.t.length);
      ctx.fillStyle=bio.t[idx];
      ctx.fillRect(sx-ps+px,sy+py,ps,ps);
    }
  }
  
  // Brillo superior (luz)
  ctx.fillStyle='rgba(255,255,255,0.08)';
  for(let i=0;i<3;i++){
    const bx=sx-w/4+(v*i*7)%(w/2);
    const by=sy+(v*i*3)%(h/3);
    ctx.fillRect(bx,by,ps*2,ps);
  }
  
  // Sombra inferior (profundidad)
  ctx.fillStyle='rgba(0,0,0,0.12)';
  for(let i=0;i<3;i++){
    const bx=sx-w/4+(v*i*5)%(w/2);
    const by=sy+h/2+(v*i*4)%(h/3);
    ctx.fillRect(bx,by,ps*2,ps);
  }
  
  // Bordes
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(sx+w/2,sy+h/2);
  ctx.lineTo(sx,sy+h);
  ctx.lineTo(sx-w/2,sy+h/2);
  ctx.closePath();
  ctx.strokeStyle='rgba(0,0,0,0.1)';
  ctx.lineWidth=1;
  ctx.stroke();
}

// === AGUA 16-BIT ===
function drawWater16(sx,sy,w,h,bio,x,y){
  const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
  const ps=Math.max(2,Math.floor(w/16));
  
  for(let py=0;py<h;py+=ps){
    for(let px=0;px<w;px+=ps){
      const idx=(px+py+v)%bio.w.length;
      ctx.fillStyle=bio.w[idx];
      ctx.fillRect(sx-ps+px,sy+py,ps,ps);
    }
  }
  
  // Ondas animadas
  ctx.fillStyle='rgba(255,255,255,0.25)';
  const wave=Math.sin((frameCount*0.06)+(x+y)*0.4)*2;
  ctx.fillRect(sx-8+wave,sy+h/4,5,1);
  ctx.fillRect(sx+3+wave*0.7,sy+h/2,4,1);
  ctx.fillRect(sx-2+wave*0.5,sy+h*0.7,3,1);
  
  // Reflejos
  ctx.fillStyle='rgba(200,230,255,0.15)';
  ctx.fillRect(sx-4+v*3,sy+h/3,2,2);
  ctx.fillRect(sx+6+v*5,sy+h*0.6,2,2);
  
  // Peces
  if(bio.id===2&&v%6<2){
    const px=sx-6+((frameCount*0.3+v)%12);
    const py=sy+h/3+(v%3);
    ctx.fillStyle='#e67e22';ctx.fillRect(px,py,3,2);
    ctx.fillStyle='#f39c12';ctx.fillRect(px-1,py,1,2);
  }
  
  // Burbujas
  if(v%11===0){
    const bx=sx+(v%10)-5;
    const by=sy+h/2-((frameCount*0.1+v)%h/2);
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.fillRect(bx,by,1,1);
  }
  
  // Bordes
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(sx+w/2,sy+h/2);
  ctx.lineTo(sx,sy+h);
  ctx.lineTo(sx-w/2,sy+h/2);
  ctx.closePath();
  ctx.strokeStyle='rgba(100,180,220,0.2)';
  ctx.lineWidth=1;
  ctx.stroke();
}

// === ARBOL 16-BIT ===
function drawTree16(sx,sy,tipo,v,bio){
  // Sombra
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(sx+5,sy+h/2,12*0.8,5*0.8,0.3,0,Math.PI*2);
  ctx.fill();
  
  const h=bio.id===3?TH*1.5:TH*1.2;
  
  if(tipo==='pino'){
    // Tronco
    ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy-h*0.6,4,h*0.6);
    ctx.fillStyle='#4e342e';ctx.fillRect(sx-2,sy-h*0.6,2,h*0.6);
    // Textura corteza
    ctx.fillStyle='#3e2723';ctx.fillRect(sx-1,sy-h*0.5,1,3);ctx.fillRect(sx+1,sy-h*0.35,1,2);
    // Copa triangular
    ctx.fillStyle='#1e4d15';
    ctx.beginPath();ctx.moveTo(sx,sy-h);ctx.lineTo(sx-h*0.4,sy-h*0.4);ctx.lineTo(sx+h*0.4,sy-h*0.4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#2d5a1e';
    ctx.beginPath();ctx.moveTo(sx,sy-h*0.85);ctx.lineTo(sx-h*0.3,sy-h*0.45);ctx.lineTo(sx+h*0.3,sy-h*0.45);ctx.closePath();ctx.fill();
    // Hojitas
    ctx.fillStyle='#3a6b28';ctx.fillRect(sx-3,sy-h*0.6,2,2);ctx.fillRect(sx+2,sy-h*0.5,2,2);
    ctx.fillStyle='#4a8a32';ctx.fillRect(sx-1,sy-h*0.7,2,2);ctx.fillRect(sx+4,sy-h*0.55,2,2);
    // Nieve en montaña
    if(bio.id===3){
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(sx-2,sy-h*0.9,4,2);
    }
  }else if(tipo==='palmera'){
    // Tronco
    ctx.fillStyle='#8d6e63';ctx.fillRect(sx-3,sy-h*0.7,6,h*0.7);
    ctx.fillStyle='#6d4c41';ctx.fillRect(sx-3,sy-h*0.7,3,h*0.7);
    // Textura
    ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy-h*0.6,1,4);ctx.fillRect(sx+1,sy-h*0.5,1,3);
    // Hojas palmera
    ctx.fillStyle='#27ae60';ctx.fillRect(sx-h*0.4,sy-h*0.75,h*0.3,2);
    ctx.fillStyle='#2ecc71';ctx.fillRect(sx+h*0.1,sy-h*0.75,h*0.3,2);
    ctx.fillStyle='#27ae60';ctx.fillRect(sx-4,sy-h*0.85,8,2);
  }else if(tipo==='muerto'){
    // Tronco gris
    ctx.fillStyle='#4e342e';ctx.fillRect(sx-1,sy-h*0.8,3,h*0.8);
    // Ramas secas
    ctx.strokeStyle='#3e2723';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sx,sy-h*0.8);ctx.lineTo(sx-8,sy-h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx,sy-h*0.65);ctx.lineTo(sx+6,sy-h*0.85);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx,sy-h*0.5);ctx.lineTo(sx-5,sy-h*0.7);ctx.stroke();
  }else{
    // Tronco roble
    ctx.fillStyle='#5d4037';ctx.fillRect(sx-3,sy-h*0.5,6,h*0.5);
    ctx.fillStyle='#4e342e';ctx.fillRect(sx-3,sy-h*0.5,3,h*0.5);
    // Textura corteza
    ctx.fillStyle='#3e2723';ctx.fillRect(sx-2,sy-h*0.4,1,3);ctx.fillRect(sx+1,sy-h*0.3,1,2);
    // Copa con gradiente
    const grad=ctx.createRadialGradient(sx,sy-h*0.6,2,sx,sy-h*0.55,12);
    grad.addColorStop(0,'#4a8a32');grad.addColorStop(0.5,'#2d5a1e');grad.addColorStop(1,'#1e4d15');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(sx,sy-h*0.6,12,0,Math.PI*2);ctx.fill();
    // Hojitas individuales
    ctx.fillStyle='#5a8f3c';ctx.fillRect(sx-5,sy-h*0.75,3,3);
    ctx.fillStyle='#3a6b28';ctx.fillRect(sx+3,sy-h*0.65,3,3);
    ctx.fillStyle='#6ba54a';ctx.fillRect(sx-2,sy-h*0.5,3,3);
    ctx.fillStyle='#4a8a32';ctx.fillRect(sx+6,sy-h*0.7,2,2);
    // Brillo
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.beginPath();ctx.arc(sx-3,sy-h*0.8,3,0,Math.PI*2);ctx.fill();
  }
}

// === ROCA 16-BIT ===
function drawRock16(sx,sy,bio){
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();ctx.ellipse(sx+3,sy+TH/2,8,3,0.2,0,Math.PI*2);ctx.fill();
  
  ctx.fillStyle=bio.d[0];
  ctx.beginPath();ctx.moveTo(sx-8,sy+TH/2);ctx.lineTo(sx-5,sy-8);ctx.lineTo(sx+3,sy-12);ctx.lineTo(sx+8,sy-6);ctx.lineTo(sx+8,sy+TH/2);ctx.closePath();ctx.fill();
  ctx.fillStyle=bio.d[1];
  ctx.beginPath();ctx.moveTo(sx+3,sy-12);ctx.lineTo(sx+8,sy-6);ctx.lineTo(sx+8,sy+TH/2);ctx.lineTo(sx+3,sy+TH/2);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath();ctx.moveTo(sx-5,sy-8);ctx.lineTo(sx+3,sy-12);ctx.lineTo(sx-1,sy-6);ctx.closePath();ctx.fill();
  // Grietas
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(sx-2,sy-4,1,3);ctx.fillRect(sx+4,sy-2,1,2);
}

// === CASA 16-BIT ===
function drawHouse16(sx,sy,v){
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();ctx.ellipse(sx+6,sy+TH/2,14,5,0.3,0,Math.PI*2);ctx.fill();
  
  // Pared
  const paredColors=['#e8d8b0','#d4c49a','#c8b888'];
  ctx.fillStyle=paredColors[v%3];ctx.fillRect(sx-10,sy-14,20,16);
  ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(sx-10,sy-14,4,16);
  
  // Techo
  const techoColors=['#c0392b','#2980b9','#f39c12','#27ae60'];
  ctx.fillStyle=techoColors[v%4];
  ctx.beginPath();ctx.moveTo(sx,sy-28);ctx.lineTo(sx-14,sy-16);ctx.lineTo(sx+14,sy-16);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();ctx.moveTo(sx,sy-28);ctx.lineTo(sx+14,sy-16);ctx.lineTo(sx+14,sy-12);ctx.closePath();ctx.fill();
  
  // Puerta
  ctx.fillStyle='#5d4037';ctx.fillRect(sx-3,sy-6,6,8);
  ctx.fillStyle='#ffd700';ctx.fillRect(sx+1,sy-3,1,1);
  
  // Ventanas
  ctx.fillStyle='#3498db';ctx.fillRect(sx-8,sy-10,4,4);ctx.fillRect(sx+4,sy-10,4,4);
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(sx-8,sy-10,4,1);ctx.fillRect(sx+4,sy-10,4,1);
  
  // Humo
  if(frameCount%30<15){
    ctx.fillStyle='rgba(200,200,200,0.4)';
    ctx.beginPath();ctx.arc(sx+8,sy-32,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(200,200,200,0.3)';
    ctx.beginPath();ctx.arc(sx+9,sy-36,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(200,200,200,0.2)';
    ctx.beginPath();ctx.arc(sx+10,sy-40,1,0,Math.PI*2);ctx.fill();
  }
}

// === FLOR 16-BIT ===
function drawFlower16(sx,sy,color,v){
  // Tallo
  ctx.fillStyle='#27ae60';ctx.fillRect(sx-1,sy+TH/2-4,2,4);
  // Pétalos
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(sx,sy+TH/2-6,2,0,Math.PI*2);ctx.fill();
  // Centro
  ctx.fillStyle='#f1c40f';ctx.fillRect(sx,sy+TH/2-6,1,1);
  // Hojitas
  ctx.fillStyle='#2ecc71';ctx.fillRect(sx-2,sy+TH/2-2,1,1);ctx.fillRect(sx+1,sy+TH/2-3,1,1);
}

// === LOOP PRINCIPAL ===
function loop(){
  frameCount++;
  const dt=1/60;
  const W=c.width,H=c.height;
  const TW=Math.min(W,H)/4;
  const TH=TW/2;
  
  if(msgTimeout>0){msgTimeout-=dt;if(msgTimeout<=0)msgEl.style.display='none';}
  
  // Fondo
  const bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#0d1b0d');bgGrad.addColorStop(1,'#1a2a1a');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
  
  // Movimiento
  if(pl.path.length>0){
    const t=pl.path[0];
    const dx=t.x-pl.fx,dy=t.y-pl.fy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<0.05){pl.fx=t.x;pl.fy=t.y;pl.gx=t.x;pl.gy=t.y;pl.path.shift();}
    else{pl.fx+=dx/dist*0.04;pl.fy+=dy/dist*0.04;}
    pl.ft+=dt;
    if(pl.ft>0.1){pl.ft=0;pl.frame=(pl.frame+1)%4;}
  }
  
  // Particulas
  if(pl.path.length>0&&frameCount%3===0){
    const px=(pl.fx-pl.fy)*TW/2+W/2-(pl.fx-pl.fy)*TW/2;
    const py=(pl.fx+pl.fy)*TH/2+H/2-(pl.fx+pl.fy)*TH/2;
    addParticle(px+Math.random()*4-2,py+TH/2,'rgba(150,120,80,0.4)',0.8);
  }
  
  const camX=W/2-(pl.fx-pl.fy)*TW/2;
  const camY=H/2-(pl.fx+pl.fy)*TH/2;
  const pgx=Math.floor(pl.gx),pgy=Math.floor(pl.gy);
  
  // === TILES ===
  for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR+2);y++){
    for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR+2);x++){
      const sx=(x-y)*TW/2+camX;
      const sy=(x+y)*TH/2+camY;
      
      const dist=Math.sqrt((x-pgx)*(x-pgx)+(y-pgy)*(y-pgy));
      if(dist>VR+0.5)continue;
      
      const biomaId=getBioma(x,y);
      const bio=BIOMAS[biomaId]||BIOMAS[0];
      
      if(world[y][x]===1){
        drawWater16(sx,sy,TW,TH,bio,x,y);
      }else{
        drawTile16(sx,sy,TW,TH,bio,x,y);
      }
      
      if(pl.path.find(p=>p.x===x&&p.y===y)){
        ctx.fillStyle='rgba(255,255,100,0.2)';
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();ctx.fill();
      }
    }
  }
  
  // === DECORACIONES ===
  for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR);y++){
    for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR);x++){
      const dist=Math.sqrt((x-pgx)*(x-pgx)+(y-pgy)*(y-pgy));
      if(dist>VR)continue;
      if(world[y][x]!==0)continue;
      
      const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
      const sx=(x-y)*TW/2+camX;
      const sy=(x+y)*TH/2+camY;
      const biomaId=getBioma(x,y);
      const bio=BIOMAS[biomaId]||BIOMAS[0];
      const tipo=v%100;
      
      if(tipo<10){
        const treeType=bio.id===1&&v%3===0?'pino':bio.id===2?'palmera':bio.id===4&&v%2===0?'muerto':'roble';
        drawTree16(sx,sy,treeType,v,bio);
      }else if(tipo<13){
        drawRock16(sx,sy,bio);
      }else if(tipo<15&&bio.id===0){
        drawHouse16(sx,sy,v);
      }else if(tipo<17){
        drawFlower16(sx,sy,bio.f[v%bio.f.length],v);
      }else if(tipo<19&&bio.id===4){
        ctx.fillStyle='rgba(80,100,60,0.4)';
        ctx.beginPath();ctx.ellipse(sx,sy+TH/2,6,2,0,0,Math.PI*2);ctx.fill();
      }else if(tipo<21&&bio.id===5){
        ctx.fillStyle='rgba(0,0,0,0.3)';
        ctx.beginPath();ctx.ellipse(sx+2,sy+TH/2,6,2,0.2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#1c1c1c';
        ctx.beginPath();ctx.moveTo(sx-5,sy+TH/2);ctx.lineTo(sx-3,sy-5);ctx.lineTo(sx+2,sy-8);ctx.lineTo(sx+5,sy-4);ctx.lineTo(sx+5,sy+TH/2);ctx.closePath();ctx.fill();
        ctx.fillStyle='#e67e22';ctx.fillRect(sx,sy-4,1,3);
      }else if(tipo<23&&bio.id===3){
        ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect(sx-6,sy+TH/2,12,2);
      }
    }
  }
  
  // === NIEBLA PANTANO ===
  if(getBioma(pgx,pgy)===4){
    for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR);y++){
      for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR);x++){
        const sx=(x-y)*TW/2+camX;
        const sy=(x+y)*TH/2+camY;
        const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
        const alpha=0.06+(v%3)*0.02;
        ctx.fillStyle=`rgba(180,200,180,${alpha})`;
        const offset=Math.sin((frameCount*0.02)+(x+y)*0.3)*2;
        ctx.fillRect(sx-10,sy+TH/2+offset+2,20,4);
      }
    }
  }
  
  // === PARTICULAS ===
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=0.02;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,2,2);ctx.globalAlpha=1;
  }
  
  // === COFRES ===
  for(const co of cofres){
    if(co.o)continue;
    const dist=Math.sqrt((co.x-pgx)*(co.x-pgx)+(co.y-pgy)*(co.y-pgy));
    if(dist>VR)continue;
    const sx=(co.x-co.y)*TW/2+camX;
    const sy=(co.x+co.y)*TH/2+camY;
    
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(sx,sy+TH/2,5,2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd700';ctx.fillRect(sx-4,sy-2,8,5);
    ctx.fillStyle='#b8860b';ctx.fillRect(sx-4,sy-2,8,2);
    ctx.fillStyle='#ffeb3b';ctx.fillRect(sx-1,sy-1,2,1);
  }
  
  // === NPCs ===
  for(const n of npcs){
    const dist=Math.sqrt((n.x-pgx)*(n.x-pgx)+(n.y-pgy)*(n.y-pgy));
    if(dist>VR)continue;
    const sx=(n.x-n.y)*TW/2+camX;
    const sy=(n.x+n.y)*TH/2+camY;
    
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(sx,sy+TH/2,6,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=n.c;ctx.fillRect(sx-5,sy+TH/2-14,10,10);
    ctx.fillStyle='#f5cba7';ctx.fillRect(sx-3,sy+TH/2-19,6,5);
    ctx.fillStyle='#5d4037';ctx.fillRect(sx-4,sy+TH/2-21,8,3);
    ctx.fillStyle='#fff';ctx.fillRect(sx-2,sy+TH/2-17,2,1);ctx.fillRect(sx+1,sy+TH/2-17,2,1);
    ctx.fillStyle='#1a1a1a';ctx.fillRect(sx-1,sy+TH/2-16,1,1);ctx.fillRect(sx+2,sy+TH/2-16,1,1);
    ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(sx,sy+TH/2-26,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='6px monospace';ctx.textAlign='center';ctx.fillText(n.n,sx,sy-8);
  }
  
  // === JUGADOR ===
  const px=(pl.fx-pl.fy)*TW/2+camX;
  const py=(pl.fx+pl.fy)*TH/2+camY;
  
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(px,py+TH/2,7,3,0,0,Math.PI*2);ctx.fill();
  
  // Piernas
  ctx.fillStyle='#5d4037';
  if(pl.path.length>0){
    if(pl.frame===0||pl.frame===2){ctx.fillRect(px-3,py+TH/2-8,2,8);ctx.fillRect(px+1,py+TH/2-8,2,8);}
    else if(pl.frame===1){ctx.fillRect(px-3,py+TH/2-9,2,9);ctx.fillRect(px+1,py+TH/2-7,2,7);}
    else{ctx.fillRect(px-3,py+TH/2-7,2,7);ctx.fillRect(px+1,py+TH/2-9,2,9);}
  }else{ctx.fillRect(px-3,py+TH/2-8,2,8);ctx.fillRect(px+1,py+TH/2-8,2,8);}
  
  // Cuerpo
  ctx.fillStyle='#1976d2';ctx.fillRect(px-7,py+TH/2-20,14,14);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-7,py+TH/2-8,14,2);
  
  // Cabeza
  ctx.fillStyle='#f5cba7';ctx.fillRect(px-4,py+TH/2-26,8,6);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-5,py+TH/2-28,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(px-2,py+TH/2-24,2,2);ctx.fillRect(px+1,py+TH/2-24,2,2);
  ctx.fillStyle='#1a1a1a';ctx.fillRect(px-1,py+TH/2-23,1,1);ctx.fillRect(px+2,py+TH/2-23,1,1);
  
  // === UI ===
  ctx.fillStyle='rgba(0,0,0,0.85)';ctx.beginPath();ctx.roundRect(10,10,150,55,6);ctx.fill();
  ctx.strokeStyle='#ffd700';ctx.lineWidth=1;ctx.stroke();
  
  ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('Lv.1 Hero',18,26);
  
  ctx.fillStyle='#4a0000';ctx.beginPath();ctx.roundRect(18,34,134,8,3);ctx.fill();
  ctx.fillStyle='#e44';ctx.beginPath();ctx.roundRect(19,35,132,6,2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.fillText('100/100',75,39);
  
  ctx.fillStyle='#ffd700';ctx.font='10px monospace';ctx.fillText('Oro: '+pl.oro,18,50);
  
  ctx.fillStyle='#0f0';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText('Pos:'+Math.floor(pl.gx)+','+Math.floor(pl.gy),10,H-15);
  
  // Minimapa
  const mmW=100,mmH=100,mmX=W-mmW-10,mmY=H-mmH-10;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(mmX,mmY,mmW,mmH);
  for(let y=0;y<WORLD_H;y+=2){
    for(let x=0;x<WORLD_W;x+=2){
      const biomaId=getBioma(x,y);
      const b=BIOMAS[biomaId]||BIOMAS[0];
      ctx.fillStyle=world[y][x]===1?b.w[0]:b.t[0];
      ctx.fillRect(mmX+(x/WORLD_W)*mmW,mmY+(y/WORLD_H)*mmH,2,2);
    }
  }
  ctx.fillStyle='#ff0';ctx.fillRect(mmX+(pl.gx/WORLD_W)*mmW-2,mmY+(pl.gy/WORLD_H)*mmH-2,4,4);
  ctx.strokeStyle='#ffd700';ctx.lineWidth=1;ctx.strokeRect(mmX,mmY,mmW,mmH);
  
  requestAnimationFrame(loop);
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(pl.path.length>0)return;
  const W=c.width,H=c.height;
  const TW=Math.min(W,H)/4,TH=TW/2;
  const camX=W/2-(pl.fx-pl.fy)*TW/2;
  const camY=H/2-(pl.fx+pl.fy)*TH/2;
  
  const t=e.changedTouches[0];
  const rx=t.clientX-camX,ry=t.clientY-camY;
  const gx=Math.floor((rx/(TW/2)+ry/(TH/2))/2);
  const gy=Math.floor((ry/(TH/2)-rx/(TW/2))/2);
  
  if(gx<0||gx>=WORLD_W||gy<0||gy>=WORLD_H)return;
  
  for(const n of npcs){
    if(n.x===gx&&n.y===gy){showMsg(n.n,n.d);return;}
  }
  
  for(const co of cofres){
    if(co.x===gx&&co.y===gy&&!co.o){
      co.o=true;pl.oro+=10;
      showMsg('Cofre abierto','Encontraste: '+co.l+'\n+10 oro');
      return;
    }
  }
  
  if(world[gy][gx]!==0)return;
  
  const open=[{x:pl.gx,y:pl.gy,p:[]}];
  const vis=new Set();vis.add(pl.gx+','+pl.gy);
  while(open.length){
    const c=open.shift();
    if(c.x===gx&&c.y===gy){pl.path=c.p;break;}
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=c.x+dx,ny=c.y+dy,k=nx+','+ny;
      if(vis.has(k)||nx<0||nx>=WORLD_W||ny<0||ny>=WORLD_H||world[ny][nx]!==0)continue;
      vis.add(k);
      open.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]});
    }
  }
},{passive:false});

loop();
}catch(e){
  document.body.innerHTML='<h1 style="color:red;padding:20px">ERROR: '+e.message+'<br><br>'+e.stack+'</h1>';
}
</script>
</body>
</html>
