<!DOCTYPE html>
<html>
<head><title>Test Verde</title></head>
<body style="margin:0;padding:0;background:red;width:100%;height:100%">
<div style="color:white;font-size:30px;padding:20px;background:blue;margin:20px">
  HTML funciona
</div>
<canvas id="c" width="200" height="200" style="display:block;background:yellow;margin:20px"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
ctx.fillStyle='green';
ctx.fillRect(50,50,100,100);
ctx.fillStyle='white';
ctx.font='16px monospace';
ctx.fillText('Canvas OK',60,110);
</script>
</body>
</html>
