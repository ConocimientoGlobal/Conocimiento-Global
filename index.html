<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai Debug</title>
<style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}html,body{width:100%;height:100%;overflow:hidden;background:green}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const MW=15,MH=15,TW=64,TH=32;
const world=[];
for(let y=0;y<MH;y++){world[y]=[];for(let x=0;x<MW;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%12<2)t=1;world[y][x]=t;}}

let px=7,py=7;
let path=[];
let touchLog='Toca la pantalla';

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}
function s2g(sx,sy){const cam=iso(px,py);const ox=W/2-cam.x,oy=H/2-cam.y;const wx=sx-ox,wy=sy-oy;return{x:Math.floor((wx/(TW/2)+wy/(TH/2))/2),y:Math.floor((wy/(TH/2)-wx/(TW/2))/2)};}

function findPath(sx,sy,gx,gy){
  if(gx<0||gx>=MW||gy<0||gy>=MH||world[gy][gx]===1)return[];
  const open=[{x:sx,y:sy,g:0,h:0,path:[]}];const vis=new Set();
  while(open.length){const c=open.shift();if(c.x===gx&&c.y===gy)return c.path;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=c.x+dx,ny=c.y+dy,k=nx+','+ny;if(nx<0||nx>=MW||ny<0||ny>=MH||vis.has(k)||world[ny][nx]===1)continue;vis.add(k);open.push({x:nx,y:ny,g:c.g+1,h:0,path:[...c.path,{x:nx,y:ny}]);}}
  return [];
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  const g=s2g(t.clientX,t.clientY);
  touchLog=`Tocado: ${g.x},${g.y}`;
  path=findPath(px,py,g.x,g.y);
  if(path.length>0)touchLog+=` Path: ${path.length} celdas`;
  else touchLog+=` Sin camino`;
},{passive:false});

c.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  const g=s2g(t.clientX,t.clientY);
  touchLog=`Drag: ${g.x},${g.y}`;
  path=findPath(px,py,g.x,g.y);
},{passive:false});

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  // Avanzar path
  if(path.length>0){
    const t=path[0];
    const sp=6*dt;
    if(px<t.x)px=Math.min(t.x,px+sp);else if(px>t.x)px=Math.max(t.x,px-sp);
    if(py<t.y)py=Math.min(t.y,py+sp);else if(py>t.y)py=Math.max(t.y,py-sp);
    if(Math.abs(px-t.x)<0.05&&Math.abs(py-t.y)<0.05){px=t.x;py=t.y;path.shift();}
  }
  
  // Render
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(0,0,W,H);
  
  const cam=iso(px,py);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  
  // Path visual
  for(const p of path){
    const s=iso(p.x,p.y),sx=s.x+ox,sy=s.y+oy;
    ctx.fillStyle='rgba(255,255,0,0.3)';
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();ctx.fill();
  }
  
  // Tiles
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const s=iso(x,y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-TW||sx>W+TW||sy<-TH*2||sy>H+TH)continue;
    const t=world[y][x];
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();
    ctx.fillStyle=t===1?'#1565c0':'#4caf50';ctx.fill();
    ctx.strokeStyle=t===1?'#0d47a1':'#388e3c';ctx.lineWidth=1;ctx.stroke();
  }
  
  // Player
  const p=iso(px,py),pxx=p.x+ox,pyy=p.y+oy;
  ctx.fillStyle='#1976d2';ctx.fillRect(pxx-6,pyy-6,12,10);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(pxx-4,pyy-12,8,6);
  ctx.fillStyle='#fff';ctx.fillRect(pxx-2,pyy-8,2,2);ctx.fillRect(pxx+1,pyy-8,2,2);
  
  // Debug text
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(5,5,W-50,80);
  ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.textAlign='left';
  ctx.fillText(touchLog,10,20);
  ctx.fillText(`Player: ${px.toFixed(1)},${py.toFixed(1)}`,10,35);
  ctx.fillText(`Path length: ${path.length}`,10,50);
  ctx.fillText(`W:${W} H:${H}`,10,65);
  
  // Minimap
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();ctx.arc(W-30,30,20,0,Math.PI*2);ctx.fill();
  for(let y=0;y<MH;y+=2)for(let x=0;x<MW;x+=2){ctx.fillStyle='#4caf50';ctx.fillRect(W-30+x*1.3,30+y*1.3,2,2);}
  ctx.fillStyle='#ffeb3b';ctx.fillRect(W-30+px*1.3-1,30+py*1.3-1,3,3);
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
