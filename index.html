<!DOCTYPE html>
<html>
<head><title>PachaMirai Test</title>
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:red}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
c.width=window.innerWidth;c.height=window.innerHeight;

// Solo dibujar un círculo en el centro
ctx.fillStyle='green';
ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle='blue';
ctx.beginPath();
ctx.arc(c.width/2,c.height/2,50,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='white';
ctx.font='20px monospace';
ctx.textAlign='center';
ctx.fillText('TEST: '+c.width+'x'+c.height,c.width/2,c.height/2);

requestAnimationFrame(function loop(){
  ctx.fillStyle='rgba(0,0,0,0.1)';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.arc(c.width/2+Math.sin(Date.now()*0.003)*30,c.height/2,10,0,Math.PI*2);
  ctx.fill();
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
