<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;background:#000;touch-action:none;user-select:none}html,body{width:100%;height:100%;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const N=7;
const STEP=Math.min(W,H)/(N+1);
const TW=STEP,TH=STEP/2;

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}
function center(){const c=iso((N-1)/2,(N-1)/2);return{x:W/2-c.x,y:H/2-c.y};}
function s2g(sx,sy){const c=center();const rx=sx-c.x,ry=sy-c.y;return{x:Math.round((rx/(TW/2)+ry/(TH/2))/2),y:Math.round((ry/(TH/2)-rx/(TW/2))/2)};}

const world=[];
for(let y=0;y<N;y++){world[y]=[];for(let x=0;x<N;x++){world[y][x]=0;}}

const pl={gx:3,gy:3,fx:3.0,fy:3.0,path:[],frame:0,ft:0,hp:100,mhp:100};
const en=[{x:2,y:2,hp:40,mhp:40,c:'#c62828'},{x:5,y:3,hp:50,mhp:50,c:'#6a1b9a'},{x:3,y:5,hp:30,mhp:30,c:'#1565c0'}];

function bfs(sx,sy,gx,gy){
  if(gx<0||gx>=N||gy<0||gy>=N)return[];
  const q=[{x:sx,y:sy,p:[]}];const v=new Set([sx+','+sy]);
  while(q.length){const c=q.shift();if(c.x===gx&&c.y===gy)return c.p;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=c.x+dx,ny=c.y+dy,k=nx+','+ny;if(nx<0||nx>=N||ny<0||ny>=N||v.has(k))continue;let b=false;for(const e of en)if(e.x===nx&&e.y===ny&&e.hp>0){b=true;break;}if(b)continue;v.add(k);q.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]});}}
  return[];
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(pl.path.length>0)return;
  const t=e.changedTouches[0];
  const g=s2g(t.clientX,t.clientY);
  if(g.x<0||g.x>=N||g.y<0||g.y>=N)return;
  pl.path=bfs(pl.gx,pl.gy,g.x,g.y);
},{passive:false});

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;

  if(pl.path.length>0){
    const t=pl.path[0];
    const dx=t.x-pl.fx,dy=t.y-pl.fy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const speed=3*dt;
    if(dist<speed||dist<0.01){pl.fx=t.x;pl.fy=t.y;pl.gx=t.x;pl.gy=t.y;pl.path.shift();}
    else{pl.fx+=dx/dist*speed;pl.fy+=dy/dist*speed;}
    pl.ft+=dt;if(pl.ft>0.12){pl.ft=0;pl.frame=(pl.frame+1)%2;}
  }

  ctx.fillStyle='#0d1b0d';ctx.fillRect(0,0,W,H);
  const c=center();

  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const s=iso(x,y),sx=s.x+c.x,sy=s.y+c.y;
    const inPath=pl.path.find(p=>p.x===x&&p.y===y);
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();
    ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#2e7d32';ctx.lineWidth=2;ctx.stroke();
    if(inPath){ctx.fillStyle='rgba(180,180,80,0.15)';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();ctx.fill();}
  }

  for(const e of en){
    if(e.hp<=0)continue;
    const s=iso(e.x,e.y),sx=s.x+c.x,sy=s.y+c.y;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(sx,sy+12,10,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=e.c;ctx.fillRect(sx-7,sy-5,14,14);ctx.fillStyle='#fff';ctx.fillRect(sx-5,sy-3,3,3);ctx.fillRect(sx+2,sy-3,3,3);
    ctx.fillStyle='#333';ctx.fillRect(sx-12,sy-14,24,4);ctx.fillStyle='#e44';ctx.fillRect(sx-11,sy-13,22*e.hp/e.mhp,2);
  }

  const p=iso(pl.fx,pl.fy),px=p.x+c.x,py=p.y+c.y-TH-12,bo=pl.frame===0?0:1;
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(px,py+28,12,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';ctx.fillRect(px-5,py+12,4,8+bo);ctx.fillRect(px+1,py+12,4,8+bo);
  ctx.fillStyle='#1976d2';ctx.fillRect(px-8,py-4,16,18);ctx.fillStyle='#1565c0';ctx.fillRect(px-8,py-4,16,5);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-8,py+8,16,3);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-5,py-14,10,9);ctx.fillStyle='#3e2723';ctx.fillRect(px-5,py-16,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(px-3,py-10,3,3);ctx.fillRect(px+1,py-10,3,3);
  ctx.fillStyle='#000';ctx.fillRect(px-2,py-9,2,2);ctx.fillRect(px+2,py-9,2,2);

  ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(10,10,140,50);
  ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('Lv.1 Hero',18,26);
  ctx.fillStyle='#4a0000';ctx.fillRect(18,34,120,9);ctx.fillStyle='#e44';ctx.fillRect(19,35,118,7);
  ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.fillText('100/100',65,40);

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
