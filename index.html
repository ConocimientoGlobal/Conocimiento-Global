<!DOCTYPE html>
<html>
<head><title>PachaMirai</title>
<style>*{margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000}</style>
</head>
<body>
<canvas id="c" style="display:block;position:fixed;top:0;left:0;width:100%;height:100%"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=window.innerWidth;H=window.innerHeight;c.width=W;c.height=H;}
window.addEventListener('resize',resize);resize();

const TILE_W=64,TILE_H=32;
const MAP_W=20,MAP_H=20;
const player={x:10,y:10,px:10,py:10,frame:0,ft:0,hp:100,mhp:100,mp:50,mmp:50,lv:1,xp:0};

// Mundo
const world=[];
for(let y=0;y<MAP_H;y++){world[y]=[];for(let x=0;x<MAP_W;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%10<2)t=1;else if(v%15<2)t=2;else if(v%20<2)t=3;else if(v%25<2)t=4;else if(v%12<1)t=5;else if(v%18<1)t=6;world[y][x]=t;}}

const enemies=[];
for(let i=0;i<5;i++){enemies.push({x:5+(i*3)%12,y:5+(i*2)%12,type:i,hp:40+i*10,mhp:40+i*10,c:['#c62828','#6a1b9a','#1565c0','#2e7d32','#e65100'][i]});}

function toIso(x,y){return{x:(x-y)*TILE_W/2,y:(x+y)*TILE_H/2};}

let jx=0,jy=0,ja=false,jsX=0,jsY=0,jid=null;

c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];if(t.clientX<W*0.5){ja=true;jid=t.identifier;jsX=t.clientX;jsY=t.clientY;jx=0;jy=0;}},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(!ja)return;for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];if(t.identifier===jid){const dx=t.clientX-jsX,dy=t.clientY-jsY;const d=Math.sqrt(dx*dx+dy*dy);if(d>20){jx=dx*20/d;jy=dy*20/d;}else{jx=dx/20;jy=dy/20;}}}},{passive:false});
c.addEventListener('touchend',e=>{for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===jid){ja=false;jx=0;jy=0;jid=null;}}},{passive:false});

const keys={};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  let mx=0,my=0;
  if(ja){mx=jx;my=jy;}
  if(keys['ArrowUp']||keys['w'])my=-1;
  if(keys['ArrowDown']||keys['s'])my=1;
  if(keys['ArrowLeft']||keys['a'])mx=-1;
  if(keys['ArrowRight']||keys['d'])mx=1;
  
  if(mx!==0||my!==0){
    const speed=6*dt;
    const nx=player.x+mx*speed;
    const ny=player.y+my*speed;
    if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&world[Math.floor(ny)][Math.floor(nx)]!==1){
      player.x=nx;player.y=ny;
      player.ft+=dt;if(player.ft>0.2){player.ft=0;player.frame=(player.frame+1)%2;}
    }
  }
  
  // Colisión
  for(const e of enemies){if(e.hp>0&&Math.abs(e.x-player.x)<1.2&&Math.abs(e.y-player.y)<1.2){e.hp-=5;if(e.hp<=0){player.xp+=25;}}}
  
  // Render
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  
  // Cámara isométrica
  const cam=toIso(player.x,player.y);
  const ox=W/2-cam.x;
  const oy=H/2-cam.y;
  
  // Tiles
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const iso=toIso(x,y);
    const sx=iso.x+ox;
    const sy=iso.y+oy;
    if(sx<-TILE_W||sx>W+TILE_W||sy<-TILE_H*2||sy>H+TILE_H)continue;
    
    const t=world[y][x];
    ctx.beginPath();
    ctx.moveTo(sx,sy);ctx.lineTo(sx+TILE_W/2,sy+TILE_H/2);ctx.lineTo(sx,sy+TILE_H);ctx.lineTo(sx-TILE_W/2,sy+TILE_H/2);ctx.closePath();
    
    if(t===0){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();}
    else if(t===1){ctx.fillStyle='#1565c0';ctx.fill();ctx.strokeStyle='#0d47a1';ctx.stroke();}
    else if(t===2){ctx.fillStyle='#8d6e63';ctx.fill();ctx.strokeStyle='#5d4037';ctx.stroke();}
    else if(t===3){ctx.fillStyle='#757575';ctx.fill();ctx.strokeStyle='#424242';ctx.stroke();}
    else if(t===4){ctx.fillStyle='#e0c878';ctx.fill();ctx.strokeStyle='#c8a840';ctx.stroke();}
    else if(t===5){
      ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();
      ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.moveTo(sx,sy-20);ctx.lineTo(sx-12,sy+2);ctx.lineTo(sx+12,sy+2);ctx.closePath();ctx.fill();
      ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy+2,4,8);
    }
    else if(t===6){
      ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();
      ctx.fillStyle='#9e9e9e';ctx.beginPath();ctx.ellipse(sx,sy+8,10,6,0,Math.PI,0);ctx.fill();
    }
    
    // Briznas pasto
    if(t===0){ctx.fillStyle='#7cb342';ctx.fillRect(sx-5,sy+4,1,3);ctx.fillRect(sx+3,sy+6,1,3);ctx.fillRect(sx+7,sy+5,1,2);}
  }
  
  // Enemigos
  for(const e of enemies){
    if(e.hp<=0)continue;
    const iso=toIso(e.x,e.y);
    const sx=iso.x+ox;
    const sy=iso.y+oy;
    if(sx<-50||sx>W+50||sy<-50||sy>H+50)continue;
    
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+12,8,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=e.c;ctx.fillRect(sx-6,sy-4,12,14);
    ctx.fillStyle='#fff';ctx.fillRect(sx-4,sy-2,3,3);ctx.fillRect(sx+1,sy-2,3,3);
    ctx.fillStyle='#000';ctx.fillRect(sx-3,sy-1,2,2);ctx.fillRect(sx+2,sy-1,2,2);
    ctx.fillStyle='#333';ctx.fillRect(sx-12,sy-12,24,4);
    ctx.fillStyle='#e44';ctx.fillRect(sx-11,sy-11,22*e.hp/e.mhp,2);
  }
  
  // Jugador
  const piso=toIso(player.x,player.y);
  const px=piso.x+ox;
  const py=piso.y+oy;
  const bo=player.frame===0?0:1;
  
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(px,py+16,10,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';ctx.fillRect(px-5,py+4,3,8+bo);ctx.fillRect(px+2,py+4,3,8+bo);
  ctx.fillStyle='#1976d2';ctx.fillRect(px-7,py-6,14,12);
  ctx.fillStyle='#1565c0';ctx.fillRect(px-7,py-6,14,3);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-7,py,14,2);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-5,py-12,10,6);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-5,py-14,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(px-3,py-10,2,2);ctx.fillRect(px+1,py-10,2,2);
  ctx.fillStyle='#000';ctx.fillRect(px-2,py-9,1,1);ctx.fillRect(px+2,py-9,1,1);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-9,py-4,2,5);ctx.fillRect(px+7,py-4,2,5);
  ctx.fillStyle='#333';ctx.fillRect(px-12,py-18,24,4);
  ctx.fillStyle='#4f4';ctx.fillRect(px-11,py-17,22*player.hp/player.mhp,2);
  
  // Joystick
  if(ja){ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(80,H-80,40,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.7)';ctx.beginPath();ctx.arc(80+jx*30,H-80+jy*30,15,0,Math.PI*2);ctx.fill();}
  
  // UI
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(10,10,120,50);
  ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.textAlign='left';
  ctx.fillText(`Lv.${player.lv} HP:${player.hp}/${player.mhp}`,20,28);
  ctx.fillStyle='#e44';ctx.fillRect(20,35,100,6);ctx.fillStyle='#4a0000';ctx.fillRect(20,35,100*player.hp/player.mhp,6);
  ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.fillText(`Pos:${player.x.toFixed(0)},${player.y.toFixed(0)}`,20,52);
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
