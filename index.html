<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=window.innerWidth;H=window.innerHeight;c.width=W;c.height=H;}
window.addEventListener('resize',resize);resize();

// Configuración
const TILE_W=64, TILE_H=32, MAP_W=30, MAP_H=30;
const player={x:MAP_W/2,y:MAP_H/2,hp:100,mhp:100,mp:50,mmp:50,xp:0,lv:1};
const enemies=[];
const particles=[];

// Mundo
const world=[];
for(let y=0;y<MAP_H;y++){world[y]=[];for(let x=0;x<MAP_W;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%12<2)t=1;else if(v%18<2)t=2;else if(v%25<2)t=3;else if(v%30<2)t=4;else if(v%15<1)t=5;else if(v%22<1)t=6;world[y][x]=t;}}

// Enemigos
const et=['👹','💀','👻','🐺'];
for(let i=0;i<6;i++){enemies.push({x:5+(i*4)%20,y:5+(i*3)%20,type:et[i%4],hp:30+i*5,mhp:30+i*5});}

// Conversion isometrica
function toIso(x,y){return{x:(x-y)*TILE_W/2,y:(x+y)*TILE_H/2};}
function toGrid(sx,sy){return{x:Math.floor((sx/(TILE_W/2)+sy/(TILE_H/2))/2),y:Math.floor((sy/(TILE_H/2)-sx/(TILE_W/2))/2)};}

// Dibujo
function drawTile(t,sx,sy){
  const x=sx-TILE_W/2,y=sy;
  ctx.beginPath();
  ctx.moveTo(sx,sy);ctx.lineTo(x+TILE_W,sy);ctx.lineTo(sx,sy+TILE_H);ctx.lineTo(x,sy+TILE_H);ctx.closePath();
  if(t===0){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();}
  else if(t===1){ctx.fillStyle='#1565c0';ctx.fill();ctx.strokeStyle='#0d47a1';ctx.stroke();}
  else if(t===2){ctx.fillStyle='#8d6e63';ctx.fill();ctx.strokeStyle='#5d4037';ctx.stroke();}
  else if(t===3){ctx.fillStyle='#757575';ctx.fill();ctx.strokeStyle='#424242';ctx.stroke();}
  else if(t===4){ctx.fillStyle='#e0c878';ctx.fill();ctx.strokeStyle='#c8a840';ctx.stroke();}
  else if(t===5){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#2e7d32';ctx.stroke();ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.moveTo(sx,sy-20);ctx.lineTo(sx-12,sy);ctx.lineTo(sx+12,sy);ctx.closePath();ctx.fill();ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy,4,8);}
  else if(t===6){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#2e7d32';ctx.stroke();ctx.fillStyle='#9e9e9e';ctx.beginPath();ctx.arc(sx,sy+10,8,Math.PI,0);ctx.fill();}
  else{ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();}
}

function drawPlayer(sx,sy){
  ctx.font='32px serif';
  ctx.textAlign='center';
  ctx.fillText('🦸',sx,sy+10);
}

function drawEnemy(e,sx,sy){
  ctx.font='28px serif';
  ctx.textAlign='center';
  ctx.fillText(e.type,sx,sy+10);
  // HP bar
  ctx.fillStyle='#333';ctx.fillRect(sx-15,sy-20,30,4);
  ctx.fillStyle='#e44';ctx.fillRect(sx-15,sy-20,30*e.hp/e.mhp,4);
}

function drawUI(){
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.fillRect(10,10,150,80);
  ctx.fillStyle='#fff';ctx.font='14px monospace';
  ctx.textAlign='left';
  ctx.fillText(`Lv.${player.lv} HP:${player.hp}/${player.mhp}`,20,30);
  ctx.fillText(`MP:${player.mp}/${player.mmp}`,20,50);
  ctx.fillText(`XP:${player.xp}/100`,20,70);
  
  // Minimap
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.fillRect(W-90,10,80,80);
  ctx.fillStyle='#4caf50';
  for(let y=0;y<MAP_H;y+=3)for(let x=0;x<MAP_W;x+=3){
    const t=world[y][x];
    if(t===1)ctx.fillStyle='#1565c0';
    else if(t===2)ctx.fillStyle='#8d6e63';
    else if(t===3)ctx.fillStyle='#757575';
    else ctx.fillStyle='#4caf50';
    ctx.fillRect(W-85+x*2.3,15+y*2.3,3,3);
  }
  ctx.fillStyle='#ff0';
  ctx.fillRect(W-85+player.x*2.3,15+player.y*2.3,4,4);
}

// Loop principal
let last=performance.now();
function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  // Fondo
  ctx.fillStyle='#1a3a1a';ctx.fillRect(0,0,W,H);
  
  // Centrar cámara en jugador
  const camX=toIso(player.x,player.y);
  const offsetX=W/2-camX.x;
  const offsetY=H/2-camX.y;
  
  // Dibujo del mundo
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      const iso=toIso(x,y);
      const sx=iso.x+offsetX;
      const sy=iso.y+offsetY;
      if(sx<-TILE_W||sx>W+TILE_W||sy<-TILE_H*2||sy>H+TILE_H*2)continue;
      drawTile(world[y][x],sx,sy);
    }
  }
  
  // Enemigos
  for(const e of enemies){
    const iso=toIso(e.x,e.y);
    drawEnemy(e,iso.x+offsetX,iso.y+offsetY);
  }
  
  // Jugador
  const piso=toIso(player.x,player.y);
  drawPlayer(piso.x+offsetX,piso.y+offsetY);
  
  // UI
  drawUI();
  
  // Debug
  ctx.fillStyle='#ff0';ctx.font='12px monospace';ctx.textAlign='left';
  ctx.fillText(`Pos:${player.x.toFixed(0)},${player.y.toFixed(0)} | Enemigos:${enemies.length}`,10,H-20);
  
  requestAnimationFrame(loop);
}

// Controles
let jx=0,jy=0,ja=false,jsX=0,jsY=0,jid=null;

c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];if(t.clientX<W*0.5){ja=true;jid=t.identifier;jsX=t.clientX;jsY=t.clientY;jx=0;jy=0;}},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(!ja)return;for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];if(t.identifier===jid){const dx=t.clientX-jsX,dy=t.clientY-jsY;const d=Math.sqrt(dx*dx+dy*dy);if(d>20){jx=dx*20/d;jy=dy*20/d;}else{jx=dx/20;jy=dy/20;}}}},{passive:false});
c.addEventListener('touchend',e=>{for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===jid){ja=false;jx=0;jy=0;jid=null;}}},{passive:false});

// Movimiento
setInterval(()=>{
  if(jx!==0||jy!==0){
    const newX=player.x+jx*0.15;
    const newY=player.y+jy*0.15;
    if(newX>=0&&newX<MAP_W&&newY>=0&&newY<MAP_H&&world[Math.floor(newY)][Math.floor(newX)]!==1){
      player.x=newX;player.y=newY;
      // Colisión con enemigos
      for(const e of enemies){
        if(Math.abs(e.x-player.x)<1&&Math.abs(e.y-player.y)<1){
          e.hp-=10;
          if(e.hp<=0){e.x=-100;e.y=-100;player.xp+=20;}
        }
      }
    }
  }
},50);

// Teclado
const keys={};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);
setInterval(()=>{
  let mx=0,my=0;
  if(keys['ArrowUp']||keys['w'])my=-1;
  if(keys['ArrowDown']||keys['s'])my=1;
  if(keys['ArrowLeft']||keys['a'])mx=-1;
  if(keys['ArrowRight']||keys['d'])mx=1;
  if(mx!==0||my!==0){
    const newX=player.x+mx*0.15;
    const newY=player.y+my*0.15;
    if(newX>=0&&newX<MAP_W&&newY>=0&&newY<MAP_H&&world[Math.floor(newY)][Math.floor(newX)]!==1){
      player.x=newX;player.y=newY;
    }
  }
},50);

last=performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
