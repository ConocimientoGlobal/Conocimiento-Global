<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;background:#000;box-sizing:border-box;touch-action:none;user-select:none}html,body{width:100%;height:100%;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const MW=18,MH=18,TW=96,TH=48;

// Mundo: 0=tierra, 1=agua
const world=[];
for(let y=0;y<MH;y++){
  world[y]=[];
  for(let x=0;x<MW;x++){
    const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
    world[y][x]=v%14<2?1:0;
  }
}

// Jugador
let pl={
  cx:9,cy:9,         // Celda actual (entera, NUNCA se mueve hasta llegar exacto)
  fx:9,fy:9,         // Posición visual (float, para animación)
  path:[],           // Camino restante
  moving:false,
  anim_t:0,          // Tiempo de animación actual
  frame:0,           // Frame de animación
  ft:0,
  hp:100,mhp:100
};

const en=[
  {x:5,y:5,hp:40,mhp:40,c:'#c62828'},
  {x:12,y:8,hp:50,mhp:50,c:'#6a1b9a'},
  {x:8,y:14,hp:30,mhp:30,c:'#1565c0'}
];

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

// Convertir pantalla → celda (redondeado)
function s2g(screenX,screenY){
  const cam=iso(pl.fx,pl.fy);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  const wx=screenX-ox,wy=screenY-oy;
  return {
    x:Math.round((wx/(TW/2)+wy/(TH/2))/2),
    y:Math.round((wy/(TH/2)-wx/(TW/2))/2)
  };
}

// BFS Pathfinding
function findPath(sx,sy,gx,gy){
  if(gx<0||gx>=MW||gy<0||gy>=MH||world[gy][gx]===1)return [];
  const open=[{x:sx,y:sy,path:[]}];
  const vis=new Set();
  vis.add(sx+','+sy);
  
  while(open.length){
    const c=open.shift();
    if(c.x===gx&&c.y===gy)return c.path;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=c.x+dx,ny=c.y+dy,k=nx+','+ny;
      if(nx<0||nx>=MW||ny<0||ny>=MH)continue;
      if(vis.has(k)||world[ny][nx]===1)continue;
      let blocked=false;
      for(const e of en)if(e.x===nx&&e.y===ny&&e.hp>0){blocked=true;break;}
      if(blocked)continue;
      vis.add(k);
      open.push({x:nx,y:ny,path:[...c.path,{x:nx,y:ny}]});
    }
  }
  return [];
}

// Touch = mover
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(pl.moving)return;
  
  const t=e.changedTouches[0];
  const g=s2g(t.clientX,t.clientY);
  
  // Validar destino
  if(g.x<0||g.x>=MW||g.y<0||g.y>=MH)return;
  if(world[g.y][g.x]===1)return;
  for(const e of en)if(e.x===g.x&&e.y===g.y&&e.hp>0)return;
  
  pl.path=findPath(pl.cx,pl.cy,g.x,g.y);
},{passive:false});

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  // Avanjar path: mover fx,fy hacia la próxima celda
  if(pl.path.length>0){
    const target=pl.path[0];
    const speed=4; // celdas por segundo
    
    const dx=target.x-pl.fx;
    const dy=target.y-pl.fy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    
    if(dist<0.05){
      // Llegó exactamente a la celda
      pl.fx=target.x;
      pl.fy=target.y;
      pl.cx=target.x;
      pl.cy=target.y;
      pl.path.shift();
    }else{
      // Mover hacia el objetivo
      const step=speed*dt;
      pl.fx+=dx/dist*Math.min(step,dist);
      pl.fy+=dy/dist*Math.min(step,dist);
    }
    
    // Animación de caminar
    pl.ft+=dt;
    if(pl.ft>0.15){pl.ft=0;pl.frame=(pl.frame+1)%2;}
  }
  
  // === RENDER ===
  ctx.fillStyle='#0d1b0d';ctx.fillRect(0,0,W,H);
  
  // Cámara
  const cam=iso(pl.fx,pl.fy);
  const ox=W/2-cam.x;
  const oy=H/2-cam.y;
  
  // Tiles
  for(let y=0;y<MH;y++){
    for(let x=0;x<MW;x++){
      const s=iso(x,y);
      const sx=s.x+ox;
      const sy=s.y+oy;
      
      // Frustum culling
      if(sx<-TW||sx>W+TW||sy<-TH*2||sy>H+TH)continue;
      
      const t=world[y][x];
      const inPath=pl.path.find(p=>p.x===x&&p.y===y);
      
      // Dibujar tile
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.lineTo(sx+TW/2,sy+TH/2);
      ctx.lineTo(sx,sy+TH);
      ctx.lineTo(sx-TW/2,sy+TH/2);
      ctx.closePath();
      
      if(t===1){
        // Agua
        ctx.fillStyle='#1565c0';ctx.fill();
        ctx.strokeStyle='#4fc3f7';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(sx-10,sy+12,8,2);
      }else{
        // Tierra
        ctx.fillStyle='#4caf50';ctx.fill();
        ctx.strokeStyle='#2e7d32';ctx.lineWidth=2;ctx.stroke();
        
        // Sombra inferior (efecto 3D)
        ctx.fillStyle='rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.moveTo(sx,sy+TH);
        ctx.lineTo(sx+TW/2,sy+TH/2);
        ctx.lineTo(sx+TW/2,sy+TH);
        ctx.lineTo(sx,sy+TH+TH/2);
        ctx.closePath();ctx.fill();
        
        ctx.fillStyle='rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.moveTo(sx,sy+TH);
        ctx.lineTo(sx-TW/2,sy+TH/2);
        ctx.lineTo(sx-TW/2,sy+TH);
        ctx.lineTo(sx,sy+TH+TH/2);
        ctx.closePath();ctx.fill();
        
        // Pasto
        ctx.fillStyle='#7cb342';
        ctx.fillRect(sx-8,sy+8,2,4);
        ctx.fillRect(sx+5,sy+12,2,4);
      }
      
      // Camino con brillo suave
      if(inPath){
        ctx.fillStyle='rgba(255,255,100,0.15)';
        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(sx+TW/2,sy+TH/2);
        ctx.lineTo(sx,sy+TH);
        ctx.lineTo(sx-TW/2,sy+TH/2);
        ctx.closePath();ctx.fill();
      }
    }
  }
  
  // Enemigos
  for(const e of en){
    if(e.hp<=0)continue;
    const s=iso(e.x,e.y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-60||sx>W+60||sy<-60||sy>H+60)continue;
    
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath();ctx.ellipse(sx,sy+14,10,4,0,0,Math.PI*2);ctx.fill();
    
    ctx.fillStyle=e.c;ctx.fillRect(sx-7,sy-5,14,14);
    ctx.fillStyle='#fff';ctx.fillRect(sx-5,sy-3,3,3);ctx.fillRect(sx+2,sy-3,3,3);
    ctx.fillStyle='#000';ctx.fillRect(sx-4,sy-2,2,2);ctx.fillRect(sx+3,sy-2,2,2);
    
    ctx.fillStyle='#333';ctx.fillRect(sx-12,sy-14,24,4);
    ctx.fillStyle='#e44';ctx.fillRect(sx-11,sy-13,22*e.hp/e.mhp,2);
  }
  
  // Jugador
  const p=iso(pl.fx,pl.fy);
  const px=p.x+ox,py=p.y-12;
  const bo=pl.frame===0?0:1;
  
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.ellipse(px,py+16,12,5,0,0,Math.PI*2);ctx.fill();
  
  ctx.fillStyle='#5d4037';ctx.fillRect(px-5,py+4,4,8+bo);ctx.fillRect(px+1,py+4,4,8+bo);
  ctx.fillStyle='#1976d2';ctx.fillRect(px-8,py-8,16,14);
  ctx.fillStyle='#1565c0';ctx.fillRect(px-8,py-8,16,4);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-8,py+2,16,3);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-5,py-14,10,7);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-5,py-16,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(px-3,py-12,3,3);ctx.fillRect(px+1,py-12,3,3);
  ctx.fillStyle='#000';ctx.fillRect(px-2,py-11,2,2);ctx.fillRect(px+2,py-11,2,2);
  
  // UI
  ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(10,10,140,50);
  ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('Lv.1 Hero',18,26);
  ctx.fillStyle='#4a0000';ctx.fillRect(18,34,120,9);
  ctx.fillStyle='#e44';ctx.fillRect(19,35,118*pl.hp/pl.mhp,7);
  ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.fillText('100/100',65,40);
  
  ctx.fillStyle='#0f0';ctx.font='11px monospace';ctx.textAlign='left';
  ctx.fillText('Cell:'+pl.cx+','+pl.cy+' P:'+pl.path.length+' F:'+pl.frame,10,H-15);
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
