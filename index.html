<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body style="margin:0;padding:0;background:red;width:100%;height:100%">
<div style="color:white;font-size:24px;padding:20px">Hola Mundo</div>
<canvas id="c" width="300" height="300" style="display:block;background:yellow"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
ctx.fillStyle='green';
ctx.fillRect(50,50,200,100);
ctx.fillStyle='white';
ctx.font='20px monospace';
ctx.fillText('CANVAS OK',80,110);
</script>
</body>
</html>
