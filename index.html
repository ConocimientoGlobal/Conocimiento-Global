<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;background:#000;touch-action:none;user-select:none}html,body{width:100%;height:100%;overflow:hidden}canvas{display:block;position:fixed;top:0;left:0}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
const PS=4; // tamaño del pixel 16-bit

function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const WORLD_W=64,WORLD_H=64,VR=12;

const BIOMAS=[
  {id:0,n:'Pueblo',t:['#4caf50','#388e3c','#66bb6a'],w:'#0288d1'},
  {id:1,n:'Bosque',t:['#2e7d32','#1b5e20','#388e3c'],w:'#1565c0'},
  {id:2,n:'Desierto',t:['#f9a825','#f57f17','#ffb300'],w:'#0288d1'},
  {id:3,n:'Montaña',t:['#9e9e9e','#757575','#bdbdbd'],w:'#1565c0'},
  {id:4:n:'Pantano',t:['#5d4037','#4e342e','#6d4c41'],w:'#0277bd'},
  {id:5,n:'Volcan',t:['#d84315','#bf360c','#e64a19'],w:'#d84315'},
  {id:6,n:'Castillo',t:['#37474f','#263238','#455a64'],w:'#1565c0'}
];

function getBioma(x,y){
  const m=[[0,1,1,2,2,5,5,5],[1,1,2,2,3,5,5,6],[1,2,2,3,3,5,6,6],[2,2,3,3,4,5,6,6],[2,3,3,4,4,6,6,6],[3,3,4,4,4,6,6,6],[3,4,4,4,6,6,6,6],[4,4,4,6,6,6,6]];
  return m[Math.min(7,Math.floor(y/8))][Math.min(7,Math.floor(x/8))];
}

const world=[];
for(let y=0;y<WORLD_H;y++){
  world[y]=[];
  for(let x=0;x<WORLD_W;x++){
    if(x<1||x>=WORLD_W-1||y<1||y>=WORLD_H-1)world[y][x]=1;
    else{const v=((x*37+y*67)^0x5bf03635)>>>0;world[y][x]=(v%20<1)?1:0;}
  }
}
world[8][8]=0;

const pl={gx:8,gy:8,fx:8,fy:8,path:[],frame:0,ft:0,hp:100};

function loop(){
  const W=c.width,H=c.height;
  const TW=Math.min(W,H)/4;
  const TH=TW/2;
  
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  
  // Movimiento
  if(pl.path.length>0){
    const t=pl.path[0];
    const dx=t.x-pl.fx,dy=t.y-pl.fy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<0.05){pl.fx=t.x;pl.fy=t.y;pl.gx=t.x;pl.gy=t.y;pl.path.shift();}
    else{pl.fx+=dx/dist*0.04;pl.fy+=dy/dist*0.04;}
    pl.ft+=1/60;
    if(pl.ft>0.15){pl.ft=0;pl.frame=(pl.frame+1)%2;}
  }
  
  // Cámara
  const camX=W/2-(pl.fx-pl.fy)*TW/2;
  const camY=H/2-(pl.fx+pl.fy)*TH/2;
  
  const pgx=Math.floor(pl.gx),pgy=Math.floor(pl.gy);
  
  // Tiles
  for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR);y++){
    for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR);x++){
      const sx=(x-y)*TW/2+camX;
      const sy=(x+y)*TH/2+camY;
      
      // Diamante
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.lineTo(sx+TW/2,sy+TH/2);
      ctx.lineTo(sx,sy+TH);
      ctx.lineTo(sx-TW/2,sy+TH/2);
      ctx.closePath();
      
      if(world[y][x]===1){
        ctx.fillStyle=BIOMAS[getBioma(x,y)].w;
        ctx.fill();
        ctx.strokeStyle='rgba(100,180,220,0.3)';
        ctx.lineWidth=1;
        ctx.stroke();
      }else{
        const bio=BIOMAS[getBioma(x,y)];
        const v=((x*37+y*67)^0x5bf03635)>>>0;
        ctx.fillStyle=bio.t[v%bio.t.length];
        ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.1)';
        ctx.lineWidth=1;
        ctx.stroke();
      }
    }
  }
  
  // Jugador
  const px=(pl.fx-pl.fy)*TW/2+camX;
  const py=(pl.fx+pl.fy)*TH/2+camY;
  
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(px,py+TH/2,TW/8,TH/8,0,0,Math.PI*2);ctx.fill();
  
  ctx.fillStyle='#1976d2';
  ctx.fillRect(px-TW/10,py+TH/2-TH/1.5,TW/5,TH/2.5);
  
  ctx.fillStyle='#ffe0b2';
  ctx.fillRect(px-TW/16,py+TH/2-TH/1.2,TW/8,TH/6);
  
  ctx.fillStyle='#fff';
  ctx.fillRect(px-TW/25,py+TH/2-TH/1.4,2,2);
  ctx.fillRect(px+TW/50,py+TH/2-TH/1.4,2,2);
  
  // UI
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.fillRect(10,10,100,35);
  ctx.fillStyle='#fff';
  ctx.font='10px monospace';
  ctx.fillText('Lv.1 Hero',15,22);
  ctx.fillStyle='#4a0000';
  ctx.fillRect(15,28,90,4);
  ctx.fillStyle='#e44';
  ctx.fillRect(16,29,88*pl.hp/100,2);
  
  requestAnimationFrame(loop);
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(pl.path.length>0)return;
  
  const W=c.width,H=c.height;
  const TW=Math.min(W,H)/4;
  const TH=TW/2;
  const camX=W/2-(pl.fx-pl.fy)*TW/2;
  const camY=H/2-(pl.fx+pl.fy)*TH/2;
  
  const t=e.changedTouches[0];
  const rx=t.clientX-camX;
  const ry=t.clientY-camY;
  const gx=Math.floor((rx/(TW/2)+ry/(TH/2))/2);
  const gy=Math.floor((ry/(TH/2)-rx/(TW/2))/2);
  
  if(gx<0||gx>=WORLD_W||gy<0||gy>=WORLD_H)return;
  if(world[gy][gx]!==0)return;
  
  // Pathfinding BFS
  const open=[{x:pl.gx,y:pl.gy,p:[]}];
  const vis=new Set();
  vis.add(pl.gx+','+pl.gy);
  while(open.length){
    const c=open.shift();
    if(c.x===gx&&c.y===gy){pl.path=c.p;break;}
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=c.x+dx,ny=c.y+dy,k=nx+','+ny;
      if(vis.has(k)||nx<0||nx>=WORLD_W||ny<0||ny>=WORLD_H||world[ny][nx]!==0)continue;
      vis.add(k);
      open.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]});
    }
  }
},{passive:false});

loop();
</script>
</body>
</html>
