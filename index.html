<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PachaMirai v2.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a1a;position:fixed}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();

const TILE_W=64,TILE_H=32,MAP_W=25,MAP_H=25;
const player={x:12,y:12,frame:0,ft:0,hp:100,mhp:100,mp:50,mmp:50,lv:1,xp:0,gold:0};
const world=[];
for(let y=0;y<MAP_H;y++){world[y]=[];for(let x=0;x<MAP_W;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%10<2)t=1;else if(v%15<2)t=2;else if(v%20<2)t=3;else if(v%25<2)t=4;else if(v%12<1)t=5;else if(v%18<1)t=6;world[y][x]=t;}}
const enemies=[{x:8,y:8,hp:40,mhp:40,c:'#c62828'},{x:15,y:10,hp:50,mhp:50,c:'#6a1b9a'},{x:10,y:15,hp:60,mhp:60,c:'#1565c0'},{x:18,y:18,hp:30,mhp:30,c:'#2e7d32'}];
const particles=[];

function toIso(x,y){return{x:(x-y)*TILE_W/2,y:(x+y)*TILE_H/2};}

let joyX=0,joyY=0,joyActive=false,jsX=0,jsY=0;
const buttons=[
  {label:'⚔️',x:0,y:0,r:30,color:'#c62828'},
  {label:'✨',x:0,y:0,r:26,color:'#1565c0'},
  {label:'🐾',x:0,y:0,r:22,color:'#2e7d32'},
  {label:'👆',x:0,y:0,r:26,color:'#ff8f00'}
];

function positionUI(){
  const pad=15;
  const baseY=H-pad;
  buttons[0].x=W-pad-30;buttons[0].y=baseY-100;
  buttons[1].x=W-pad-80;buttons[1].y=baseY-60;
  buttons[2].x=W-pad-30;buttons[2].y=baseY-20;
  buttons[3].x=W-pad-80;buttons[3].y=baseY-20;
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(let t of e.changedTouches){
    if(t.clientX<W*0.5){
      joyActive=true;jsX=t.clientX;jsY=t.clientY;joyX=0;joyY=0;
    } else {
      for(let btn of buttons){
        const dx=t.clientX-btn.x,dy=t.clientY-btn.y;
        if(Math.sqrt(dx*dx+dy*dy)<btn.r){
          if(btn.label==='⚔️'){enemies[0].hp-=10;}
          if(btn.label==='✨'){for(const e of enemies)e.hp-=5;}
          if(btn.label==='🐾'){for(const e of enemies)e.hp-=8;}
          if(btn.label==='👆'){player.x++;if(player.x>=MAP_W)player.x=0;}
          btn.pressed=true;
        }
      }
    }
  }
},{passive:false});

c.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(let t of e.changedTouches){
    if(joyActive){
      const dx=t.clientX-jsX,dy=t.clientY-jsY;
      const d=Math.sqrt(dx*dx+dy*dy);
      const max=40;
      if(d>max){joyX=dx/d;joyY=dy/d;}else{joyX=dx/max;joyY=dy/max;}
    }
  }
},{passive:false});

c.addEventListener('touchend',e=>{joyActive=false;joyX=0;joyY=0;for(let b of buttons)b.pressed=false;},{passive:false});

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  if(joyActive){
    const speed=8*dt;
    const nx=player.x+joyX*speed;
    const ny=player.y+joyY*speed;
    if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&world[Math.floor(ny)][Math.floor(nx)]!==1){
      player.x=nx;player.y=ny;
      player.ft+=dt;if(player.ft>0.2){player.ft=0;player.frame=(player.frame+1)%2;}
    }
  }
  
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  
  const cam=toIso(player.x,player.y);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const iso=toIso(x,y);
    const sx=iso.x+ox,sy=iso.y+oy;
    if(sx<-TILE_W||sx>W+TILE_W||sy<-TILE_H*2||sy>H+TILE_H)continue;
    const t=world[y][x];
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TILE_W/2,sy+TILE_H/2);ctx.lineTo(sx,sy+TILE_H);ctx.lineTo(sx-TILE_W/2,sy+TILE_H/2);ctx.closePath();
    if(t===0){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();ctx.fillStyle='#7cb342';ctx.fillRect(sx-5,sy+4,1,3);ctx.fillRect(sx+3,sy+6,1,3);}
    else if(t===1){ctx.fillStyle='#1565c0';ctx.fill();}
    else if(t===2){ctx.fillStyle='#8d6e63';ctx.fill();}
    else if(t===3){ctx.fillStyle='#757575';ctx.fill();}
    else if(t===4){ctx.fillStyle='#e0c878';ctx.fill();}
    else if(t===5){ctx.fillStyle='#4caf50';ctx.fill();ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.moveTo(sx,sy-20);ctx.lineTo(sx-12,sy+2);ctx.lineTo(sx+12,sy+2);ctx.closePath().ctx.fill();ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy+2,4,8);}
    else{ctx.fillStyle='#4caf50';ctx.fill();ctx.fillStyle='#9e9e9e';ctx.beginPath();ctx.ellipse(sx,sy+8,10,6,0,Math.PI,0).fill();}
  }
  
  for(const e of enemies){
    if(e.hp<=0)continue;
    const iso=toIso(e.x,e.y);
    const sx=iso.x+ox,sy=iso.y+oy;
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+12,8,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=e.c;ctx.fillRect(sx-6,sy-4,12,14);
    ctx.fillStyle='#fff';ctx.fillRect(sx-4,sy-2,3,3);ctx.fillRect(sx+1,sy-2,3,3);
    ctx.fillStyle='#333';ctx.fillRect(sx-12,sy-12,24,4);ctx.fillStyle='#e44';ctx.fillRect(sx-11,sy-11,22*e.hp/e.mhp,2);
  }
  
  const piso=toIso(player.x,player.y);
  const px=piso.x+ox,py=piso.y+oy;
  const bo=player.frame===0?0:1;
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(px,py+16,10,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';ctx.fillRect(px-5,py+4,3,8+bo);ctx.fillRect(px+2,py+4,3,8+bo);
  ctx.fillStyle='#1976d2';ctx.fillRect(px-7,py-6,14,12);ctx.fillStyle='#1565c0';ctx.fillRect(px-7,py-6,14,3);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-7,py,14,2);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-5,py-12,10,6);ctx.fillStyle='#3e2723';ctx.fillRect(px-5,py-14,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(px-3,py-10,2,2);ctx.fillRect(px+1,py-10,2,2);
  ctx.fillStyle='#000';ctx.fillRect(px-2,py-9,1,1);ctx.fillRect(px+2,py-9,1,1);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-9,py-4,2,5);ctx.fillRect(px+7,py-4,2,5);
  
  // Joystick
  if(joyActive){
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.arc(jsX,jsY,50,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(jsX+joyX*40,jsY+joyY*40,18,0,Math.PI*2);ctx.fill();
  }
  
  // Botones
  for(const btn of buttons){
    ctx.fillStyle=btn.pressed?'rgba(255,255,255,0.3)':'rgba(0,0,0,0.6)';
    ctx.beginPath();ctx.arc(btn.x,btn.y,btn.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=btn.color;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=btn.r*0.9+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(btn.label,btn.x,btn.y+2);
  }
  
  // HUD
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,35);
  ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(`Lv.${player.lv} HP:${player.hp}/${player.mhp}`,8,18);
  ctx.fillStyle='#ffc107';ctx.textAlign='right';ctx.fillText(`💰${player.gold}`,W-8,18);
  
  // Debug
  ctx.fillStyle='#0f0';ctx.font='10px monospace';ctx.textAlign='left';
  ctx.fillText(`W:${W} H:${H} S:${(Math.min(W/480,H/270)).toFixed(2)}`,8,H-10);
  
  requestAnimationFrame(loop);
}

positionUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
