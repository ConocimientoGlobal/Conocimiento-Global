<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;background:#000;touch-action:none;user-select:none}html,body{width:100%;height:100%;overflow:hidden}canvas{display:block;position:fixed;top:0;left:0}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// === CONFIG ===
const WORLD_W=64, WORLD_H=64;
let W,H,TW,TH;
const c=document.getElementById('c');
const ctx=c.getContext('2d');

function resize(){
  W=c.width=window.innerWidth;
  H=c.height=window.innerHeight;
  TW=Math.min(W,H)/8;
  TH=TW/2;
}
resize();
window.addEventListener('resize',resize);

// === BIOMAS ===
const BIOMAS=[
  {id:0,nombre:'Pueblo',color1:'#4caf50',color2:'#388e3c',dif:null},
  {id:1,nombre:'Bosque',color1:'#2e7d32',color2:'#1b5e20',dif:null},
  {id:2,nombre:'Desierto',color1:'#f9a825',color2:'#f57f17',dif:'sed'},
  {id:3,nombre:'Montaña',color1:'#9e9e9e',color2:'#757575',dif:'frio'},
  {id:4,nombre:'Pantano',color1:'#5d4037',color2:'#4e342e',dif:'veneno'},
  {id:5,nombre:'Volcán',color1:'#d84315',color2:'#bf360c',dif:'calor'},
  {id:6,nombre:'Castillo',color1:'#37474f',color2:'#263238',dif:null}
];

function getBioma(x,y){
  const bx=Math.min(7,Math.floor(x/8));
  const by=Math.min(7,Math.floor(y/8));
  const m=[
    [0,1,1,2,2,5,5,5],
    [1,1,2,2,3,5,5,6],
    [1,2,2,3,3,5,6,6],
    [2,2,3,3,4,5,6,6],
    [2,3,3,4,4,6,6,6],
    [3,3,4,4,4,6,6,6],
    [3,4,4,4,6,6,6,6],
    [4,4,4,6,6,6,6,6]
  ];
  return m[by][bx];
}

// === MUNDO ===
const world=[];
for(let y=0;y<WORLD_H;y++){
  world[y]=[];
  for(let x=0;x<WORLD_W;x++){
    if(x===0||x===WORLD_W-1||y===0||y===WORLD_H-1)world[y][x]=1;
    else if(BIOMAS[getBioma(x,y)].id===0)world[y][x]=0;
    else{const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;world[y][x]=(v%20<1)?1:0;}
  }
}
world[8][8]=0;

const npcs=[
  {x:6,y:6,n:'Herrero',c:'#e53935'},
  {x:9,y:7,n:'Mago',c:'#8e24aa'},
  {x:7,y:9,n:'Comerciante',c:'#ffb300'}
];
const cofres=[
  {x:10,y:10,o:false},
  {x:25,y:18,o:false},
  {x:40,y:22,o:false}
];

// === JUGADOR ===
const pl={gx:8,gy:8,fx:8,fy:8,path:[],frame:0,ft:0,hp:100,mhp:100,sed:100,temp:100,nivel:1,oro:50};

// === FUNCIONES ===
function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

function getCam(){const p=iso(pl.fx,pl.fy);return{x:W/2-p.x,y:H/2-p.y};}

function s2c(sx,sy){
  const cam=getCam();
  const rx=sx-cam.x,ry=sy-cam.y;
  return{
    x:Math.round((rx/(TW/2)+ry/(TH/2))/2),
    y:Math.round((ry/(TH/2)-rx/(TW/2))/2)
  };
}

function esCam(x,y){
  if(x<0||x>=WORLD_W||y<0||y>=WORLD_H)return false;
  if(world[y][x]!==0)return false;
  return true;
}

function findPath(sx,sy,gx,gy){
  if(!esCam(gx,gy))return[];
  const open=[{x:sx,y:sy,p:[]}];
  const vis=new Set();
  vis.add(sx+','+sy);
  while(open.length){
    const c=open.shift();
    if(c.x===gx&&c.y===gy)return c.p;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=c.x+dx,ny=c.y+dy,k=nx+','+ny;
      if(vis.has(k)||!esCam(nx,ny))continue;
      vis.add(k);
      open.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]});
    }
  }
  return[];
}

function drawDiamond(sx,sy,w,h,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(sx+w/2,sy+h/2);
  ctx.lineTo(sx,sy+h);
  ctx.lineTo(sx-w/2,sy+h/2);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}

function drawPlayer(px,py,bo){
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(px,py+TH/2,8,4,0,0,Math.PI*2);ctx.fill();
  
  ctx.fillStyle='#5d4037';
  ctx.fillRect(px-3,py+TH/2-8,2,9+bo);
  ctx.fillRect(px+1,py+TH/2-8,2,9+bo);
  
  ctx.fillStyle='#1976d2';
  ctx.fillRect(px-7,py+TH/2-22,14,16);
  
  ctx.fillStyle='#ffc107';
  ctx.fillRect(px-7,py+TH/2-8,14,2);
  
  ctx.fillStyle='#ffe0b2';
  ctx.fillRect(px-4,py+TH/2-32,8,7);
  
  ctx.fillStyle='#3e2723';
  ctx.fillRect(px-5,py+TH/2-34,10,4);
  
  ctx.fillStyle='#fff';
  ctx.fillRect(px-2,py+TH/2-29,2,2);
  ctx.fillRect(px+1,py+TH/2-29,2,2);
}

function drawTx(x,y,biome){
  const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
  const sx=0;
  
  if(biome===1){
    ctx.fillStyle='#7cb342';
    ctx.fillRect(x-8,y+TH/2-6,2,7);
    ctx.fillRect(x+5,y+TH/2-4,2,5);
    ctx.fillRect(x-3,y+TH/2-8,2,9);
  } else if(biome===2){
    ctx.fillStyle='#4caf50';
    ctx.fillRect(x-6,y+TH/2-10,4,10);
    ctx.fillRect(x+4,y+TH/2-7,3,7);
  } else if(biome===3){
    ctx.fillStyle='#689f38';
    ctx.fillRect(x-10,y+TH/2-3,2,4);
    ctx.fillRect(x+3,y+TH/2-5,2,5);
    ctx.fillStyle='#757575';
    ctx.fillRect(x+6,y+TH/2-1,2,2);
  } else {
    ctx.fillStyle='#7cb342';
    ctx.fillRect(x-8,y+TH/2-4,2,5);
    ctx.fillRect(x+5,y+TH/2-3,2,4);
    ctx.fillRect(x-2,y+TH/2-6,2,6);
  }
}

function drawTree(x,y,tipo){
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath();ctx.ellipse(x+4,y+TH/2,10,4,0.3,0,Math.PI*2);ctx.fill();
  
  if(tipo==='pino'){
    ctx.fillStyle='#5d4037';
    ctx.fillRect(x-2,y-10,4,12);
    ctx.fillStyle='#2e7d32';
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x-10,y-8);ctx.lineTo(x+10,y-8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#388e3c';
    ctx.beginPath();ctx.moveTo(x,y-25);ctx.lineTo(x-7,y-10);ctx.lineTo(x+7,y-10);ctx.closePath();ctx.fill();
  } else {
    ctx.fillStyle='#5d4037';
    ctx.fillRect(x-3,y-8,5,10);
    ctx.fillStyle='#388e3c';
    ctx.beginPath();ctx.arc(x,y-18,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.beginPath();ctx.arc(x-3,y-20,4,0,Math.PI*2);ctx.fill();
  }
}

function loop(){
  const dt=1/60;
  
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  
  const cam=getCam();
  const pgx=Math.floor(pl.gx),pgy=Math.floor(pl.gy);
  
  // Movimiento
  if(pl.path.length>0){
    const t=pl.path[0];
    const sp=2.5*dt;
    const dx=t.x-pl.fx,dy=t.y-pl.fy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<sp||dist<0.005){
      pl.fx=t.x;pl.fy=t.y;pl.gx=t.x;pl.gy=t.y;pl.path.shift();
    } else {
      pl.fx+=(dx/dist)*sp;pl.fy+=(dy/dist)*sp;
    }
    pl.ft+=dt;
    if(pl.ft>0.15){pl.ft=0;pl.frame=(pl.frame+1)%2;}
  }
  
  const VR=10;
  
  // Tiles
  for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR+2);y++){
    for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR+2);x++){
      const s=iso(x,y);
      const sx=s.x+cam.x-TW/2;
      const sy=s.y+cam.y-TH/2;
      
      const dx=x-pgx,dy=y-pgy;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>VR+0.5)continue;
      
      const bio=BIOMAS[getBioma(x,y)];
      
      if(world[y][x]===1){
        drawDiamond(sx,sy,TW,TH,'#1565c0','#4fc3f7');
      } else {
        drawDiamond(sx,sy,TW,TH,(x+y)%2===0?bio.color1:bio.color2,'rgba(0,0,0,0.1)');
      }
    }
  }
  
  // Decoraciones
  for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR);y++){
    for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR);x++){
      const dist=Math.sqrt((x-pgx)*(x-pgx)+(y-pgy)*(y-pgy));
      if(dist>VR)continue;
      if(world[y][x]!==0)continue;
      
      const s=iso(x,y);
      const px=s.x+cam.x;
      const py=s.y+cam.y;
      
      const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
      const tipo=v%100;
      const biome=getBioma(x,y);
      
      if(tipo<8){
        const tb=biome===1?(v%2===0?'pino'):'roble';
        drawTree(px,py,tb);
      }
    }
  }
  
  // NPCs
  for(const n of npcs){
    const dist=Math.sqrt((n.x-pgx)*(n.x-pgx)+(n.y-pgy)*(n.y-pgy));
    if(dist>VR)continue;
    const s=iso(n.x,n.y);
    const px=s.x+cam.x,py=s.y+cam.y;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(px,py+TH/2,6,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=n.c;
    ctx.fillRect(px-5,py+TH/2-16,10,12);
    ctx.fillStyle='#ffe0b2';
    ctx.fillRect(px-3,py+TH/2-22,6,5);
    ctx.fillStyle='#fff';
    ctx.fillRect(px-2,py+TH/2-19,2,1);
    ctx.fillRect(px+1,py+TH/2-19,2,1);
    ctx.fillStyle='#ffd700';
    ctx.beginPath();ctx.arc(px,py+TH/2-28,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='6px monospace';
    ctx.textAlign='center';
    ctx.fillText(n.n,px,py-10);
  }
  
  // Jugador
  const ps=iso(pl.fx,pl.fy);
  drawPlayer(ps.x+cam.x,ps.y+cam.y,pl.frame===0?0:1);
  
  // UI
  ctx.fillStyle='rgba(0,0,0,0.85)';
  ctx.fillRect(10,10,140,50);
  ctx.fillStyle='#fff';
  ctx.font='bold 12px monospace';
  ctx.textAlign='left';
  ctx.textBaseline='middle';
  ctx.fillText('Lv.'+pl.nivel+' Hero',18,24);
  ctx.fillStyle='#4a0000';
  ctx.fillRect(18,32,120,6);
  ctx.fillStyle='#e44';
  ctx.fillRect(19,33,118*pl.hp/pl.mhp,4);
  ctx.fillStyle='#fff';
  ctx.font='7px monospace';
  ctx.fillText(Math.floor(pl.hp)+'/'+pl.mhp,65,37);
  
  ctx.fillStyle='#0f0';
  ctx.font='9px monospace';
  ctx.textAlign='left';
  ctx.fillText('Pos:'+pl.gx+','+pl.gy,10,H-15);
  
  requestAnimationFrame(loop);
}

// Input
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(pl.path.length>0)return;
  const t=e.changedTouches[0];
  const cell=s2c(t.clientX,t.clientY);
  if(cell.x<0||cell.x>=WORLD_W||cell.y<0||cell.y>=WORLD_H)return;
  if(world[cell.y][cell.x]!==0)return;
  for(const n of npcs)if(n.x===cell.x&&n.y===cell.y)return;
  pl.path=findPath(pl.gx,pl.gy,cell.x,cell.y);
},{passive:false});

loop();
</script>
</body>
</html>
