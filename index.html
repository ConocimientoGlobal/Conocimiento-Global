<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;background:#000;touch-action:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// === dev/config.js ===
// ============================================================================
// CONFIGURACIÓN GLOBAL
// ============================================================================

const WORLD_W = 64;
const WORLD_H = 64;

let W, H;
let TW, TH;

const VISION_RADIO = 12;

function calcularTileSize() {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
  const TILE = Math.min(W, H) / 4;
  TW = TILE;
  TH = TILE / 2;
}

function resize() { calcularTileSize(); }

// === dev/biomas.js ===
// ============================================================================
// BIOMAS - Paleta vibrante, elementos distintivos
// ============================================================================

const BIOMAS = [
  {id:0, nombre:'Pueblo',     color1:'#4caf50', color2:'#388e3c', dificultad:null,      tipoAgua:'dulce'},
  {id:1, nombre:'Bosque',     color1:'#2e7d32', color2:'#1b5e20', dificultad:null,      tipoAgua:'dulce'},
  {id:2, nombre:'Desierto',   color1:'#f9a825', color2:'#f57f17', dificultad:'sed',     tipoAgua:'mar'},
  {id:3, nombre:'Montaña',    color1:'#9e9e9e', color2:'#757575', dificultad:'frio',    tipoAgua:'dulce'},
  {id:4, nombre:'Pantano',    color1:'#5d4037', color2:'#4e342e', dificultad:'veneno',  tipoAgua:'mar'},
  {id:5, nombre:'Volcan',     color1:'#d84315', color2:'#bf360c', dificultad:'calor',   tipoAgua:'lava'},
  {id:6, nombre:'Castillo',   color1:'#37474f', color2:'#263238', dificultad:null,      tipoAgua:'dulce'}
];

// Paleta vibrante con variaciones por bioma
const PALETA_BIOMAS = {
  0: { // Pueblo
    tierra: ['#4caf50', '#388e3c', '#66bb6a', '#2e7d32'],
    pasto: ['#7cb342', '#8bc34a', '#689f38', '#9ccc65'],
    flor: ['#f44336', '#ffeb3b', '#fff', '#e91e63', '#ff9800']
  },
  1: { // Bosque
    tierra: ['#2e7d32', '#1b5e20', '#388e3c', '#43a047'],
    pasto: ['#7cb342', '#689f38', '#8bc34a', '#558b2f'],
    flor: ['#9c27b0', '#fff', '#e91e63', '#ff5722', '#ffeb3b']
  },
  2: { // Desierto
    tierra: ['#f9a825', '#f57f17', '#ffb300', '#ffa000'],
    pasto: ['#4caf50', '#388e3c', '#66bb6a', '#2e7d32'],
    flor: ['#ff9800', '#ffeb3b', '#f44336', '#fff']
  },
  3: { // Montaña
    tierra: ['#9e9e9e', '#757575', '#bdbdbd', '#616161'],
    pasto: ['#689f38', '#558b2f', '#7cb342', '#4caf50'],
    flor: ['#fff', '#e3f2fd', '#bbdefb', '#90caf9']
  },
  4: { // Pantano
    tierra: ['#5d4037', '#4e342e', '#6d4c41', '#3e2723'],
    pasto: ['#5d4037', '#4e342e', '#795548', '#6d4c41'],
    flor: ['#fff', '#c8e6c9', '#a5d6a7', '#81c784']
  },
  5: { // Volcán
    tierra: ['#d84315', '#bf360c', '#e64a19', '#f4511e'],
    pasto: ['#424242', '#616161', '#757575', '#37474f'],
    flor: ['#ffeb3b', '#ff9800', '#f44336', '#fff']
  },
  6: { // Castillo
    tierra: ['#37474f', '#263238', '#455a64', '#546e7a'],
    pasto: ['#4caf50', '#388e3c', '#66bb6a', '#2e7d32'],
    flor: ['#f44336', '#e91e63', '#9c27b0', '#ffeb3b']
  }
};

function getBioma(x, y) {
  const bx = Math.min(7, Math.floor(x / 8));
  const by = Math.min(7, Math.floor(y / 8));
  const mapa = [
    [0, 1, 1, 2, 2, 5, 5, 5],
    [1, 1, 2, 2, 3, 5, 5, 6],
    [1, 2, 2, 3, 3, 5, 6, 6],
    [2, 2, 3, 3, 4, 5, 6, 6],
    [2, 3, 3, 4, 4, 6, 6, 6],
    [3, 3, 4, 4, 4, 6, 6, 6],
    [3, 4, 4, 4, 6, 6, 6, 6],
    [4, 4, 4, 6, 6, 6, 6, 6]
  ];
  return mapa[by][bx];
}

function getColoresBioma(biomaId) {
  return PALETA_BIOMAS[biomaId] || PALETA_BIOMAS[0];
}

// === dev/mundo.js ===
// ============================================================================
// MUNDO - Generación, NPCs, Cofres
// ============================================================================

const world = [];
const npcs = [];
const cofres = [];

function generarMundo() {
  for (let y = 0; y < WORLD_H; y++) {
    world[y] = [];
    for (let x = 0; x < WORLD_W; x++) {
      if (x === 0 || x === WORLD_W - 1 || y === 0 || y === WORLD_H - 1) {
        world[y][x] = 1;
      } else if (BIOMAS[getBioma(x, y)].id === 0) {
        world[y][x] = 0;
      } else {
        const v = ((x * 374761393 + y * 668265263) ^ 0x5bf03635) >>> 0;
        world[y][x] = (v % 20 < 1) ? 1 : 0;
      }
    }
  }
  world[8][8] = 0;
}

function generarNPCs() {
  npcs.length = 0;
  npcs.push(
    {x:6, y:6, nombre:'Herrero', color:'#e53935'},
    {x:9, y:7, nombre:'Mago', color:'#8e24aa'},
    {x:7, y:9, nombre:'Comerciante', color:'#ffb300'},
    {x:20, y:12, nombre:'Lenador', color:'#6d4c41'},
    {x:35, y:15, nombre:'Nomada', color:'#ff8f00'},
    {x:50, y:25, nombre:'Alquimista', color:'#00897b'},
    {x:20, y:45, nombre:'Bruja', color:'#5e35b1'},
    {x:55, y:40, nombre:'HerreroLava', color:'#d84315'},
    {x:58, y:58, nombre:'Rey', color:'#ffd600'}
  );
}

function generarCofres() {
  cofres.length = 0;
  cofres.push(
    {x:10, y:10, abierto:false},
    {x:25, y:18, abierto:false},
    {x:40, y:22, abierto:false},
    {x:55, y:35, abierto:false},
    {x:15, y:50, abierto:false},
    {x:60, y:60, abierto:false}
  );
}

function esCaminable(x, y) {
  if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return false;
  if (world[y][x] !== 0) return false;
  for (const n of npcs) if (n.x === x && n.y === y) return false;
  for (const co of cofres) if (co.x === x && co.y === y && !co.abierto) return false;
  return true;
}

// === dev/texturas.js ===
// ============================================================================
// TEXTURAS POR BIOMA - Detalles y variaciones
// ============================================================================

function texturaHierbaBioma(sx, sy, biomaId, v) {
  const paleta = getColoresBioma(biomaId);
  const color = paleta.pasto[v % paleta.pasto.length];
  const colorClaro = paleta.pasto[(v + 1) % paleta.pasto.length];
  
  switch(biomaId) {
    case 0: // Pueblo - césped corto
      ctx.fillStyle = color;
      ctx.fillRect(sx - 8, sy + TH/2 - 4, 2, 5);
      ctx.fillRect(sx + 4, sy + TH/2 - 2, 2, 4);
      ctx.fillRect(sx - 2, sy + TH/2 - 5, 2, 6);
      ctx.fillRect(sx + 7, sy + TH/2 - 3, 2, 4);
      ctx.fillStyle = colorClaro;
      ctx.fillRect(sx - 5, sy + TH/2 - 6, 1, 7);
      ctx.fillRect(sx + 9, sy + TH/2 - 5, 1, 6);
      break;
      
    case 1: // Bosque - hierba alta densa
      for (let i = 0; i < 5; i++) {
        const hx = sx - 12 + i * 5 + (v % 3);
        const h = 6 + (v % 4);
        ctx.fillStyle = color;
        ctx.fillRect(hx, sy + TH/2 - h, 2, h + 2);
      }
      // Hojas
      ctx.fillStyle = '#8bc34a';
      ctx.fillRect(sx - 6, sy + TH/2 - 5, 2, 1);
      ctx.fillRect(sx + 4, sy + TH/2 - 4, 2, 1);
      break;
      
    case 2: // Desierto - cactus pequeños
      ctx.fillStyle = color;
      ctx.fillRect(sx - 6, sy + TH/2 - 10, 5, 10);
      ctx.fillRect(sx + 4, sy + TH/2 - 7, 4, 7);
      ctx.fillStyle = colorClaro;
      ctx.fillRect(sx - 5, sy + TH/2 - 9, 3, 9);
      break;
      
    case 3: // Montaña - hierba corta con piedras
      ctx.fillStyle = color;
      ctx.fillRect(sx - 10, sy + TH/2 - 3, 3, 3);
      ctx.fillRect(sx + 3, sy + TH/2 - 4, 3, 4);
      ctx.fillStyle = '#757575';
      ctx.fillRect(sx + 6, sy + TH/2 - 1, 3, 2);
      ctx.fillRect(sx - 4, sy + TH/2, 2, 2);
      break;
      
    case 4: // Pantano - juncos
      ctx.fillStyle = color;
      ctx.fillRect(sx - 8, sy + TH/2 - 7, 2, 8);
      ctx.fillRect(sx + 5, sy + TH/2 - 9, 2, 10);
      ctx.fillRect(sx + 12, sy + TH/2 - 5, 2, 6);
      ctx.fillStyle = colorClaro;
      ctx.fillRect(sx - 4, sy + TH/2 - 10, 2, 11);
      break;
      
    case 5: // Volcán - ceniza
      ctx.fillStyle = color;
      ctx.fillRect(sx - 8, sy + TH/2 - 2, 3, 2);
      ctx.fillRect(sx + 5, sy + TH/2 - 3, 3, 3);
      ctx.fillRect(sx + 10, sy + TH/2 - 2, 3, 2);
      // Piedras volcánicas
      ctx.fillStyle = '#424242';
      ctx.fillRect(sx - 3, sy + TH/2, 2, 2);
      ctx.fillRect(sx + 8, sy + TH/2 - 1, 2, 2);
      break;
      
    case 6: // Castillo - césped ornamental
      ctx.fillStyle = color;
      ctx.fillRect(sx - 8, sy + TH/2 - 4, 2, 5);
      ctx.fillRect(sx + 5, sy + TH/2 - 3, 2, 4);
      ctx.fillRect(sx - 3, sy + TH/2 - 5, 2, 6);
      ctx.fillStyle = colorClaro;
      ctx.fillRect(sx + 10, sy + TH/2 - 4, 1, 5);
      break;
  }
}

function texturaSueloBioma(sx, sy, biomaId, v) {
  const paleta = getColoresBioma(biomaId);
  
  // Grietas (común a todos)
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  const g1x = sx - 10 + (v % 6);
  const g1y = sy + TH/4 + (v % 4);
  ctx.fillRect(g1x, g1y, 1, 3 + (v % 3));
  ctx.fillRect(g1x + 2, g1y + 2, 2, 1);
  
  // Detalles específicos
  switch(biomaId) {
    case 2: // Desierto - arena ondulada
      ctx.fillStyle = 'rgba(200,160,80,0.15)';
      ctx.fillRect(sx - 8, sy + TH/3, 16, 2);
      ctx.fillRect(sx - 4, sy + TH/2 - 1, 8, 1);
      break;
      
    case 3: // Montaña - rocas
      ctx.fillStyle = 'rgba(100,100,100,0.3)';
      ctx.fillRect(sx + 6, sy + TH/3, 3, 2);
      ctx.fillRect(sx - 4, sy + TH/2 - 1, 2, 2);
      break;
      
    case 4: // Pantano - barro
      ctx.fillStyle = 'rgba(60,40,20,0.2)';
      ctx.fillRect(sx - 4, sy + TH/3, 8, 3);
      break;
      
    case 5: // Volcán - ceniza y piedra
      ctx.fillStyle = 'rgba(40,40,40,0.25)';
      ctx.fillRect(sx - 6, sy + TH/3, 12, 3);
      // Piedras pequeñas
      ctx.fillStyle = 'rgba(60,60,60,0.3)';
      ctx.fillRect(sx + 3, sy + TH/2, 2, 2);
      break;
  }
  
  // Guijarros comunes
  ctx.fillStyle = 'rgba(100,100,100,0.25)';
  ctx.fillRect(sx + 3, sy + TH/2, 1, 1);
  ctx.fillRect(sx - 8, sy + TH/2 + 1, 1, 1);
}

// === ELEMENTOS DISTINTIVOS POR BIOMA ===

// PUEBLO - Casas, mercado, pozo
function drawElementoPueblo(sx, sy, v) {
  const tipo = v % 20;
  
  if (tipo < 6) {
    // Casa del pueblo
    drawCasaAldeana(sx, sy, v);
  } else if (tipo < 10) {
    // Puesto de mercado
    drawMercado(sx, sy, v);
  } else if (tipo < 13) {
    // Pozo
    drawPozo(sx, sy);
  } else if (tipo < 16) {
    // Carreta
    drawCarreta(sx, sy);
  } else if (tipo < 18) {
    // Farola
    drawFarola(sx, sy);
  }
}

function drawCasaAldeana(px, py, v) {
  const colores = ['#e8d8b0', '#d4c49a', '#c8b888', '#dcc89a'];
  const colorPared = colores[v % colores.length];
  const colorTecho = ['#c62828', '#1565c0', '#f9a825', '#2e7d32'][v % 4];
  
  // Sombra
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px + 8, py + TH/2 + 2, 16, 6, 0.3, 0, Math.PI * 2);
  ctx.fill();
  
  // Pared
  ctx.fillStyle = colorPared;
  ctx.fillRect(px - 12, py - 18, 24, 20);
  
  // Techo
  ctx.fillStyle = colorTecho;
  ctx.beginPath();
  ctx.moveTo(px, py - 34);
  ctx.lineTo(px - 16, py - 20);
  ctx.lineTo(px + 16, py - 20);
  ctx.closePath();
  ctx.fill();
  
  // Puerta
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(px - 4, py - 8, 8, 10);
  
  // Ventanas
  ctx.fillStyle = '#4fc3f7';
  ctx.fillRect(px - 10, py - 14, 5, 5);
  ctx.fillRect(px + 5, py - 14, 5, 5);
  
  // Humo
  drawHumo(px + 8, py - 38);
}

function drawMercado(px, py, v) {
  // Toldo
  ctx.fillStyle = v % 2 === 0 ? '#c62828' : '#1565c0';
  ctx.fillRect(px - 12, py - 20, 24, 12);
  ctx.fillStyle = v % 2 === 0 ? '#b71c1c' : '#0d47a1';
  ctx.fillRect(px - 12, py - 20, 24, 3);
  
  // Mesas
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(px - 8, py - 12, 16, 3);
  ctx.fillRect(px - 8, py - 6, 16, 3);
  
  // Mercancías
  ctx.fillStyle = '#ff9800';
  ctx.fillRect(px - 6, py - 14, 3, 3);
  ctx.fillRect(px + 3, py - 14, 3, 3);
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(px - 2, py - 14, 4, 3);
}

function drawPozo(px, py) {
  ctx.fillStyle = '#9e9e9e';
  ctx.fillRect(px - 10, py - 8, 20, 12);
  ctx.fillStyle = '#757575';
  ctx.fillRect(px - 8, py - 6, 16, 8);
  ctx.fillStyle = '#4fc3f7';
  ctx.fillRect(px - 6, py - 4, 12, 4);
  
  // Estructura superior
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(px - 12, py - 16, 3, 12);
  ctx.fillRect(px + 9, py - 16, 3, 12);
  ctx.fillRect(px - 14, py - 18, 28, 3);
}

function drawCarreta(px, py) {
  // Cuerpo
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(px - 8, py - 12, 16, 8);
  
  // Ruedas
  ctx.fillStyle = '#5d4037';
  ctx.beginPath();
  ctx.arc(px - 5, py - 4, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(px + 5, py - 4, 4, 0, Math.PI * 2);
  ctx.fill();
  
  // Carga
  ctx.fillStyle = '#ff9800';
  ctx.fillRect(px - 6, py - 15, 12, 4);
}

function drawFarola(px, py) {
  // Poste
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(px - 1, py - 20, 2, 22);
  
  // Luz
  ctx.fillStyle = '#ffeb3b';
  ctx.fillRect(px - 3, py - 24, 6, 5);
  ctx.fillStyle = '#fff9c4';
  ctx.fillRect(px - 2, py - 23, 4, 3);
  
  // Resplandor
  ctx.fillStyle = 'rgba(255,235,59,0.2)';
  ctx.beginPath();
  ctx.arc(px, py - 22, 8, 0, Math.PI * 2);
  ctx.fill();
}

// BOSQUE - Árboles densos, hongos, flores silvestres
function drawElementoBosque(sx, sy, v) {
  const tipo = v % 20;
  
  if (tipo < 8) {
    drawArbolBosque(sx, sy, v);
  } else if (tipo < 12) {
    drawHongoBosque(sx, sy, v);
  } else if (tipo < 16) {
    drawArbustoBosque(sx, sy, v);
  } else if (tipo < 18) {
    drawTroncoCaido(sx, sy);
  } else {
    drawFlorSilvestreBosque(sx, sy, v);
  }
}

function drawArbolBosque(px, py, v) {
  const tipo = v % 3 === 0 ? 'pino' : v % 3 === 1 ? 'roble' : 'abedul';
  drawArbolAlto(px, py, tipo);
}

function drawHongoBosque(px, py, v) {
  const color = v % 3 === 0 ? '#8d6e63' : v % 3 === 1 ? '#4caf50' : '#2196f3';
  drawHongoColorido(px, py, color);
}

function drawTroncoCaido(px, py) {
  // Tronco horizontal
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(px - 10, py + TH/2 - 2, 20, 4);
  ctx.fillStyle = '#4e342e';
  ctx.fillRect(px - 10, py + TH/2 - 2, 20, 2);
  
  // Raíces
  ctx.fillStyle = '#6d4c41';
  ctx.fillRect(px + 8, py + TH/2 - 4, 3, 6);
}

function drawFlorSilvestreBosque(px, py, v) {
  const colores = ['#fff', '#9c27b0', '#e91e63', '#ff5722', '#ffeb3b'];
  const color = colores[v % colores.length];
  drawFlorSilvestre(px, py, color);
}

// DESIERTO - Dunas, cactus, oasis, ruinas
function drawElementoDesierto(sx, sy, v) {
  const tipo = v % 15;
  
  if (tipo < 5) {
    drawCactus(sx, sy, v);
  } else if (tipo < 8) {
    drawDuna(sx, sy);
  } else if (tipo < 10) {
    drawOasis(sx, sy);
  } else if (tipo < 12) {
    drawRuina(sx, sy);
  } else {
    drawRocaArenisca(sx, sy);
  }
}

function drawCactus(px, py, v) {
  const alto = 15 + (v % 8);
  
  // Sombra
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(px + 4, py + TH/2, 8, 3, 0.3, 0, Math.PI * 2);
  ctx.fill();
  
  // Cuerpo principal
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(px - 3, py - alto, 6, alto + 2);
  
  // Brazos
  ctx.fillRect(px - 8, py - alto + 4, 5, 3);
  ctx.fillRect(px + 3, py - alto + 6, 5, 3);
  
  // Puntitas
  ctx.fillStyle = '#388e3c';
  ctx.fillRect(px - 3, py - alto, 6, 2);
}

function drawDuna(px, py) {
  // Curva de arena
  ctx.fillStyle = '#ffb300';
  ctx.beginPath();
  ctx.moveTo(px - 15, py + TH/2);
  ctx.quadraticCurveTo(px, py - 6, px + 15, py + TH/2);
  ctx.lineTo(px - 15, py + TH/2);
  ctx.fill();
  
  // Sombra de la duna
  ctx.fillStyle = 'rgba(200,150,50,0.3)';
  ctx.fillRect(px + 5, py - 2, 10, 4);
}

function drawOasis(px, py) {
  // Agua
  ctx.fillStyle = '#4fc3f7';
  ctx.beginPath();
  ctx.ellipse(px, py - 2, 10, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Palmera
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(px + 6, py - 14, 3, 16);
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(px - 2, py - 18, 12, 3);
}

function drawRuina(px, py) {
  // Columna rota
  ctx.fillStyle = '#9e9e9e';
  ctx.fillRect(px - 3, py - 12, 6, 14);
  ctx.fillRect(px - 5, py - 14, 10, 3);
  
  // Base
  ctx.fillStyle = '#757575';
  ctx.fillRect(px - 8, py - 2, 16, 4);
}

function drawRocaArenisca(px, py) {
  ctx.fillStyle = '#ffb300';
  ctx.beginPath();
  ctx.moveTo(px - 10, py + TH/2);
  ctx.lineTo(px - 5, py - 8);
  ctx.lineTo(px + 3, py - 12);
  ctx.lineTo(px + 10, py - 6);
  ctx.lineTo(px + 10, py + TH/2);
  ctx.closePath();
  ctx.fill();
  
  // Sombra
  ctx.fillStyle = 'rgba(200,150,50,0.3)';
  ctx.beginPath();
  ctx.moveTo(px + 3, py - 12);
  ctx.lineTo(px + 10, py - 6);
  ctx.lineTo(px + 10, py + TH/2);
  ctx.lineTo(px + 3, py + TH/2);
  ctx.closePath();
  ctx.fill();
}

// MONTAÑA - Rocas, nieve, picos
function drawElementoMontana(sx, sy, v) {
  const tipo = v % 15;
  
  if (tipo < 6) {
    drawRocaMontana(sx, sy, v);
  } else if (tipo < 10) {
    drawNieve(sx, sy);
  } else if (tipo < 13) {
    drawPicoNevado(sx, sy);
  } else {
    drawPinoNevado(sx, sy);
  }
}

function drawRocaMontana(px, py, v) {
  // Sombra
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px + 5, py + TH/2 + 2, 12, 4, 0.2, 0, Math.PI * 2);
  ctx.fill();
  
  // Roca gris
  ctx.fillStyle = '#757575';
  ctx.beginPath();
  ctx.moveTo(px - 10, py + TH/2);
  ctx.lineTo(px - 6, py - 10);
  ctx.lineTo(px + 2, py - 16);
  ctx.lineTo(px + 10, py - 8);
  ctx.lineTo(px + 10, py + TH/2);
  ctx.closePath();
  ctx.fill();
  
  // Brillo

// EFECTOS - Agua animada, niebla, humo, reflejos

let frameCount = 0;

// === AGUA ANIMADA CON REFLEJOS ===
function drawAguaAnimada(sx, sy, w, h, x, y) {
  const v = ((x * 374761393 + y * 668265263) ^ 0x5bf03635) >>> 0;
  const waveOffset = Math.sin((frameCount * 0.05) + (x + y) * 0.3) * 2;
  
  // Base del agua con gradiente
  const waterGrad = ctx.createLinearGradient(sx - w/2, sy, sx + w/2, sy + h);
  waterGrad.addColorStop(0, '#1565c0');
  waterGrad.addColorStop(0.5, '#1976d2');
  waterGrad.addColorStop(1, '#0d47a1');
  ctx.fillStyle = waterGrad;
  
  ctx.beginPath();
  ctx.moveTo(sx, sy + waveOffset);
  ctx.lineTo(sx + w / 2, sy + h / 2 + waveOffset);
  ctx.lineTo(sx, sy + h + waveOffset);
  ctx.lineTo(sx - w / 2, sy + h / 2 + waveOffset);
  ctx.closePath();
  ctx.fill();
  
  // Ondas/reflejos
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(sx - 6 + waveOffset, sy + TH/3, 4, 1);
  ctx.fillRect(sx + 2 + waveOffset * 0.5, sy + TH/2, 3, 1);
  ctx.fillRect(sx - 4 + waveOffset * 0.7, sy + TH/4 + 2, 5, 1);
  
  // Brillos especulares
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillRect(sx - 2 + waveOffset, sy + TH/3 + 1, 1, 1);
  ctx.fillRect(sx + 5 + waveOffset * 0.8, sy + TH/2 - 1, 1, 1);
  
  // Borde de orilla (arena/tierra)
  ctx.fillStyle = 'rgba(210,180,120,0.6)';
  ctx.fillRect(sx - w/3, sy + h - 2, w*2/3, 2);
}

// === NIEBA BAJA CON PARTÍCULAS ===
function drawNiebla(sx, sy, w, h, densidad) {
  const v = ((sx * 374761393 + sy * 668265263) ^ 0x5bf03635) >>> 0;
  const nieblaOffset = Math.sin((frameCount * 0.02) + sx * 0.01) * 3;
  
  // Capas de niebla
  for (let i = 0; i < 3; i++) {
    const alpha = 0.08 - i * 0.02;
    ctx.fillStyle = `rgba(180,200,180,${alpha})`;
    ctx.fillRect(sx - w/3, sy + TH/2 + i * 2 + nieblaOffset, w*2/3, 3);
  }
  
  // Partículas flotantes
  ctx.fillStyle = 'rgba(200,220,200,0.3)';
  for (let i = 0; i < 3; i++) {
    const px = sx - 8 + ((v + i * 7) % 16);
    const py = sy + TH/4 + ((v + i * 11) % 6) + nieblaOffset;
    ctx.fillRect(px, py, 1, 1);
  }
}

// === HUMO ANIMADO DE CHIMENEA ===
function drawHumo(sx, sy) {
  const humoOffset = frameCount * 0.08;
  
  for (let i = 0; i < 4; i++) {
    const hy = sy - i * 6 - (humoOffset % 8);
    const hx = sx + Math.sin(humoOffset + i) * 2;
    const alpha = 0.4 - i * 0.1;
    const size = 2 + i;
    
    ctx.fillStyle = `rgba(180,180,180,${alpha})`;
    ctx.beginPath();
    ctx.arc(hx, hy, size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Luz cálida en la base
  ctx.fillStyle = 'rgba(255,200,100,0.2)';
  ctx.beginPath();
  ctx.arc(sx, sy - 2, 4, 0, Math.PI * 2);
  ctx.fill();
}

// === REFLEJO EN AGUA ===
function drawReflejoAgua(sx, sy, objeto, x, y) {
  const v = ((x * 374761393 + y * 668265263) ^ 0x5bf03635) >>> 0;
  const waveOffset = Math.sin((frameCount * 0.05) + (x + y) * 0.3) * 1;
  
  // Solo reflejar si hay agua cerca
  let tieneAgua = false;
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const nx = x + dx;
    const ny = y + dy;
    if (nx >= 0 && nx < WORLD_W && ny >= 0 && ny < WORLD_H) {
      if (world[ny][nx] === 1) tieneAgua = true;
    }
  }
  
  if (!tieneAgua) return;
  
  // Reflejo distorsionado
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(sx - 2 + waveOffset, sy + TH/2 + 2, 4, 2);
}

// === INCREMENTAR FRAME ===
function incrementarFrame() {
  frameCount++;
}

// ============================================================================
// RENDER - Usando elementos específicos por bioma
// ============================================================================

let ctx;
let lastDir = {x: 0, y: 1};

function iso(x, y) { return {x: (x - y) * TW / 2, y: (x + y) * TH / 2}; }

function getCamera() {
  const p = iso(pl.fx, pl.fy);
  return {x: W / 2 - p.x, y: H / 2 - p.y};
}

function screenToCell(sx, sy) {
  const cam = getCamera();
  const rx = sx - cam.x;
  const ry = sy - cam.y;
  return {
    x: Math.round((rx / (TW / 2) + ry / (TH / 2)) / 2),
    y: Math.round((ry / (TH / 2) - rx / (TW / 2)) / 2)
  };
}

function drawDiamond(sx, sy, w, h, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx + w / 2, sy + h / 2);
  ctx.lineTo(sx, sy + h);
  ctx.lineTo(sx - w / 2, sy + h / 2);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

function shadeColor(color, percent) {
  const num = parseInt(color.replace('#',''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.min(255, Math.max(0, (num >> 16) + amt));
  const G = Math.min(255, Math.max(0, (num >> 8 & 0x00FF) + amt));
  const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

function drawPlayer(px, py, bo) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();

  ctx.fillStyle = '#5d4037';

  ctx.fillRect(px + 1, py + TH/2 - 8, 2, 9 + bo);
  
  const bodyGrad = ctx.createLinearGradient(px - 6, py + TH/2 - 20, px + 6, py + TH/2 - 4);
  bodyGrad.addColorStop(0, '#1565c0');
  bodyGrad.addColorStop(0.5, '#1976d2');
  bodyGrad.addColorStop(1, '#0d47a1');
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(px - 7, py + TH/2 - 22, 14, 16);
  
  ctx.fillStyle = '#ffc107';
  ctx.fillRect(px - 7, py + TH/2 - 8, 14, 2);
  
  const headGrad = ctx.createRadialGradient(px - 1, py + TH/2 - 28, 1, px, py + TH/2 - 26, 6);
  headGrad.addColorStop(0, '#fff3e0');
  headGrad.addColorStop(1, '#ffe0b2');
  ctx.fillStyle = headGrad;
  ctx.fillRect(px - 4, py + TH/2 - 32, 8, 7);
  
  ctx.fillStyle = '#3e2723';
  ctx.fillRect(px - 5, py + TH/2 - 34, 10, 4);
  
  ctx.fillStyle = '#fff';
  ctx.fillRect(px - 2, py + TH/2 - 29, 2, 2);
  ctx.fillRect(px + 1, py + TH/2 - 29, 2, 2);

}

function drawNPC(px, py, npc) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';

function renderMundo() {
  const cam = getCamera();
  
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  
  const pgx = Math.floor(pl.gx);
  const pgy = Math.floor(pl.gy);
  
  if (pl.path.length > 0) {
    const t = pl.path[0];
    const dx = t.x - pl.fx;
    const dy = t.y - pl.fy;
    if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
      lastDir = {x: Math.sign(dx), y: Math.sign(dy)};
    }
  }
  
  // Tiles
  for (let y = Math.max(0, pgy - VISION_RADIO - 2); y < Math.min(WORLD_H, pgy + VISION_RADIO + 2); y++) {
    for (let x = Math.max(0, pgx - VISION_RADIO - 2); x < Math.min(WORLD_W, pgx + VISION_RADIO + 2); x++) {
      const s = iso(x, y);
      const sx = s.x + cam.x - TW/2;
      const sy = s.y + cam.y - TH/2;
      if (sx < -TW || sx > W + TW || sy < -TH || sy > H + TH) continue;
      
      const dx = x - pgx;
      const dy = y - pgy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > VISION_RADIO + 0.5) continue;
      
      const bioma = BIOMAS[getBioma(x, y)];
      const tile = world[y][x];
      const inPath = pl.path.find(p => p.x === x && p.y === y);
      
      let alpha = 1.0;
      if (dist > VISION_RADIO - 3) {
        alpha = Math.max(0, 1.0 - ((dist - (VISION_RADIO - 3)) / 3.5));
      }
      
      ctx.globalAlpha = alpha;
      
      if (tile === 1) {
        const biomaId = getBioma(x, y);
        if (biomaId === 2 || biomaId === 4) {
          drawMar(sx, sy, TW, TH, x, y);
        } else if (biomaId === 5) {
          // Lava
          ctx.fillStyle = '#d84315';
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx + TW/2, sy + TH/2);
          ctx.lineTo(sx, sy + TH);
          ctx.lineTo(sx - TW/2, sy + TH/2);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#ffcc02';
          ctx.fillRect(sx - 4, sy + TH/3, 8, 2);
        } else {
          drawAguaDulce(sx, sy, TW, TH, x, y);
        }
      } else {
        drawTileConVolumen(sx, sy, TW, TH, bioma.color1, bioma.color2, x, y);
      }
      
      if (inPath) {
        ctx.fillStyle = 'rgba(200,200,80,0.2)';
        drawDiamond(sx, sy, TW, TH, 'rgba(200,200,80,0.2)', null);
      }
      
      ctx.globalAlpha = 1.0;
    }
  }
  
  // Decoraciones con elementos específicos por bioma
  for (let y = Math.max(0, pgy - VISION_RADIO); y < Math.min(WORLD_H, pgy + VISION_RADIO); y++) {
    for (let x = Math.max(0, pgx - VISION_RADIO); x < Math.min(WORLD_W, pgx + VISION_RADIO); x++) {
      const dx = x - pgx;
      const dy = y - pgy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > VISION_RADIO) continue;
      if (world[y][x] !== 0) continue;
      
      const biomaId = getBioma(x, y);
      const s = iso(x, y);
      const px = s.x + cam.x;
      const py = s.y + cam.y;
      
      const v = ((x * 374761393 + y * 668265263) ^ 0x5bf03635) >>> 0;
      const tipo = v % 100;
      
      if (tipo < 10) {
        drawElementoBioma(px, py, biomaId, v);
      }
    }
  }
  
  // Niebla en pantano
  if (getBioma(pgx, pgy) === 4) {
    for (let y = Math.max(0, pgy - VISION_RADIO); y < Math.min(WORLD_H, pgy + VISION_RADIO); y++) {
      for (let x = Math.max(0, pgx - VISION_RADIO); x < Math.min(WORLD_W, pgx + VISION_RADIO); x++) {
        const s = iso(x, y);
        drawNiebla(s.x + cam.x, s.y + cam.y, TW, TH, 0.5);
      }
    }
  }
  
  // Cofres
  for (const co of cofres) {
    if (co.abierto) continue;
    const dx = co.x - pgx;
    const dy = co.y - pgy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > VISION_RADIO) continue;
    
    const s = iso(co.x, co.y);
    const px = s.x + cam.x;
    const py = s.y + cam.y;
    
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(px - 4, py - 2, 8, 5);
    ctx.fillStyle = '#b8860b';
    ctx.fillRect(px - 4, py - 2, 8, 2);
  }
  
  // NPCs
  for (const n of npcs) {
    const dx = n.x - pgx;
    const dy = n.y - pgy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > VISION_RADIO) continue;
    
    const s = iso(n.x, n.y);
    const px = s.x + cam.x;
    const py = s.y + cam.y;
    
    drawNPC(px, py, n);
    ctx.fillStyle = '#fff';
    ctx.font = '6px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(n.nombre, px, py - 12);
  }
  
  // Jugador
  const ps = iso(pl.fx, pl.fy);
  const px = ps.x + cam.x;
  const py = ps.y + cam.y;
  
  drawPlayer(px, py, pl.frame === 0 ? 0 : 1);
}

// === dev/jugador.js ===
// ============================================================================
// JUGADOR - Más lento, pathfinding
// ============================================================================

const pl = {
  gx: 8, gy: 8,
  fx: 8.0, fy: 8.0,
  path: [],
  frame: 0, ft: 0,
  hp: 100, mhp: 100,
  sed: 100, maxSed: 100,
  temp: 100, maxTemp: 100,
  nivel: 1, xp: 0,
  oro: 50,
  biomaActual: 0
};

function aplicarDificultad(dt) {
  const bioma = BIOMAS[pl.biomaActual];
  if (!bioma.dificultad) return;
  switch(bioma.dificultad) {
    case 'sed':
      pl.sed = Math.max(0, pl.sed - dt * 2);
      if (pl.sed === 0) pl.hp = Math.max(0, pl.hp - dt * 1);
      break;
    case 'frio':
      pl.temp = Math.max(0, pl.temp - dt * 2);
      if (pl.temp === 0) pl.hp = Math.max(0, pl.hp - dt * 1.5);
      break;
    case 'calor':
      pl.sed = Math.max(0, pl.sed - dt * 3);
      if (pl.sed === 0) pl.hp = Math.max(0, pl.hp - dt * 2);
      break;
    case 'veneno':
      if (Math.random() < 0.005) pl.hp = Math.max(0, pl.hp - dt * 3);
      break;
  }
}

function findPath(sx, sy, gx, gy) {
  if (!esCaminable(gx, gy)) return [];
  const open = [{x: sx, y: sy, p: []}];
  const vis = new Set();
  vis.add(sx + ',' + sy);
  while (open.length) {
    const c = open.shift();
    if (c.x === gx && c.y === gy) return c.p;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = c.x + dx, ny = c.y + dy, k = nx + ',' + ny;
      if (vis.has(k) || !esCaminable(nx, ny)) continue;
      vis.add(k);
      open.push({x: nx, y: ny, p: [...c.p, {x: nx, y: ny}]});
    }
  }
  return [];
}

function moverJugador(dt) {
  if (pl.path.length === 0) return;
  const t = pl.path[0];
  const speed = 2.5 * dt; // Más lento
  const dx = t.x - pl.fx;
  const dy = t.y - pl.fy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < speed || dist < 0.005) {
    pl.fx = t.x; pl.fy = t.y; pl.gx = t.x; pl.gy = t.y;
    pl.path.shift();
    if (!pl.path.length) guardar();
  } else {
    pl.fx += (dx/dist) * speed;
    pl.fy += (dy/dist) * speed;
  }
  pl.ft += dt;
  if (pl.ft > 0.15) { pl.ft = 0; pl.frame = (pl.frame + 1) % 2; }
}

// === dev/ui.js ===
// ============================================================================
// UI - HUD, Minimapa AJUSTADO (más grande, esquina inferior derecha), Mensajes
// ============================================================================

let mensaje = {titulo: '', texto: '', t: 0};

function mostrarMensaje(titulo, texto) {
  mensaje = {titulo, texto, t: 3};
}

function renderUI() {
  // Fondo UI
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(10, 10, 160, 70);
  
  // Nombre y nivel
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('Lv.' + pl.nivel + ' Hero', 18, 26);
  
  // Barra HP
  ctx.fillStyle = '#4a0000';
  ctx.fillRect(18, 34, 140, 8);
  ctx.fillStyle = '#e44';
  ctx.fillRect(19, 35, 138 * pl.hp / pl.mhp, 6);
  ctx.fillStyle = '#fff';
  ctx.font = '8px monospace';
  ctx.fillText(Math.floor(pl.hp) + '/' + pl.mhp, 75, 40);
  
  // Barra dificultad
  const bioma = BIOMAS[pl.biomaActual];
  if (bioma.dificultad === 'sed' || bioma.dificultad === 'calor') {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(18, 50, 140, 6);
    ctx.fillStyle = bioma.dificultad === 'sed' ? '#0288d1' : '#e65100';
    ctx.fillRect(18, 50, 140 * pl.sed / pl.maxSed, 6);
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.fillText('SED', 78, 55);
  } else if (bioma.dificultad === 'frio') {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(18, 50, 140, 6);
    ctx.fillStyle = '#0277bd';
    ctx.fillRect(18, 50, 140 * pl.temp / pl.maxTemp, 6);
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.fillText('TEMP', 76, 55);
  } else if (bioma.dificultad === 'veneno') {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(18, 50, 140, 6);
    ctx.fillStyle = '#7cb342';
    ctx.fillRect(18, 50, 140, 6);
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.fillText('TOXICO', 73, 55);
  }
  
  // Info inferior
  ctx.fillStyle = '#ffd700';
  ctx.font = '11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('Oro: ' + pl.oro, 18, H - 60);
  ctx.fillStyle = '#0f0';
  ctx.fillText('Bioma: ' + bioma.nombre, 18, H - 45);
  ctx.fillText('Pos: ' + Math.floor(pl.gx) + ',' + Math.floor(pl.gy), 18, H - 30);
  
  // === MINIMAPA MÁS GRANDE ===
  const mmW = 140, mmH = 140;
  const mmX = W - mmW - 15, mmY = H - mmH - 15;
  const mmCX = mmX + mmW / 2;
  const mmCY = mmY + mmH / 2;
  
  // Fondo
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(mmX, mmY, mmW, mmH);
  
  // Biomas en minimapa
  for (let y = 0; y < WORLD_H; y += 1) {
    for (let x = 0; x < WORLD_W; x += 1) {
      const mx = mmX + (x / WORLD_W) * mmW;
      const my = mmY + (y / WORLD_H) * mmH;
      
      const dx = mx - mmCX;
      const dy = my - mmCY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > mmW / 2 - 2) continue;
      
      const b = BIOMAS[getBioma(x, y)];
      ctx.fillStyle = b.color1;
      ctx.fillRect(mx - 1, my - 1, 3, 3);
    }
  }
  
  // NPCs en minimapa
  ctx.fillStyle = '#0ff';
  for (const n of npcs) {
    const nmx = mmX + (n.x / WORLD_W) * mmW;
    const nmy = mmY + (n.y / WORLD_H) * mmH;
    const ndx = nmx - mmCX;
    const ndy = nmy - mmCY;
    const ndist = Math.sqrt(ndx*ndx + ndy*ndy);
    if (ndist <= mmW / 2 - 2) {
      ctx.fillRect(nmx - 1, nmy - 1, 3, 3);
    }
  }
  
  // Fog of War circular
  const fogRadius = mmW / 2 - 2;
  const fogInner = fogRadius - 8;
  
  const gradient = ctx.createRadialGradient(mmCX, mmCY, fogInner, mmCX, mmCY, fogRadius + 4);
  gradient.addColorStop(0, 'rgba(0,0,0,0)');
  gradient.addColorStop(0.6, 'rgba(0,0,0,0.4)');
  gradient.addColorStop(1, 'rgba(0,0,0,0.95)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(mmCX, mmCY, fogRadius + 4, 0, Math.PI * 2);
  ctx.fill();
  
  // Jugador en minimapa
  ctx.fillStyle = '#ff0';
  ctx.fillRect(mmCX - 4, mmCY - 4, 8, 8);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(mmCX - 2, mmCY - 2, 4, 4);
  
  // Borde del minimapa
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.strokeRect(mmX, mmY, mmW, mmH);
  
  // Leyenda
  ctx.fillStyle = '#fff';
  ctx.font = '9px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('Mapa', mmX + 3, mmY - 6);
  
  // Mensaje flotante
  if (mensaje.t > 0) {
    const alpha = Math.min(1, mensaje.t);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(W/2 - 100, H/2 - 40, 200, 80);
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.strokeRect(W/2 - 100, H/2 - 40, 200, 80);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(mensaje.titulo, W/2, H/2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.fillText(mensaje.texto, W/2, H/2 + 15);
    ctx.globalAlpha = 1;
  }
}

// === dev/guardado.js ===
// ============================================================================
// GUARDADO - LocalStorage
// ============================================================================

function guardar() {
  localStorage.setItem('pachamirai_save', JSON.stringify({
    gx: pl.gx, gy: pl.gy, fx: pl.fx, fy: pl.fy,
    hp: pl.hp, oro: pl.oro, sed: pl.sed, temp: pl.temp,
    nivel: pl.nivel, xp: pl.xp,
    cofres: cofres.map(c => ({x: c.x, y: c.y, abierto: c.abierto}))
  }));
}

function cargar() {
  const data = localStorage.getItem('pachamirai_save');
  if (!data) return;
  try {
    const s = JSON.parse(data);
    pl.gx = s.gx; pl.gy = s.gy; pl.fx = s.fx; pl.fy = s.fy;
    pl.hp = s.hp; pl.oro = s.oro; pl.sed = s.sed || 100; pl.temp = s.temp || 100;
    pl.nivel = s.nivel || 1; pl.xp = s.xp || 0;
    if (s.cofres) {
      for (const sc of s.cofres) {
        for (const co of cofres) {
          if (co.x === sc.x && co.y === sc.y) co.abierto = sc.abierto;
        }
      }
    }
  } catch(e) {}
}

// === dev/main.js ===
// ============================================================================
// MAIN - Game Loop, Input con tap preciso, Bootstrap
// ============================================================================

const c = document.getElementById('c');

function main() {
  calcularTileSize();
  window.addEventListener('resize', resize);
  
  ctx = c.getContext('2d');
  generarMundo();
  generarNPCs();
  generarCofres();
  
  window.addEventListener('beforeunload', guardar);
  cargar();
  
  // Input con tap preciso
  c.addEventListener('touchstart', e => {
    e.preventDefault();
    if (pl.path.length > 0) return;
    
    const t = e.changedTouches[0];
    const cell = screenToCell(t.clientX, t.clientY);
    
    // Verificar límites
    if (cell.x < 0 || cell.x >= WORLD_W || cell.y < 0 || cell.y >= WORLD_H) return;
    
    // Verificar NPC primero
    for (const n of npcs) {
      if (n.x === cell.x && n.y === cell.y) {
        mostrarMensaje('NPC: ' + n.nombre, 'Hola, viajero.');
        return;
      }
    }
    
    // Verificar cofre
    for (const co of cofres) {
      if (co.x === cell.x && co.y === cell.y && !co.abierto) {
        co.abierto = true;
        pl.oro += 10;
        mostrarMensaje('Cofre abierto', '+10 oro');
        guardar();
        return;
      }
    }
    
    // Verificar que la celda sea caminable
    if (world[cell.y][cell.x] !== 0) return;
    for (const n of npcs) {
      if (n.x === cell.x && n.y === cell.y) return;
    }
    for (const co of cofres) {
      if (co.x === cell.x && co.y === cell.y && !co.abierto) return;
    }
    
    // Guardar destino exacto del tap
    pl.tapTargetX = cell.x;
    pl.tapTargetY = cell.y;
    
    // Calcular camino
    pl.path = findPath(pl.gx, pl.gy, cell.x, cell.y);
  }, {passive: false});
  
  let last = performance.now();
  
  function loop(ts) {
    const dt = Math.min((ts - last) / 1000, 0.1);
    last = ts;
    
    if (mensaje.t > 0) mensaje.t -= dt;
    
    incrementarFrame();
    
    pl.biomaActual = getBioma(Math.floor(pl.gx), Math.floor(pl.gy));
    aplicarDificultad(dt);
    moverJugador(dt);
    
    renderMundo();
    renderUI();
    
    requestAnimationFrame(loop);
  }
  
  requestAnimationFrame(loop);
}

main();
