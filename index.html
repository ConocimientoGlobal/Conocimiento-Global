<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}html,body{width:100%;height:100%;overflow:hidden;background:#000}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');

let W,H;
function resize(){
  W=c.width=window.innerWidth;
  H=c.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

// Mundo
const MW=15,MH=15,TW=64,TH=32;
const world=[];
for(let y=0;y<MH;y++){
  world[y]=[];
  for(let x=0;x<MW;x++){
    const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
    let t=0;
    if(v%12<2)t=1;else if(v%20<2)t=2;else if(v%25<2)t=3;
    world[y][x]=t;
  }
}

// Jugador
const pl={x:7,y:7,dir:'down',frame:0,ft:0,hp:100,mhp:100};

// Enemigos
const en=[{x:5,y:5,hp:40,mhp:40,c:'#c62828'},{x:10,y:8,hp:50,mhp:50,c:'#6a1b9a'},{x:8,y:12,hp:30,mhp:30,c:'#1565c0'}];

// Joystick
let jx=0,jy=0,ja=false,jsx=0,jsy=0;

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  if(t.clientX<W*0.5){
    ja=true;jsx=t.clientX;jsy=t.clientY;jx=0;jy=0;
  }
},{passive:false});

c.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!ja)return;
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    const dx=t.clientX-jsx,dy=t.clientY-jsy;
    const d=Math.sqrt(dx*dx+dy*dy),m=40;
    if(d>m){jx=dx/d;jy=dy/d;}else{jx=dx/m;jy=dy/m;}
  }
},{passive:false});

c.addEventListener('touchend',e=>{ja=false;jx=0;jy=0;},{passive:false});

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  // Movimiento
  if(ja&&(jx!==0||jy!==0)){
    const s=5*dt;
    const nx=pl.x+jx*s,ny=pl.y+jy*s;
    if(nx>=0&&nx<MW&&ny>=0&&ny<MH&&world[Math.floor(ny)][Math.floor(nx)]!==1){
      pl.x=nx;pl.y=ny;
      pl.ft+=dt;
      if(pl.ft>0.2){pl.ft=0;pl.frame=(pl.frame+1)%2;}
    }
  }
  
  // Render
  ctx.fillStyle='#1a3a1a';
  ctx.fillRect(0,0,W,H);
  
  const cam=iso(pl.x,pl.y);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  
  // Tiles
  for(let y=0;y<MH;y++){
    for(let x=0;x<MW;x++){
      const s=iso(x,y);
      const sx=s.x+ox,sy=s.y+oy;
      if(sx<-TW||sx>W+TW||sy<-TH*2||sy>H+TH)continue;
      
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.lineTo(sx+TW/2,sy+TH/2);
      ctx.lineTo(sx,sy+TH);
      ctx.lineTo(sx-TW/2,sy+TH/2);
      ctx.closePath();
      
      const t=world[y][x];
      if(t===0){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();}
      else if(t===1){ctx.fillStyle='#1565c0';ctx.fill();ctx.strokeStyle='#0d47a1';ctx.stroke();}
      else if(t===2){ctx.fillStyle='#8d6e63';ctx.fill();ctx.strokeStyle='#5d4037';ctx.stroke();}
      else if(t===3){ctx.fillStyle='#757575';ctx.fill();ctx.strokeStyle='#424242';ctx.stroke();}
    }
  }
  
  // Enemigos
  for(const e of en){
    if(e.hp<=0)continue;
    const s=iso(e.x,e.y);
    const sx=s.x+ox,sy=s.y+oy;
    ctx.fillStyle=e.c;
    ctx.fillRect(sx-8,sy-4,16,14);
    ctx.fillStyle='#fff';
    ctx.fillRect(sx-5,sy-2,3,3);ctx.fillRect(sx+2,sy-2,3,3);
    ctx.fillStyle='#333';ctx.fillRect(sx-10,sy-10,20,3);
    ctx.fillStyle='#e44';ctx.fillRect(sx-9,sy-9,18*e.hp/e.mhp,1);
  }
  
  // Jugador
  const p=iso(pl.x,pl.y);
  const px=p.x+ox,py=p.y+oy;
  const bo=pl.frame===0?0:1;
  
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(px,py+14,8,3,0,0,Math.PI*2);ctx.fill();
  
  ctx.fillStyle='#5d4037';
  ctx.fillRect(px-4,py+2,3,7+bo);ctx.fillRect(px+1,py+2,3,7+bo);
  
  ctx.fillStyle='#1976d2';
  ctx.fillRect(px-6,py-6,12,10);
  ctx.fillStyle='#1565c0';ctx.fillRect(px-6,py-6,12,3);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-6,py,12,2);
  
  ctx.fillStyle='#ffe0b2';
  ctx.fillRect(px-4,py-10,8,5);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-4,py-12,8,2);
  ctx.fillStyle='#fff';ctx.fillRect(px-2,py-8,2,2);ctx.fillRect(px+1,py-8,2,2);
  ctx.fillStyle='#000';ctx.fillRect(px-1,py-7,1,1);ctx.fillRect(px+2,py-7,1,1);
  
  // Joystick
  if(ja){
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.beginPath();ctx.arc(jsx,jsy,50,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();ctx.arc(jsx+jx*35,jsy+jy*35,16,0,Math.PI*2);ctx.fill();
  }
  
  // UI
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(10,10,120,40);
  ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.textAlign='left';
  ctx.fillText(`HP: ${pl.hp}/${pl.mhp}`,18,28);
  ctx.fillStyle='#e44';ctx.fillRect(18,34,100,4);
  ctx.fillStyle='#4f4';ctx.fillRect(18,34,100*pl.hp/pl.mhp,4);
  
  ctx.fillStyle='#0f0';ctx.font='10px monospace';
  ctx.fillText(`W:${W} H:${H}`,10,H-10);
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
