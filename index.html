<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body style="background:blue;margin:0;padding:0;width:100%;height:100%">
<h1 style="color:white;font-size:20px;padding:20px">TEST: Si ves esto azul con texto, el HTML funciona</h1>
<canvas id="c" style="display:block;background:green;width:200px;height:200px;margin:20px"></canvas>
<script>
try {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'red';
  ctx.fillRect(50, 50, 100, 100);
  ctx.fillStyle = 'yellow';
  ctx.font = '16px monospace';
  ctx.fillText('Canvas OK', 60, 110);
  document.body.innerHTML += '<p style="color:white;font-size:18px;padding:20px">JavaScript ejecutado correctamente</p>';
} catch(e) {
  document.body.innerHTML += '<p style="color:red;font-size:18px;padding:20px">ERROR: ' + e.message + '</p>';
}
</script>
</body>
</html>
