<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;background:#000}html,body{width:100%;height:100%;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
c.width=window.innerWidth;
c.height=window.innerHeight;

const W=c.width,H=c.height;
const TW=Math.min(W,H)/8,TH=TW/2;

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

const pl={x:8,y:8,vx:8,vy:8,path:[],frame:0,ft:0,hp:100,mhp:100};

function loop(){
  ctx.fillStyle='#1a3a1a';
  ctx.fillRect(0,0,W,H);
  
  const cam=iso(pl.vx,pl.vy);
  const ox=W/2-cam.x;
  const oy=H/2-cam.y;
  
  for(let y=0;y<64;y++){
    for(let x=0;x<64;x++){
      const s=iso(x,y);
      const sx=s.x+ox;
      const sy=s.y+oy;
      
      const dx=x-pl.vx;
      const dy=y-pl.vy;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>10)continue;
      
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.lineTo(sx+TW/2,sy+TH/2);
      ctx.lineTo(sx,sy+TH);
      ctx.lineTo(sx-TW/2,sy+TH/2);
      ctx.closePath();
      
      ctx.fillStyle=(x+y)%2===0?'#4caf50':'#388e3c';
      ctx.fill();
      ctx.strokeStyle='#2e7d32';
      ctx.lineWidth=1;
      ctx.stroke();
    }
  }
  
  // Jugador
  const p=iso(pl.vx,pl.vy);
  ctx.fillStyle='#1976d2';
  ctx.fillRect(p.x+ox-6,p.y+oy-6,12,12);
  ctx.fillStyle='#ffe0b2';
  ctx.fillRect(p.x+ox-4,p.y+oy-10,8,6);
  ctx.fillStyle='#fff';
  ctx.fillRect(p.x+ox-2,p.y+oy-8,2,2);
  ctx.fillRect(p.x+ox+1,p.y+oy-8,2,2);
  
  // UI
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.fillRect(10,10,100,40);
  ctx.fillStyle='#fff';
  ctx.font='12px monospace';
  ctx.fillText('TEST VISIBLE',15,30);
  
  requestAnimationFrame(loop);
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  pl.path.push({x:pl.vx+1,y:pl.vy});
});

loop();
</script>
</body>
</html>
