<!DOCTYPE html>
<html>
<head><title>Test Canvas</title></head>
<body style="margin:0;padding:0;background:red;width:100%;height:100%;overflow:hidden">
<canvas id="c" style="display:block;width:100%;height:100%;background:yellow"></canvas>
<script>
const c=document.getElementById('c');
c.width=window.innerWidth;c.height=window.innerHeight;
const ctx=c.getContext('2d');
ctx.fillStyle='blue';
ctx.fillRect(100,100,200,100);
ctx.fillStyle='white';
ctx.font='20px monospace';
ctx.fillText('CANVAS FUNCIONA',120,160);
</script>
</body>
</html>
