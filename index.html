<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  c.width=W;c.height=H;
}
window.addEventListener('resize',resize);
resize();

const TILE_W=64, TILE_H=32;
const MAP_W=25, MAP_H=25;
const player={x:12,y:12,px:12,py:12,hp:100,mhp:100,mp:50,mmp:50,lv:1,xp:0};
const enemies=[];
const spells=[{name:'Fuego',cost:10,dmg:25,c:'#ff5722'},{name:'Hielo',cost:8,dmg:15,c:'#03a9f4'},{name:'Rayo',cost:15,dmg:30,c:'#ffeb3b'}];
const pets=[{type:'dragon',x:11,y:11,c:'#f44336'},{type:'fairy',x:13,y:11,c:'#f8bbd0'}];

// Mundo
const world=[];
for(let y=0;y<MAP_H;y++){world[y]=[];for(let x=0;x<MAP_W;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%10<2)t=1;else if(v%15<2)t=2;else if(v%20<2)t=3;else if(v%25<2)t=4;else if(v%12<1)t=5;else if(v%18<1)t=6;world[y][x]=t;}}

// Enemigos
for(let i=0;i<5;i++){enemies.push({x:5+(i*4)%15,y:5+(i*3)%15,type:i,hp:40+i*10,mhp:40+i*10,c:['#c62828','#6a1b9a','#1565c0','#2e7d32','#e65100'][i]});}

function toIso(x,y){return{x:(x-y)*TILE_W/2,y:(x+y)*TILE_H/2};}

function drawTile(t,sx,sy){
  ctx.beginPath();
  ctx.moveTo(sx,sy);ctx.lineTo(sx+TILE_W/2,sy+TILE_H/2);ctx.lineTo(sx,sy+TILE_H);ctx.lineTo(sx-TILE_W/2,sy+TILE_H/2);ctx.closePath();
  const colors=[['#4caf50','#388e3c'],['#1565c0','#0d47a1'],['#8d6e63','#5d4037'],['#757575','#424242'],['#e0c878','#c8a840']];
  const c=colors[t]||colors[0];
  ctx.fillStyle=c[0];ctx.fill();ctx.strokeStyle=c[1];ctx.lineWidth=1;ctx.stroke();
  if(t===5){ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.moveTo(sx,sy-18);ctx.lineTo(sx-10,sy+2);ctx.lineTo(sx+10,sy+2);ctx.closePath();ctx.fill();ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy+2,4,6);}
  else if(t===6){ctx.fillStyle='#9e9e9e';ctx.beginPath();ctx.arc(sx,sy+8,6,Math.PI,0);ctx.fill();ctx.fillStyle='#bdbdbd';ctx.beginPath();ctx.arc(sx-2,sy+6,3,Math.PI,0);ctx.fill();}
}

function drawPlayer(sx,sy){
  // Sombra
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(sx,sy+14,10,4,0,0,Math.PI*2);ctx.fill();
  // Piernas
  ctx.fillStyle='#5d4037';ctx.fillRect(sx-5,sy+4,3,8);ctx.fillRect(sx+2,sy+4,3,8);
  // Cuerpo
  ctx.fillStyle='#1976d2';ctx.fillRect(sx-7,sy-6,14,12);
  ctx.fillStyle='#1565c0';ctx.fillRect(sx-7,sy-6,14,3);
  ctx.fillStyle='#ffc107';ctx.fillRect(sx-7,sy,14,2);
  // Cabeza
  ctx.fillStyle='#ffe0b2';ctx.fillRect(sx-5,sy-14,10,8);
  ctx.fillStyle='#3e2723';ctx.fillRect(sx-5,sy-16,10,3);
  // Ojos
  ctx.fillStyle='#000';ctx.fillRect(sx-3,sy-11,2,2);ctx.fillRect(sx+1,sy-11,2,2);
  // Brazos
  ctx.fillStyle='#ffe0b2';ctx.fillRect(sx-9,sy-4,2,6);ctx.fillRect(sx+7,sy-4,2,6);
}

function drawEnemy(e,sx,sy){
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+12,8,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=e.c;
  ctx.fillRect(sx-6,sy-4,12,14);
  ctx.fillStyle='#fff';ctx.fillRect(sx-4,sy-2,3,3);ctx.fillRect(sx+1,sy-2,3,3);
  ctx.fillStyle='#000';ctx.fillRect(sx-3,sy-1,2,2);ctx.fillRect(sx+2,sy-1,2,2);
  // HP
  ctx.fillStyle='#333';ctx.fillRect(sx-12,sy-12,24,4);
  ctx.fillStyle='#e44';ctx.fillRect(sx-12,sy-12,24*e.hp/e.mhp,4);
}

function drawPet(p,sx,sy){
  ctx.globalAlpha=0.7;
  ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(sx,sy,5,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}

function drawUI(){
  ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(10,10,140,90);
  ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='left';
  ctx.fillText(`Lv.${player.lv} Hero`,20,30);
  ctx.fillStyle='#e44';ctx.fillRect(20,38,80,8);ctx.fillStyle='#4a0000';ctx.fillRect(20,38,80*player.hp/player.mhp,8);
  ctx.fillStyle='#4488ff';ctx.fillRect(20,50,80,6);ctx.fillStyle='#000a4a';ctx.fillRect(20,50,80*player.mp/player.mmp,6);
  ctx.fillStyle='#ffeb3b';ctx.fillRect(20,60,80,5);ctx.fillStyle='#333a00';ctx.fillRect(20,60,80*(player.xp/100),5);
  ctx.fillStyle='#fff';ctx.font='10px monospace';
  ctx.fillText(`HP:${player.hp}/${player.mhp}`,20,78);
  ctx.fillText(`XP:${player.xp}/100`,80,78);
  
  // Minimap
  ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(W-90,10,80,80);
  for(let y=0;y<MAP_H;y+=2)for(let x=0;x<MAP_W;x+=2){
    const t=world[y][x];
    if(t===0)ctx.fillStyle='#4caf50';else if(t===1)ctx.fillStyle='#1565c0';
    else if(t===2)ctx.fillStyle='#8d6e63';else if(t===3)ctx.fillStyle='#757575';
    else ctx.fillStyle='#4caf50';
    ctx.fillRect(W-85+x*3,15+y*3,4,4);
  }
  ctx.fillStyle='#ffeb3b';ctx.fillRect(W-85+player.x*3,15+player.y*3,5,5);
  ctx.fillStyle='#f44336';
  for(const e of enemies){ctx.fillRect(W-85+e.x*3,15+e.y*3,4,4);}
  
  // Hechizos
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(W/2-80,H-40,160,35);
  for(let i=0;i<spells.length;i++){
    ctx.fillStyle=spells[i].c;ctx.fillRect(W/2-70+i*50,H-35,45,28);
    ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.textAlign='center';
    ctx.fillText(spells[i].name,W/2-47+i*50,H-22);
  }
}

// Controles
let jx=0,jy=0,ja=false,jsX=0,jsY=0,jid=null;

c.addEventListener('touchstart',e=>{
  e.preventDefault();const t=e.changedTouches[0];
  if(t.clientX<W*0.5){ja=true;jid=t.identifier;jsX=t.clientX;jsY=t.clientY;jx=0;jy=0;}
  else{// Spell casting
    const idx=Math.floor((t.clientX-(W/2-80))/50);
    if(idx>=0&&idx<spells.length&&player.hp>0){enemies.forEach(e=>e.hp-=spells[idx].dmg);player.mp-=spells[idx].cost;}
  }
},{passive:false});

c.addEventListener('touchmove',e=>{
  e.preventDefault();if(!ja)return;
  for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];
    if(t.identifier===jid){const dx=t.clientX-jsX,dy=t.clientY-jsY;
      const d=Math.sqrt(dx*dx+dy*dy);if(d>15){jx=dx*15/d;jy=dy*15/d;}else{jx=dx/15;jy=dy/15;}}
  }
},{passive:false});

c.addEventListener('touchend',e=>{for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===jid){ja=false;jx=0;jy=0;jid=null;}}},{passive:false});

const keys={};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  // Movimiento
  let mx=0,my=0;
  if(ja){mx=jx;my=jy;}
  if(keys['ArrowUp']||keys['w'])my=-1;
  if(keys['ArrowDown']||keys['s'])my=1;
  if(keys['ArrowLeft']||keys['a'])mx=-1;
  if(keys['ArrowRight']||keys['d'])mx=1;
  
  if(mx!==0||my!==0){
    const speed=6*dt;
    const nx=player.x+mx*speed;
    const ny=player.y+my*speed;
    if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&world[Math.floor(ny)][Math.floor(nx)]!==1){
      player.x=nx;player.y=ny;
    }
  }
  
  // Colisión con enemigos
  for(const e of enemies){if(Math.abs(e.x-player.x)<1.2&&Math.abs(e.y-player.y)<1.2){e.hp-=5;if(e.hp<=0){player.xp+=25;e.x=-50;e.y=-50;}}}
  
  // Fondo
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  
  // Cámara
  const cam=toIso(player.x,player.y);
  const ox=W/2-cam.x;
  const oy=H/2-cam.y;
  
  // Mundo
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const iso=toIso(x,y);
    const sx=iso.x+ox;
    const sy=iso.y+oy;
    if(sx<-TILE_W||sx>W+TILE_W||sy<-TILE_H*2||sy>H+TILE_H)continue;
    drawTile(world[y][x],sx,sy);
  }
  
  // Mascotas
  for(const p of pets){const iso=toIso(p.x,p.y);drawPet(p,iso.x+ox,iso.y+oy);}
  
  // Enemigos
  for(const e of enemies){const iso=toIso(e.x,e.y);drawEnemy(e,iso.x+ox,iso.y+oy);}
  
  // Jugador
  const piso=toIso(player.x,player.y);
  drawPlayer(piso.x+ox,piso.y+oy);
  
  // UI
  drawUI();
  
  // Debug
  ctx.fillStyle='#ff0';ctx.font='11px monospace';ctx.textAlign='left';
  ctx.fillText(`Pos:${player.x.toFixed(1)},${player.y.toFixed(1)} | Enemigos:${enemies.filter(e=>e.hp>0).length}`,10,H-10);
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
