<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}html,body{width:100%;height:100%;overflow:hidden;background:#000}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const MW=20,MH=20,TW=64,TH=32;
const world=[];
for(let y=0;y<MH;y++){world[y]=[];for(let x=0;x<MW;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%10<2)t=1;else if(v%16<2)t=2;else if(v%22<2)t=3;else if(v%28<2)t=4;else if(v%14<1)t=5;else if(v%20<1)t=6;world[y][x]=t;}}

const pl={gx:10,gy:10,px:10,py:10,frame:0,ft:0,hp:100,mhp:100,path:[]};
const en=[{x:7,y:7,hp:40,mhp:40,c:'#c62828'},{x:14,y:9,hp:50,mhp:50,c:'#6a1b9a'},{x:10,y:15,hp:30,mhp:30,c:'#1565c0'}];

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

// Pantalla a grid
function screenToGrid(sx,sy){
  const cam=iso(pl.gx,pl.gy);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  const wx=sx-ox,wy=sy-oy;
  return {x:Math.floor((wx/(TW/2)+wy/(TH/2))/2),y:Math.floor((wy/(TH/2)-wx/(TW/2))/2)};
}

// Buscar camino simple (A* simplificado)
function findPath(sx,sy,gx,gy){
  if(gx<0||gx>=MW||gy<0||gy>=MH)return [];
  if(world[gy][gx]===1)return [];
  
  const open=[{x:sx,y:sy,g:0,h:Math.abs(gx-sx)+Math.abs(gy-sy),path:[]}];
  const visited=new Set();
  visited.add(sx+','+sy);
  
  while(open.length>0){
    open.sort((a,b)=>a.g+a.h-b.g-b.h);
    const cur=open.shift();
    
    if(cur.x===gx&&cur.y===gy)return cur.path;
    
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dx,dy] of dirs){
      const nx=cur.x+dx,ny=cur.y+dy;
      const key=nx+','+ny;
      if(nx<0||nx>=MW||ny<0||ny>=MH)continue;
      if(visited.has(key))continue;
      if(world[ny][nx]===1)continue;
      
      // Verificar si hay enemigo
      let hasEnemy=false;
      for(const e of en){if(e.x===nx&&e.y===ny&&e.hp>0){hasEnemy=true;break;}}
      if(hasEnemy)continue;
      
      visited.add(key);
      open.push({x:nx,y:ny,g:cur.g+1,h:Math.abs(gx-nx)+Math.abs(gy-ny),path:[...cur.path,{x:nx,y:ny}]});
    }
  }
  return [];
}

// Tap en pantalla
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(let t of e.changedTouches){
    const g=screenToGrid(t.clientX,t.clientY);
    pl.path=findPath(pl.gx,pl.gy,g.x,g.y);
  }
},{passive:false});

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  // Avanzar por el camino
  if(pl.path.length>0){
    const target=pl.path[0];
    const sp=8*dt;
    let moved=false;
    
    if(pl.px<target.x)pl.px=Math.min(target.x,pl.px+sp);
    else if(pl.px>target.x)pl.px=Math.max(target.x,pl.px-sp);
    
    if(pl.py<target.y)pl.py=Math.min(target.y,pl.py+sp);
    else if(pl.py>target.y)pl.py=Math.max(target.y,pl.py-sp);
    
    if(Math.abs(pl.px-target.x)<0.05&&Math.abs(pl.py-target.y)<0.05){
      pl.px=target.x;pl.py=target.y;
      pl.gx=target.x;pl.gy=target.y;
      pl.path.shift();
      moved=true;
    }
    
    pl.ft+=dt;
    if(pl.ft>0.15){pl.ft=0;pl.frame=(pl.frame+1)%2;}
  }
  
  // Render
  ctx.fillStyle='#1a3a1a';ctx.fillRect(0,0,W,H);
  
  const cam=iso(pl.gx,pl.gy);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  
  // Camino visual
  for(const p of pl.path){
    const s=iso(p.x,p.y),sx=s.x+ox,sy=s.y+oy;
    ctx.fillStyle='rgba(76,175,80,0.15)';
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(76,175,80,0.3)';ctx.lineWidth=1;ctx.stroke();
  }
  
  // Tiles
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const s=iso(x,y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-TW||sx>W+TW||sy<-TH*2||sy>H+TH)continue;
    const t=world[y][x];
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();
    if(t===0){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#7cb342';ctx.fillRect(sx-5,sy+4,1,3);ctx.fillRect(sx+3,sy+6,1,3);}
    else if(t===1){ctx.fillStyle='#1565c0';ctx.fill();ctx.strokeStyle='#0d47a1';ctx.stroke();}
    else if(t===2){ctx.fillStyle='#8d6e63';ctx.fill();ctx.strokeStyle='#5d4037';ctx.stroke();}
    else if(t===3){ctx.fillStyle='#757575';ctx.fill();ctx.strokeStyle='#424242';ctx.stroke();}
    else if(t===4){ctx.fillStyle='#e0c878';ctx.fill();ctx.strokeStyle='#c8a840';ctx.stroke();}
    else if(t===5){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.moveTo(sx,sy-20);ctx.lineTo(sx-12,sy+2);ctx.lineTo(sx+12,sy+2);ctx.closePath();ctx.fill();ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy+2,4,8);}
    else{ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();ctx.fillStyle='#9e9e9e';ctx.beginPath();ctx.ellipse(sx,sy+8,10,6,0,Math.PI,0);ctx.fill();}
  }
  
  // Enemigos
  for(const e of en){
    if(e.hp<=0)continue;
    const s=iso(e.x,e.y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-50||sx>W+50||sy<-50||sy>H+50)continue;
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+12,8,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=e.c;ctx.fillRect(sx-7,sy-5,14,14);
    ctx.fillStyle='#fff';ctx.fillRect(sx-5,sy-3,3,3);ctx.fillRect(sx+2,sy-3,3,3);
    ctx.fillStyle='#333';ctx.fillRect(sx-10,sy-12,20,3);ctx.fillStyle='#e44';ctx.fillRect(sx-9,sy-11,18*e.hp/e.mhp,1);
  }
  
  // Jugador
  const p=iso(pl.px,pl.py),px=p.x+ox,py=p.y+oy,bo=pl.frame===0?0:1;
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(px,py+16,10,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';ctx.fillRect(px-5,py+4,3,8+bo);ctx.fillRect(px+2,py+4,3,8+bo);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-6,py+11+bo,4,3);ctx.fillRect(px+2,py+11+bo,4,3);
  ctx.fillStyle='#1976d2';ctx.fillRect(px-7,py-6,14,12);
  ctx.fillStyle='#1565c0';ctx.fillRect(px-7,py-6,14,3);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-7,py,14,2);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-5,py-12,10,6);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-5,py-14,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(px-3,py-10,2,2);ctx.fillRect(px+1,py-10,2,2);
  ctx.fillStyle='#000';ctx.fillRect(px-2,py-9,1,1);ctx.fillRect(px+2,py-9,1,1);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-9,py-4,2,5);ctx.fillRect(px+7,py-4,2,5);
  ctx.fillStyle='#333';ctx.fillRect(px-12,py-18,24,4);ctx.fillStyle='#4f4';ctx.fillRect(px-11,py-17,22*pl.hp/pl.mhp,2);
  
  // UI
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(10,10,130,45);
  ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(`🦸 Hero Lv.${pl.lv}`,18,25);
  ctx.fillStyle='#4a0000';ctx.fillRect(18,32,110,8);ctx.fillStyle='#e44';ctx.fillRect(19,33,108*pl.hp/pl.mhp,6);
  ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.fillText(`${pl.hp}/${pl.mhp}`,60,38);
  ctx.fillStyle='#ffc107';ctx.font='11px monospace';ctx.fillText(`💰0`,18,50);
  
  // Minimap
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.beginPath();ctx.arc(W-45,55,35,0,Math.PI*2);ctx.fill();
  for(let y=0;y<MH;y+=2)for(let x=0;x<MW;x+=2){
    const t=world[y][x];
    ctx.fillStyle=t===1?'#1565c0':t===2?'#8d6e63':t===3?'#757575':'#4caf50';
    ctx.fillRect(W-45+x*1.5,55+y*1.5,3,3);
  }
  ctx.fillStyle='#ffeb3b';ctx.fillRect(W-45+pl.gx*1.5-1,55+pl.gy*1.5-1,4,4);
  
  // Debug
  ctx.fillStyle='#0f0';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText(`Pos:${pl.gx},${pl.gy} Path:${pl.path.length}`,10,H-10);
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
