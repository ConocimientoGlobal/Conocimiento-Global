<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;position:fixed;top:0;left:0;right:0;bottom:0}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  c.width=w;c.height=h;
  c.style.width=w+'px';c.style.height=h+'px';
  return {w,h};
}

let W,H;
function updateSize(){const r=resize();W=r.w;H=r.h;posUI();}
updateSize();
window.addEventListener('resize',updateSize);
window.addEventListener('orientationchange',()=>setTimeout(updateSize,100));

const TW=64,TH=32,MW=20,MH=20;
const pl={x:10,y:10,f:0,t:0,hp:100,mhp:100,mp:50,mmp:50,lv:1,xp:0,g:0,dir:'down'};
const w=[];
for(let y=0;y<MH;y++){w[y]=[];for(let x=0;x<MW;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%10<2)t=1;else if(v%15<2)t=2;else if(v%20<2)t=3;else if(v%25<2)t=4;else if(v%12<1)t=5;else if(v%18<1)t=6;w[y][x]=t;}}

const en=[
  {x:7,y:7,type:'goblin',hp:40,mhp:40,c:'#4caf50',name:'Goblin'},
  {x:14,y:9,type:'skeleton',hp:50,mhp:50,c:'#e0e0e0',name:'Esqueleto'},
  {x:9,y:14,type:'slime',hp:60,mhp:60,c:'#03a9f4',name:'Slime'},
  {x:16,y:12,type:'wolf',hp:35,mhp:35,c:'#757575',name:'Lobo'}
];

const pts=[];

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

let jx=0,jy=0,ja=false,jsx=0,jsy=0;
const btns=[
  {l:'⚔️',x:0,y:0,r:30,c:'#c62828'},
  {l:'✨',x:0,y:0,r:26,c:'#1565c0'},
  {l:'🐾',x:0,y:0,r:24,c:'#2e7d32'},
  {l:'👆',x:0,y:0,r:26,c:'#ff8f00'}
];

function posUI(){
  btns[0].x=W-50;btns[0].y=H-180;
  btns[1].x=W-100;btns[1].y=H-130;
  btns[2].x=W-50;btns[2].y=H-50;
  btns[3].x=W-100;btns[3].y=H-50;
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();posUI();
  for(let t of e.changedTouches){
    if(t.clientX<W*0.5){
      ja=true;jsx=t.clientX;jsy=t.clientY;jx=0;jy=0;
    } else {
      for(let b of btns){
        const dx=t.clientX-b.x,dy=t.clientY-b.y;
        if(Math.sqrt(dx*dx+dy*dy)<b.r){
          if(b.l==='⚔️'){attack();}
          if(b.l==='✨'){castSpell();}
          if(b.l==='🐾'){petAttack();}
          if(b.l==='👆'){pl.x++;if(pl.x>=MW)pl.x=0;}
          b.p=true;
        }
      }
    }
  }
},{passive:false});

c.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(let t of e.changedTouches){
    if(ja){
      const dx=t.clientX-jsx,dy=t.clientY-jsy;
      const d=Math.sqrt(dx*dx+dy*dy),m=40;
      if(d>m){jx=dx/d;jy=dy/d;}else{jx=dx/m;jy=dy/m;}
    }
  }
},{passive:false});

c.addEventListener('touchend',e=>{ja=false;jx=0;jy=0;for(let b of btns)b.p=false;},{passive:false});

function attack(){
  for(const e of en){
    if(e.hp>0&&Math.abs(e.x-pl.x)<2&&Math.abs(e.y-pl.y)<2){
      e.hp-=15;
      spawnParticles(e.x,e.y,'#f44336',8);
      if(e.hp<=0){pl.xp+=25;pl.g+=10;spawnParticles(e.x,e.y,'#ffc107',12);}
      return;
    }
  }
}

function castSpell(){
  if(pl.mp<10)return;
  pl.mp-=10;
  for(const e of en){if(e.hp>0){e.hp-=12;spawnParticles(e.x,e.y,'#ff5722',5);}}
}

function petAttack(){
  for(const e of en){if(e.hp>0&&Math.abs(e.x-pl.x)<3&&Math.abs(e.y-pl.y)<3)e.hp-=8;}
}

function spawnParticles(gx,gy,color,n){
  const s=iso(gx,gy);
  for(let i=0;i<n;i++){
    pts.push({x:s.x,y:s.y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3-1.5,l:1,c:color});
  }
}

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  if(ja){
    const s=8*dt;
    const nx=pl.x+jx*s,ny=pl.y+jy*s;
    if(nx>=0&&nx<MW&&ny>=0&&ny<MH&&w[Math.floor(ny)][Math.floor(nx)]!==1){
      pl.x=nx;pl.y=ny;pl.t+=dt;
      if(pl.t>0.15){pl.t=0;pl.f=(pl.f+1)%2;}
    }
  }
  
  for(let i=pts.length-1;i>=0;i--){
    pts[i].x+=pts[i].vx;pts[i].y+=pts[i].vy;pts[i].vy+=0.08;pts[i].l-=dt*2.5;
    if(pts[i].l<=0)pts.splice(i,1);
  }
  
  // Fondo con gradiente
  const bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#0a0a1a');bgGrad.addColorStop(1,'#1a2a1a');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
  
  const cam=iso(pl.x,pl.y);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  
  // === TILES CON DETALLE ===
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const s=iso(x,y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-TW||sx>W+TW||sy<-TH*2||sy>H+TH)continue;
    const t=w[y][x];
    
    ctx.beginPath();
    ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();
    
    if(t===0){ // Pasto con textura
      const grad=ctx.createLinearGradient(sx,sy,sx,sy+TH);
      grad.addColorStop(0,'#5fa85f');grad.addColorStop(1,'#3d8b3d');
      ctx.fillStyle=grad;ctx.fill();
      ctx.strokeStyle='#2e7d32';ctx.lineWidth=1;ctx.stroke();
      // Briznas
      ctx.fillStyle='#7cb342';
      ctx.fillRect(sx-6,sy+3,1,4);ctx.fillRect(sx-3,sy+5,1,3);
      ctx.fillRect(sx+4,sy+4,1,4);ctx.fillRect(sx+7,sy+6,1,3);
      ctx.fillRect(sx+1,sy+8,1,2);
    } else if(t===1){ // Agua animada
      const wave=Math.sin(ts*0.003+x*0.5+y*0.3)*0.15+0.85;
      ctx.fillStyle=`rgba(20,90,180,${wave})`;ctx.fill();
      ctx.strokeStyle='#4fc3f7';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.25)';
      ctx.beginPath();ctx.ellipse(sx-4,sy+8,5,2,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(sx+6,sy+12,3,1.5,0,0,Math.PI*2);ctx.fill();
    } else if(t===2){ // Tierra
      ctx.fillStyle='#a08878';ctx.fill();ctx.strokeStyle='#6d4c41';ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,0.15)';
      ctx.fillRect(sx-6,sy+6,2,2);ctx.fillRect(sx+4,sy+8,3,2);ctx.fillRect(sx-1,sy+5,2,2);
    } else if(t===3){ // Piedra
      ctx.fillStyle='#888';ctx.fill();ctx.strokeStyle='#555';ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.2)';
      ctx.beginPath();ctx.arc(sx-3,sy+7,2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.15)';
      ctx.beginPath();ctx.arc(sx+5,sy+10,2,0,Math.PI*2);ctx.fill();
    } else if(t===4){ // Arena
      ctx.fillStyle='#e8d890';ctx.fill();ctx.strokeStyle='#c8a840';ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,0.08)';
      ctx.beginPath();ctx.arc(sx,sy+8,4,0,Math.PI*2);ctx.fill();
    } else if(t===5){ // Árbol
      ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#2e7d32';ctx.stroke();
      // Tronco
      ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy+2,4,10);
      ctx.fillStyle='#4e342e';ctx.fillRect(sx-2,sy+2,1,10);
      // Copa con gradiente
      const treeGrad=ctx.createRadialGradient(sx,sy-8,2,sx,sy-8,14);
      treeGrad.addColorStop(0,'#66bb6a');treeGrad.addColorStop(0.6,'#388e3c');treeGrad.addColorStop(1,'#1b5e20');
      ctx.fillStyle=treeGrad;
      ctx.beginPath();ctx.moveTo(sx,sy-22);ctx.lineTo(sx-14,sy);ctx.lineTo(sx+14,sy);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(sx,sy-28);ctx.lineTo(sx-10,sy-10);ctx.lineTo(sx+10,sy-10);ctx.closePath();ctx.fill();
      // Sombra
      ctx.fillStyle='rgba(0,0,0,0.2)';
      ctx.beginPath();ctx.ellipse(sx+8,sy+2,10,4,0.3,0,Math.PI*2);ctx.fill();
    } else if(t===6){ // Roca
      ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#2e7d32';ctx.stroke();
      ctx.fillStyle='#9e9e9e';
      ctx.beginPath();ctx.ellipse(sx,sy+6,12,7,0,Math.PI,0);ctx.fill();
      ctx.fillStyle='#bdbdbd';
      ctx.beginPath();ctx.ellipse(sx-2,sy+4,8,5,0,Math.PI,0);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.25)';
      ctx.beginPath();ctx.ellipse(sx-4,sy+2,4,2,0,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();
    }
  }
  
  // === ENEMIGOS CON DETALLE ===
  for(const e of en){
    if(e.hp<=0)continue;
    const s=iso(e.x,e.y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-50||sx>W+50||sy<-50||sy>H+50)continue;
    
    const pulse=Math.sin(ts*0.005+e.x)*0.03+1;
    ctx.save();ctx.translate(sx,sy);ctx.scale(pulse,pulse);ctx.translate(-sx,-sy);
    
    // Sombra
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+14,10,4,0,0,Math.PI*2);ctx.fill();
    
    if(e.type==='goblin'){
      ctx.fillStyle='#4caf50';ctx.fillRect(sx-7,sy-6,14,14);
      ctx.fillStyle='#388e3c';ctx.fillRect(sx-7,sy+4,14,4);
      ctx.fillStyle='#fff';ctx.fillRect(sx-5,sy-3,4,4);ctx.fillRect(sx+1,sy-3,4,4);
      ctx.fillStyle='#f44336';ctx.fillRect(sx-4,sy-2,2,2);ctx.fillRect(sx+2,sy-2,2,2);
      ctx.fillStyle='#5d4037';ctx.fillRect(sx-8,sy-8,3,3);ctx.fillRect(sx+5,sy-8,3,3);
    } else if(e.type==='skeleton'){
      ctx.fillStyle='#e0e0e0';ctx.fillRect(sx-6,sy-8,12,14);
      ctx.fillStyle='#bdbdbd';ctx.fillRect(sx-6,sy-8,12,4);
      ctx.fillStyle='#212121';ctx.fillRect(sx-4,sy-5,3,3);ctx.fillRect(sx+1,sy-5,3,3);
      ctx.fillRect(sx-2,sy,4,2);ctx.fillRect(sx-3,sy+3,6,2);
      ctx.fillStyle='#e0e0e0';ctx.fillRect(sx-8,sy-2,2,5);ctx.fillRect(sx+6,sy-2,2,5);
    } else if(e.type==='slime'){
      const squish=Math.sin(ts*0.004)*0.1+1;
      ctx.save();ctx.translate(sx,sy);ctx.scale(squish,1/squish);ctx.translate(-sx,-sy);
      ctx.fillStyle='#03a9f4';ctx.beginPath();ctx.ellipse(sx,sy+4,10,7,0,Math.PI,Math.PI*2);ctx.fill();
      ctx.fillStyle='#0288d1';ctx.beginPath();ctx.ellipse(sx,sy+6,8,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#212121';ctx.fillRect(sx-4,sy,2,2);ctx.fillRect(sx+2,sy,2,2);
      ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.arc(sx-3,sy-1,2,0,Math.PI*2);ctx.fill();
      ctx.restore();
    } else if(e.type==='wolf'){
      ctx.fillStyle='#757575';ctx.fillRect(sx-8,sy-2,16,10);
      ctx.fillStyle='#9e9e9e';ctx.fillRect(sx-12,sy-6,8,8);
      ctx.fillStyle='#ffc107';ctx.fillRect(sx-10,sy-3,2,2);ctx.fillRect(sx-6,sy-3,2,2);
      ctx.fillStyle='#424242';ctx.fillRect(sx+8,sy-4,4,3);
      ctx.fillRect(sx-7,sy+7,3,4);ctx.fillRect(sx+4,sy+7,3,4);
    }
    
    ctx.restore();
    
    // Barra HP
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(sx-14,sy-20,28,5);
    ctx.fillStyle='#e44';ctx.fillRect(sx-13,sy-19,26*e.hp/e.mhp,3);
    ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';
    ctx.fillText(`${e.name} Lv1`,sx,sy-22);
  }
  
  // === JUGADOR CON DETALLE ===
  const p=iso(pl.x,pl.y),px=p.x+ox,py=p.y+oy,bo=pl.f===0?0:1;
  
  // Sombra
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(px,py+18,12,5,0,0,Math.PI*2);ctx.fill();
  
  // Piernas con zapatos
  ctx.fillStyle='#5d4037';ctx.fillRect(px-6,py+4,4,10+bo);ctx.fillRect(px+2,py+4,4,10+bo);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-7,py+13+bo,5,3);ctx.fillRect(px+1,py+13+bo,5,3);
  
  // Cuerpo con gradiente
  const bodyGrad=ctx.createLinearGradient(px-9,py-8,px+9,py+6);
  bodyGrad.addColorStop(0,'#1976d2');bodyGrad.addColorStop(1,'#0d47a1');
  ctx.fillStyle=bodyGrad;ctx.fillRect(px-9,py-8,18,14);
  ctx.fillStyle='#1565c0';ctx.fillRect(px-9,py-8,18,4); // Hombreras
  ctx.fillStyle='#ffc107';ctx.fillRect(px-9,py,18,3); // Cinturón
  ctx.fillStyle='#ff8f00';ctx.fillRect(px-2,py+1,4,2); // Hebilla
  
  // Brazos con mangas
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-11,py-6,3,9);ctx.fillRect(px+8,py-6,3,9);
  ctx.fillStyle='#1976d2';ctx.fillRect(px-11,py-6,3,4);ctx.fillRect(px+8,py-6,3,4);
  
  // Cabeza
  ctx.fillStyle='#ffe0b2';ctx.beginPath();ctx.arc(px,py-12,7,0,Math.PI*2);ctx.fill();
  ctx.fillRect(px-7,py-14,14,6);
  
  // Pelo con textura
  ctx.fillStyle='#3e2723';ctx.beginPath();ctx.arc(px,py-16,7,Math.PI,0);ctx.fill();
  ctx.fillRect(px-7,py-18,14,4);
  ctx.fillStyle='#2d1b14';ctx.fillRect(px-7,py-18,14,2);
  
  // Ojos con brillo
  ctx.fillStyle='#fff';ctx.fillRect(px-4,py-13,3,3);ctx.fillRect(px+1,py-13,3,3);
  ctx.fillStyle='#1a1a1a';ctx.fillRect(px-3,py-12,2,2);ctx.fillRect(px+2,py-12,2,2);
  ctx.fillStyle='#fff';ctx.fillRect(px-3,py-12,1,1);ctx.fillRect(px+2,py-12,1,1);
  
  // Boca
  ctx.fillStyle='#d78a7a';ctx.fillRect(px-2,py-8,4,1);
  
  // Barra HP sobre jugador
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(px-15,py-24,30,5);
  ctx.fillStyle='#4f4';ctx.fillRect(px-14,py-23,28*pl.hp/pl.mhp,3);
  
  // === PARTÍCULAS ===
  for(const pt of pts){
    ctx.globalAlpha=pt.l;ctx.fillStyle=pt.c;
    ctx.beginPath();ctx.arc(pt.x+ox,pt.y+oy,4*pt.l,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  
  // === JOYSTICK ===
  if(ja){
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.beginPath();ctx.arc(jsx,jsy,55,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.arc(jsx,jsy,35,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(jsx+jx*40,jsy+jy*40,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.arc(jsx+jx*40,jsy+jy*40,8,0,Math.PI*2);ctx.fill();
  }
  
  // === BOTONES CON SOMBRA ===
  for(const b of btns){
    // Sombra botón
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.arc(b.x+2,b.y+2,b.r,0,Math.PI*2);ctx.fill();
    // Botón
    const btnGrad=ctx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,2,b.x,b.y,b.r);
    btnGrad.addColorStop(0,'rgba(255,255,255,0.2)');
    btnGrad.addColorStop(1,b.p?'rgba(255,255,255,0.15)':'rgba(0,0,0,0.7)');
    ctx.fillStyle=btnGrad;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=b.c;ctx.lineWidth=3;ctx.stroke();
    // Icono
    ctx.fillStyle='#fff';ctx.font=b.r*0.85+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.l,b.x,b.y+1);
  }
  
  // === HUD SUPERIOR ===
  const hudGrad=ctx.createLinearGradient(0,0,0,45);
  hudGrad.addColorStop(0,'rgba(0,0,0,0.9)');hudGrad.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=hudGrad;ctx.fillRect(0,0,W,45);
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.moveTo(0,45);ctx.lineTo(W,45);ctx.stroke();
  
  ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(`🦸 Hero Nv.${pl.lv}`,10,15);
  
  // Barra HP
  ctx.fillStyle='#4a0000';ctx.fillRect(10,22,90,10);
  ctx.fillStyle='#e44';ctx.fillRect(11,23,88*pl.hp/pl.mhp,8);
  ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.fillText(`${pl.hp}/${pl.mhp}`,45,28);
  
  // Barra MP
  ctx.fillStyle='#000a4a';ctx.fillRect(10,34,90,6);
  ctx.fillStyle='#4488ff';ctx.fillRect(11,35,88*pl.mp/pl.mmp,4);
  
  // Oro y XP
  ctx.fillStyle='#ffc107';ctx.font='12px monospace';ctx.textAlign='right';
  ctx.fillText(`💰 ${pl.g}`,W-10,15);
  ctx.fillStyle='#ffeb3b';ctx.font='10px monospace';
  ctx.fillText(`✨ ${pl.xp}XP`,W-10,30);
  
  // === MINIMAP ===
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.beginPath();ctx.arc(W-45,65,38,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.stroke();
  
  for(let y=0;y<MH;y+=2)for(let x=0;x<MW;x+=2){
    const t=w[y][x];
    if(t===0)ctx.fillStyle='#4caf50';else if(t===1)ctx.fillStyle='#1565c0';
    else if(t===2)ctx.fillStyle='#8d6e63';else if(t===3)ctx.fillStyle='#757575';
    else ctx.fillStyle='#4caf50';
    ctx.fillRect(W-45+x*1.5-1,65+y*1.5-1,3,3);
  }
  // Enemigos en minimapa
  ctx.fillStyle='#f44336';
  for(const e of en){if(e.hp>0)ctx.fillRect(W-45+e.x*1.5-1,65+e.y*1.5-1,3,3);}
  // Jugador
  ctx.fillStyle='#ffeb3b';ctx.fillRect(W-45+pl.x*1.5-2,65+pl.y*1.5-2,5,5);
  ctx.fillStyle='#fff';ctx.fillRect(W-45+pl.x*1.5-1,65+pl.y*1.5-1,2,2);
  
  // Debug
  ctx.fillStyle='#0f0';ctx.font='10px monospace';ctx.textAlign='left';
  ctx.fillText(`W:${W} H:${H}`,8,H-10);
  
  requestAnimationFrame(loop);
}

posUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
