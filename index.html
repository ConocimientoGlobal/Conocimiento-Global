<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PachaMirai Test</title>
<style>*{margin:0;padding:0;background:#000}html,body{width:100%;height:100%;overflow:hidden}canvas{display:block;position:fixed;top:0;left:0}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
c.width=window.innerWidth;
c.height=window.innerHeight;

const W=c.width,H=c.height;
const TW=80,TH=40;

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

function loop(){
  ctx.fillStyle='#1a3a1a';
  ctx.fillRect(0,0,W,H);
  
  const ox=W/2,oy=H/2;
  
  for(let y=0;y<16;y++){
    for(let x=0;x<16;x++){
      const s=iso(x,y);
      const sx=s.x+ox;
      const sy=s.y+oy;
      
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.lineTo(sx+TW/2,sy+TH/2);
      ctx.lineTo(sx,sy+TH);
      ctx.lineTo(sx-TW/2,sy+TH/2);
      ctx.closePath();
      
      ctx.fillStyle=(x+y)%2===0?'#4caf50':'#388e3c';
      ctx.fill();
      ctx.strokeStyle='#2e7d32';
      ctx.lineWidth=1;
      ctx.stroke();
    }
  }
  
  // Jugador centrado
  ctx.fillStyle='#1976d2';
  ctx.fillRect(W/2-7,H/2-22,14,16);
  ctx.fillStyle='#ffc107';
  ctx.fillRect(W/2-7,H/2-8,14,2);
  ctx.fillStyle='#ffe0b2';
  ctx.fillRect(W/2-4,H/2-32,8,7);
  ctx.fillStyle='#3e2723';
  ctx.fillRect(W/2-5,H/2-34,10,4);
  ctx.fillStyle='#fff';
  ctx.fillRect(W/2-2,H/2-29,2,2);
  ctx.fillRect(W/2+1,H/2-29,2,2);
  
  // UI
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.fillRect(10,10,120,40);
  ctx.fillStyle='#fff';
  ctx.font='bold 12px monospace';
  ctx.textAlign='left';
  ctx.fillText('TEST VISIBLE',15,25);
  ctx.fillText('W:'+W+' H:'+H,15,40);
  
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
