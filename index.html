<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;position:fixed;top:0;left:0}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  c.width=W;c.height=H;
  // Asegurar que los botones estén en posición correcta
  positionUI();
}
window.addEventListener('resize',resize);
resize();

// === MUNDO ISOMÉTRICO ===
const TILE_W=64,TILE_H=32;
const MAP_W=25,MAP_H=25;
const player={x:12,y:12,frame:0,ft:0,hp:100,mhp:100,mp:50,mmp:50,lv:1,xp:0,gold:0};

const world=[];
for(let y=0;y<MAP_H;y++){world[y]=[];for(let x=0;x<MAP_W;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%10<2)t=1;else if(v%15<2)t=2;else if(v%20<2)t=3;else if(v%25<2)t=4;else if(v%12<1)t=5;else if(v%18<1)t=6;world[y][x]=t;}}

const enemies=[];
for(let i=0;i<6;i++){enemies.push({x:5+(i*4)%15,y:5+(i*3)%15,type:i,hp:50+i*15,mhp:50+i*15,c:['#c62828','#6a1b9a','#1565c0','#2e7d32','#e65100','#ad1457'][i],name:['Goblin','Esqueleto','Slime','Lobo','Orco','Demonio'][i]});}

const spells=[{name:'Fuego',cost:10,dmg:25,c:'#ff5722'},{name:'Hielo',cost:8,dmg:15,c:'#03a9f4'},{name:'Rayo',cost:15,dmg:30,c:'#ffeb3b'}];

function toIso(x,y){return{x:(x-y)*TILE_W/2,y:(x+y)*TILE_H/2};}

// === CONTROLES MÓVIL ===
let joyX=0,joyY=0;
let joyActive=false;
let joyStartX=0,joyStartY=0;
let joyId=null;
let joyCenterX=100,joyCenterY=0; // Se calcula en positionUI()

// Botones de acción
const buttons=[
  {id:'btn_attack',label:'⚔️',x:0,y:0,r:32,color:'#c62828',action:()=>attackNearest()},
  {id:'btn_spell',label:'✨',x:0,y:0,r:28,color:'#1565c0',action:()=>castSpell()},
  {id:'btn_pet',label:'🐾',x:0,y:0,r:24,color:'#2e7d32',action:()=>usePet()},
  {id:'btn_move',label:'👆',x:0,y:0,r:28,color:'#ff8f00',action:()=>tapMove()}
];

let tapMode=false;

function positionUI(){
  joyCenterY=H-100;
  // Botones a la derecha
  buttons[0].x=W-60;buttons[0].y=H-180; // Ataque
  buttons[1].x=W-110;buttons[1].y=H-130; // Hechizo
  buttons[2].x=W-60;buttons[2].y=H-60; // Mascota
  buttons[3].x=W-110;buttons[3].y=H-60; // Tap move
}

// Touch handler
c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const tx=e.clientX,ty=e.clientY;
  
  // Verificar botones
  for(const btn of buttons){
    const dx=tx-btn.x,dy=ty-btn.y;
    if(Math.sqrt(dx*dx+dy*dy)<btn.r){
      btn.action();
      btn.pressed=true;
      return;
    }
  }
  
  // Joystick (mitad izquierda)
  if(tx<W*0.55){
    joyActive=true;
    joyId=e.pointerId;
    joyStartX=tx;
    joyStartY=ty;
    joyCenterX=tx;
    joyCenterY=ty;
    joyX=0;joyY=0;
  } else if(tapMode){
    // Tap para mover
    handleTapMove(tx,ty);
  }
},{passive:false});

c.addEventListener('pointermove',e=>{
  if(!joyActive||e.pointerId!==joyId)return;
  e.preventDefault();
  const dx=e.clientX-joyStartX;
  const dy=e.clientY-joyStartY;
  const d=Math.sqrt(dx*dx+dy*dy);
  const max=50;
  if(d>max){joyX=dx/d;joyY=dy/d;}else{joyX=dx/max;joyY=dy/max;}
},{passive:false});

c.addEventListener('pointerup',e=>{
  if(e.pointerId===joyId){
    joyActive=false;
    joyX=0;joyY=0;
  }
  // Liberar botones
  for(const btn of buttons)btn.pressed=false;
},{passive:false});

c.addEventListener('pointercancel',e=>{
  if(e.pointerId===joyId){joyActive=false;joyX=0;joyY=0;}
  for(const btn of buttons)btn.pressed=false;
},{passive:false});

// Prevenir menú contextual
c.addEventListener('contextmenu',e=>e.preventDefault());

// === ACCIONES ===
function attackNearest(){
  let nearest=null,dist=999;
  for(const e of enemies){
    if(e.hp<=0)continue;
    const d=Math.abs(e.x-player.x)+Math.abs(e.y-player.y);
    if(d<dist){dist=d;nearest=e;}
  }
  if(nearest&&dist<2){nearest.hp-=20;spawnParticles(nearest.x,nearest.y,'#f44336',8);}
}

function castSpell(){
  if(player.mp<10)return;
  player.mp-=10;
  for(const e of enemies){if(e.hp>0){e.hp-=15;spawnParticles(e.x,e.y,'#ff5722',5);}}
}

function usePet(){
  // Mascota ataca
  for(const e of enemies){if(e.hp>0&&Math.abs(e.x-player.x)<3&&Math.abs(e.y-player.y)<3){e.hp-=10;}}
}

function tapMove(){
  tapMode=!tapMode;
  buttons[3].label=tapMode?'✋':'👆';
  buttons[3].color=tapMode?'#e65100':'#ff8f00';
}

function handleTapMove(tx,ty){
  // Convertir pantalla a grid
  const cam=toIso(player.x,player.y);
  const ox=W/2-cam.x;
  const oy=H/2-cam.y;
  const wx=((tx-ox)/(TILE_W/2)+(ty-oy)/(TILE_H/2))/2;
  const wy=((ty-oy)/(TILE_H/2)-(tx-ox)/(TILE_W/2))/2;
  // Mover hacia esa dirección
  const dx=Math.sign(wx-player.x);
  const dy=Math.sign(wy-player.y);
  const nx=player.x+dx;
  const ny=player.y+dy;
  if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&world[Math.floor(ny)][Math.floor(nx)]!==1){
    player.x=nx;player.y=ny;
  }
}

// === PARTÍCULAS ===
const particles=[];
function spawnParticles(gx,gy,color,n){
  const iso=toIso(gx,gy);
  for(let i=0;i<n;i++){
    particles.push({x:iso.x,y:iso.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-2,life:1,color});
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=dt*2;
    if(p.life<=0)particles.splice(i,1);
  }
}

// === GAME LOOP ===
let last=performance.now();

function update(dt){
  // Movimiento con joystick
  if(joyActive&&(joyX!==0||joyY!==0)){
    const speed=8*dt;
    // Convertir dirección isométrica
    const mx=joyX;
    const my=joyY;
    const nx=player.x+mx*speed;
    const ny=player.y+my*speed;
    if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&world[Math.floor(ny)][Math.floor(nx)]!==1){
      player.x=nx;player.y=ny;
      player.ft+=dt;
      if(player.ft>0.2){player.ft=0;player.frame=(player.frame+1)%2;}
    }
  }
  
  // Colisión con enemigos
  for(const e of enemies){
    if(e.hp>0&&Math.abs(e.x-player.x)<1.2&&Math.abs(e.y-player.y)<1.2){
      e.hp-=3;spawnParticles(e.x,e.y,'#f44336',3);
      if(e.hp<=0){player.xp+=30;player.gold+=10;spawnParticles(e.x,e.y,'#ffc107',10);}
    }
  }
  
  updateParticles(dt);
}

function render(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  
  const cam=toIso(player.x,player.y);
  const ox=W/2-cam.x;
  const oy=H/2-cam.y;
  
  // Tiles
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const iso=toIso(x,y);
    const sx=iso.x+ox;
    const sy=iso.y+oy;
    if(sx<-TILE_W||sx>W+TILE_W||sy<-TILE_H*2||sy>H+TILE_H)continue;
    
    const t=world[y][x];
    ctx.beginPath();
    ctx.moveTo(sx,sy);ctx.lineTo(sx+TILE_W/2,sy+TILE_H/2);ctx.lineTo(sx,sy+TILE_H);ctx.lineTo(sx-TILE_W/2,sy+TILE_H/2);ctx.closePath();
    
    if(t===0){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#7cb342';ctx.fillRect(sx-5,sy+4,1,3);ctx.fillRect(sx+3,sy+6,1,3);ctx.fillRect(sx+7,sy+5,1,2);}
    else if(t===1){ctx.fillStyle='#1565c0';ctx.fill();ctx.strokeStyle='#0d47a1';ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.ellipse(sx-5,sy+8,6,2,0,0,Math.PI*2).fill();}
    else if(t===2){ctx.fillStyle='#8d6e63';ctx.fill();ctx.strokeStyle='#5d4037';ctx.stroke();}
    else if(t===3){ctx.fillStyle='#757575';ctx.fill();ctx.strokeStyle='#424242';ctx.stroke();}
    else if(t===4){ctx.fillStyle='#e0c878';ctx.fill();ctx.strokeStyle='#c8a840';ctx.stroke();}
    else if(t===5){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.moveTo(sx,sy-20);ctx.lineTo(sx-12,sy+2);ctx.lineTo(sx+12,sy+2);ctx.closePath().fill();ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy+2,4,8);}
    else if(t===6){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();ctx.fillStyle='#9e9e9e';ctx.beginPath();ctx.ellipse(sx,sy+8,10,6,0,Math.PI,0).ctx.fill();}
  }
  
  // Enemigos
  for(const e of enemies){
    if(e.hp<=0)continue;
    const iso=toIso(e.x,e.y);
    const sx=iso.x+ox;
    const sy=iso.y+oy;
    if(sx<-50||sx>W+50||sy<-50||sy>H+50)continue;
    
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+12,8,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=e.c;ctx.fillRect(sx-6,sy-4,12,14);
    ctx.fillStyle='#fff';ctx.fillRect(sx-4,sy-2,3,3);ctx.fillRect(sx+1,sy-2,3,3);
    ctx.fillStyle='#000';ctx.fillRect(sx-3,sy-1,2,2);ctx.fillRect(sx+2,sy-1,2,2);
    ctx.fillStyle='#333';ctx.fillRect(sx-12,sy-12,24,4);
    ctx.fillStyle='#e44';ctx.fillRect(sx-11,sy-11,22*e.hp/e.mhp,2);
  }
  
  // Jugador
  const piso=toIso(player.x,player.y);
  const px=piso.x+ox;
  const py=piso.y+oy;
  const bo=player.frame===0?0:1;
  
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(px,py+16,10,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';ctx.fillRect(px-5,py+4,3,8+bo);ctx.fillRect(px+2,py+4,3,8+bo);
  ctx.fillStyle='#1976d2';ctx.fillRect(px-7,py-6,14,12);
  ctx.fillStyle='#1565c0';ctx.fillRect(px-7,py-6,14,3);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-7,py,14,2);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-5,py-12,10,6);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-5,py-14,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(px-3,py-10,2,2);ctx.fillRect(px+1,py-10,2,2);
  ctx.fillStyle='#000';ctx.fillRect(px-2,py-9,1,1);ctx.fillRect(px+2,py-9,1,1);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-9,py-4,2,5);ctx.fillRect(px+7,py-4,2,5);
  ctx.fillStyle='#333';ctx.fillRect(px-12,py-18,24,4);
  ctx.fillStyle='#4f4';ctx.fillRect(px-11,py-17,22*player.hp/player.mhp,2);
  
  // Partículas
  ctx.save();ctx.translate(ox,oy);
  for(const p of particles){
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.restore();
  
  // === UI MÓVIL ===
  
  // Joystick
  ctx.fillStyle='rgba(255,255,255,0.1)';
  ctx.beginPath();ctx.arc(joyCenterX,joyCenterY,50,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.stroke();
  if(joyActive){
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();ctx.arc(joyCenterX+joyX*40,joyCenterY+joyY*40,20,0,Math.PI*2);ctx.fill();
  }
  
  // Botones de acción
  for(const btn of buttons){
    ctx.fillStyle=btn.pressed?'rgba(255,255,255,0.3)':'rgba(0,0,0,0.6)';
    ctx.beginPath();ctx.arc(btn.x,btn.y,btn.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=btn.color;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=btn.r*0.8+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(btn.label,btn.x,btn.y);
  }
  
  // Barra superior
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(0,0,W,40);
  ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(`Lv.${player.lv}  Hero`,10,20);
  ctx.fillStyle='#e44';ctx.fillRect(100,12,80,16);
  ctx.fillStyle='#4a0000';ctx.fillRect(101,13,78*player.hp/player.mhp,14);
  ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.fillText(`${player.hp}/${player.mhp}`,130,20);
  ctx.fillStyle='#ffc107';ctx.font='12px monospace';ctx.textAlign='right';
  ctx.fillText(`💰${player.gold}  ✨${player.xp}XP`,W-10,20);
  
  // Indicador tap mode
  if(tapMode){
    ctx.fillStyle='rgba(255,140,0,0.3)';
    ctx.fillRect(W*0.55,40,W*0.45,H-200);
    ctx.fillStyle='#ff8f00';ctx.font='12px monospace';ctx.textAlign='center';
    ctx.fillText('TAP PARA MOVER',W*0.775,100);
  }
  
  // Minimap
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.beginPath();ctx.arc(W-50,70,35,0,Math.PI*2);ctx.fill();
  for(let y=0;y<MAP_H;y+=2)for(let x=0;x<MAP_W;x+=2){
    const t=world[y][x];
    if(t===0)ctx.fillStyle='#4caf50';else if(t===1)ctx.fillStyle='#1565c0';
    else if(t===2)ctx.fillStyle='#8d6e63';else if(t===3)ctx.fillStyle='#757575';
    else ctx.fillStyle='#4caf50';
    ctx.fillRect(W-50+x*1.4-1,70+y*1.4-1,3,3);
  }
  ctx.fillStyle='#ffeb3b';ctx.fillRect(W-50+player.x*1.4-2,70+player.y*1.4-2,5,5);
  ctx.fillStyle='#f44336';
  for(const e of enemies){if(e.hp>0)ctx.fillRect(W-50+e.x*1.4-1,70+e.y*1.4-1,3,3);}
}

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
