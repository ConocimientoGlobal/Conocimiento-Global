<canvas id="c"></canvas>
<script>
// === dev/config.js ===
// ============================================================================
// CONFIGURACIÓN GLOBAL
// ============================================================================

const WORLD_W = 64;
const WORLD_H = 64;

let W, H;
let TW, TH;

const VISION_RADIO = 12;

function calcularTileSize() {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
  const TILE = Math.min(W, H) / 4;
  TW = TILE;
  TH = TILE / 2;
}

function resize() { calcularTileSize(); }

// === dev/biomas.js ===
// ============================================================================
// BIOMAS
// ============================================================================

const BIOMAS = [
  {id:0, nombre:'Pueblo',     color1:'#4caf50', color2:'#388e3c', dificultad:null},
  {id:1, nombre:'Bosque',     color1:'#2e7d32', color2:'#1b5e20', dificultad:null},
  {id:2, nombre:'Desierto',   color1:'#f9a825', color2:'#f57f17', dificultad:'sed'},
  {id:3, nombre:'Montana',    color1:'#9e9e9e', color2:'#757575', dificultad:'frio'},
  {id:4, nombre:'Pantano',    color1:'#5d4037', color2:'#4e342e', dificultad:'veneno'},
  {id:5, nombre:'Volcan',     color1:'#d84315', color2:'#bf360c', dificultad:'calor'},
  {id:6, nombre:'Castillo',   color1:'#37474f', color2:'#263238', dificultad:null}
];

function getBioma(x, y) {
  const bx = Math.min(7, Math.floor(x / 8));
  const by = Math.min(7, Math.floor(y / 8));
  const mapa = [
    [0, 1, 1, 2, 2, 5, 5, 5],
    [1, 1, 2, 2, 3, 5, 5, 6],
    [1, 2, 2, 3, 3, 5, 6, 6],
    [2, 2, 3, 3, 4, 5, 6, 6],
    [2, 3, 3, 4, 4, 6, 6, 6],
    [3, 3, 4, 4, 4, 6, 6, 6],
    [3, 4, 4, 4, 6, 6, 6, 6],
    [4, 4, 4, 6, 6, 6, 6, 6]
  ];
  return mapa[by][bx];
}

// === dev/mundo.js ===
// ============================================================================
// MUNDO - Generación, NPCs, Cofres
// ============================================================================

const world = [];
const npcs = [];
const cofres = [];

function generarMundo() {
  for (let y = 0; y < WORLD_H; y++) {
    world[y] = [];
    for (let x = 0; x < WORLD_W; x++) {
      if (x === 0 || x === WORLD_W - 1 || y === 0 || y === WORLD_H - 1) {
        world[y][x] = 1;
      } else if (BIOMAS[getBioma(x, y)].id === 0) {
        world[y][x] = 0;
      } else {
        const v = ((x * 374761393 + y * 668265263) ^ 0x5bf03635) >>> 0;
        world[y][x] = (v % 20 < 1) ? 1 : 0;
      }
    }
  }
  world[8][8] = 0;
}

function generarNPCs() {
  npcs.length = 0;
  npcs.push(
    {x:6, y:6, nombre:'Herrero', color:'#e53935'},
    {x:9, y:7, nombre:'Mago', color:'#8e24aa'},
    {x:7, y:9, nombre:'Comerciante', color:'#ffb300'},
    {x:20, y:12, nombre:'Lenador', color:'#6d4c41'},
    {x:35, y:15, nombre:'Nomada', color:'#ff8f00'},
    {x:50, y:25, nombre:'Alquimista', color:'#00897b'},
    {x:20, y:45, nombre:'Bruja', color:'#5e35b1'},
    {x:55, y:40, nombre:'HerreroLava', color:'#d84315'},
    {x:58, y:58, nombre:'Rey', color:'#ffd600'}
  );
}

function generarCofres() {
  cofres.length = 0;
  cofres.push(
    {x:10, y:10, abierto:false},
    {x:25, y:18, abierto:false},
    {x:40, y:22, abierto:false},
    {x:55, y:35, abierto:false},
    {x:15, y:50, abierto:false},
    {x:60, y:60, abierto:false}
  );
}

function esCaminable(x, y) {
  if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return false;
  if (world[y][x] !== 0) return false;
  for (const n of npcs) if (n.x === x && n.y === y) return false;
  for (const co of cofres) if (co.x === x && co.y === y && !co.abierto) return false;
  return true;
}

// === dev/texturas.js ===
// ============================================================================
// TEXTURAS CON PROFUNDIDAD Y SOMBRAS
// ============================================================================

function texturaHierba(sx, sy, biomaId, v) {
  switch(biomaId) {
    case 0: // Pueblo
      ctx.fillStyle = '#7cb342';
      ctx.fillRect(sx - 8, sy + TH/2 - 6, 3, 7);
      ctx.fillRect(sx + 5, sy + TH/2 - 4, 3, 5);
      ctx.fillRect(sx - 3, sy + TH/2 - 8, 3, 9);
      ctx.fillRect(sx + 10, sy + TH/2 - 5, 3, 6);
      ctx.fillRect(sx - 12, sy + TH/2 - 3, 3, 4);
      ctx.fillStyle = '#8bc34a';
      ctx.fillRect(sx - 6, sy + TH/2 - 10, 2, 11);
      ctx.fillRect(sx + 7, sy + TH/2 - 9, 2, 10);
      break;
    case 1: // Bosque
      for (let i = 0; i < 6; i++) {
        const hx = sx - 14 + i * 5 + (v % 3);
        const h = 8 + (v % 4);
        ctx.fillStyle = (i + v) % 2 === 0 ? '#7cb342' : '#689f38';
        ctx.fillRect(hx, sy + TH/2 - h, 2, h + 2);
      }
      break;
    case 2: // Desierto
      ctx.fillStyle = '#4caf50';
      ctx.fillRect(sx - 6, sy + TH/2 - 12, 5, 12);
      ctx.fillRect(sx + 4, sy + TH/2 - 8, 4, 8);
      ctx.fillRect(sx + 10, sy + TH/2 - 14, 4, 14);
      ctx.fillStyle = '#388e3c';
      ctx.fillRect(sx - 4, sy + TH/2 - 10, 3, 10);
      break;
    case 3: // Montaña
      ctx.fillStyle = '#689f38';
      ctx.fillRect(sx - 10, sy + TH/2 - 4, 3, 4);
      ctx.fillRect(sx + 3, sy + TH/2 - 6, 3, 6);
      ctx.fillRect(sx + 9, sy + TH/2 - 4, 3, 4);
      ctx.fillStyle = '#558b2f';
      ctx.fillRect(sx - 5, sy + TH/2 - 5, 2, 5);
      ctx.fillRect(sx + 6, sy + TH/2 - 7, 2, 7);
      break;
    case 4: // Pantano
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(sx - 8, sy + TH/2 - 8, 2, 9);
      ctx.fillRect(sx + 5, sy + TH/2 - 10, 2, 11);
      ctx.fillRect(sx + 12, sy + TH/2 - 6, 2, 7);
      ctx.fillStyle = '#795548';
      ctx.fillRect(sx - 4, sy + TH/2 - 12, 2, 13);
      ctx.fillRect(sx + 8, sy + TH/2 - 9, 2, 10);
      break;
    case 5: // Volcán
      ctx.fillStyle = '#424242';
      ctx.fillRect(sx - 8, sy + TH/2 - 3, 3, 3);
      ctx.fillRect(sx + 5, sy + TH/2 - 4, 3, 4);
      ctx.fillRect(sx + 10, sy + TH/2 - 2, 3, 2);
      ctx.fillStyle = '#616161';
      ctx.fillRect(sx - 3, sy + TH/2 - 5, 2, 5);
      break;
    case 6: // Castillo
      ctx.fillStyle = '#7cb342';
      ctx.fillRect(sx - 8, sy + TH/2 - 6, 3, 7);
      ctx.fillRect(sx + 5, sy + TH/2 - 4, 3, 5);
      ctx.fillRect(sx - 3, sy + TH/2 - 8, 3, 9);
      ctx.fillStyle = '#8bc34a';
      ctx.fillRect(sx + 10, sy + TH/2 - 5, 2, 6);
      break;
  }
}

function texturaSuelo(sx, sy, v) {
  // Grietas profundas
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  const g1x = sx - 10 + (v % 6);
  const g1y = sy + TH/4 + (v % 4);
  ctx.fillRect(g1x, g1y, 1, 4 + (v % 3));
  ctx.fillRect(g1x + 2, g1y + 2, 3, 1);
  ctx.fillRect(g1x + 5, g1y - 1, 1, 3);
  
  // Grietas secundarias
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(sx + 8, sy + TH/3 + 1, 1, 2);
  ctx.fillRect(sx - 6, sy + TH/2 - 2, 2, 1);
  
  // Pequeñas piedras
  ctx.fillStyle = 'rgba(120,120,120,0.35)';
  ctx.fillRect(sx + 7, sy + TH/3, 3, 2);
  ctx.fillRect(sx - 5, sy + TH/2 - 1, 2, 2);
  ctx.fillRect(sx + 12, sy + TH/2, 2, 2);
  ctx.fillRect(sx - 10, sy + TH/3, 2, 1);
  
  // Guijarros
  ctx.fillStyle = 'rgba(100,100,100,0.25)';
  ctx.fillRect(sx + 3, sy + TH/2, 1, 1);
  ctx.fillRect(sx - 8, sy + TH/2 + 1, 1, 1);
  ctx.fillRect(sx + 14, sy + TH/4, 1, 1);
  
  // Hojas/ramas caídas
  if (v % 5 === 0) {
    ctx.fillStyle = 'rgba(139,100,50,0.45)';
    ctx.fillRect(sx - 4, sy + TH/2 + 1, 4, 1);
  }
  if (v % 7 === 0) {
    ctx.fillStyle = 'rgba(100,80,40,0.35)';
    ctx.fillRect(sx + 6, sy + TH/3 + 1, 3, 1);
  }
  if (v % 11 === 0) {
    ctx.fillStyle = 'rgba(160,130,70,0.4)';
    ctx.fillRect(sx - 2, sy + TH/2 + 2, 3, 1);
  }
  
  // Musgo/liquen
  if (v % 13 === 0) {
    ctx.fillStyle = 'rgba(80,120,60,0.3)';
    ctx.fillRect(sx - 8, sy + TH/4, 4, 2);
  }
  
  // Charcos
  if (v % 17 === 0) {
    ctx.fillStyle = 'rgba(60,140,180,0.25)';
    ctx.fillRect(sx + 4, sy + TH/3, 3, 2);
  }
  
  // Pisadas
  if (v % 23 === 0) {
    ctx.fillStyle = 'rgba(80,60,30,0.15)';
    ctx.fillRect(sx - 3, sy + TH/2 + 1, 2, 3);
    ctx.fillRect(sx + 2, sy + TH/2 + 2, 2, 3);
  }
}

// === TILE CON PROFUNDIDAD Y SOMBRA ===
function drawTileConProfundidad(sx, sy, w, h, color1, color2, x, y) {
  const v = ((x * 374761393 + y * 668265263) ^ 0x5bf03635) >>> 0;
  
  // Tile base
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx + w / 2, sy + h / 2);
  ctx.lineTo(sx, sy + h);
  ctx.lineTo(sx - w / 2, sy + h / 2);
  ctx.closePath();
  
  // Gradiente de profundidad (luz desde arriba-izquierda)
  const grad = ctx.createLinearGradient(sx - w/2, sy, sx + w/2, sy + h);
  grad.addColorStop(0, color1);
  grad.addColorStop(0.4, color2);
  grad.addColorStop(0.7, shadeColor(color2, -15));
  grad.addColorStop(1, shadeColor(color2, -25));
  ctx.fillStyle = grad;
  ctx.fill();
  
  // Borde superior brillante (luz)
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx + w / 2, sy + h / 2);
  ctx.lineTo(sx, sy + h / 2);
  ctx.lineTo(sx - w / 2, sy + h / 2);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fill();
  
  // Borde inferior sombreado
  ctx.beginPath();
  ctx.moveTo(sx, sy + h);
  ctx.lineTo(sx + w / 2, sy + h / 2);
  ctx.lineTo(sx, sy + h / 2);
  ctx.lineTo(sx - w / 2, sy + h / 2);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fill();
  
  // Sombra interna (simula relieve)
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(sx - w/4, sy + h/4, w/2, h/2);
  
  // Punto de luz aleatorio (simula reflexo)
  if (v % 19 === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(sx - 3 + (v % 6), sy + 2 + (v % 4), 2, 2);
  }
  
  // Textura de ruido (simula granularidad)
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (let i = 0; i < 3; i++) {
    const nx = sx - 8 + (v * (i+1) % 16);
    const ny = sy + 2 + (v * (i+2) % 8);
    ctx.fillRect(nx, ny, 1, 1);
  }
}

function drawTexturasBioma(sx, sy, x, y) {
  const v = ((x * 374761393 + y * 668265263) ^ 0x5bf03635) >>> 0;
  const biomaId = getBioma(x, y);
  texturaHierba(sx, sy, biomaId, v);
  texturaSuelo(sx, sy, v);
}

function drawCaminoTierra(sx, sy, v) {
  // Sombra del camino
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(sx - TW/3 + 2, sy + TH/4 + 2, TW*2/3, TH/3);
  
  ctx.fillStyle = '#a1887f';
  ctx.fillRect(sx - TW/3, sy + TH/4, TW*2/3, TH/3);
  
  ctx.fillStyle = 'rgba(139,100,50,0.35)';
  ctx.fillRect(sx - 5, sy + TH/3, 3, 2);
  ctx.fillRect(sx + 4, sy + TH/3 + 1, 2, 2);
  ctx.fillRect(sx + 10, sy + TH/4 + 1, 2, 3);
  
  ctx.fillStyle = '#7cb342';
  ctx.fillRect(sx - TW/3, sy + TH/4, 3, TH/3);
  ctx.fillRect(sx + TW/3 - 3, sy + TH/4, 3, TH/3);
  
  ctx.fillStyle = '#8bc34a';
  ctx.fillRect(sx - TW/3 + 1, sy + TH/4 - 3, 2, 4);
  ctx.fillRect(sx + TW/3 - 3, sy + TH/4 - 2, 2, 3);
}

// === dev/efectos.js ===
// ============================================================================
// EFECTOS - Agua animada, niebla, humo, reflejos
// ============================================================================

let frameCount = 0;

// === AGUA ANIMADA CON REFLEJOS ===
function drawAguaAnimada(sx, sy, w, h, x, y) {
  const v = ((x * 374761393 + y * 668265263) ^ 0x5bf03635) >>> 0;
  const waveOffset = Math.sin((frameCount * 0.05) + (x + y) * 0.3) * 2;
  
  // Base del agua con gradiente
  const waterGrad = ctx.createLinearGradient(sx - w/2, sy, sx + w/2, sy + h);
  waterGrad.addColorStop(0, '#1565c0');
  waterGrad.addColorStop(0.5, '#1976d2');
  waterGrad.addColorStop(1, '#0d47a1');
  ctx.fillStyle = waterGrad;
  
  ctx.beginPath();
  ctx.moveTo(sx, sy + waveOffset);
  ctx.lineTo(sx + w / 2, sy + h / 2 + waveOffset);
  ctx.lineTo(sx, sy + h + waveOffset);
  ctx.lineTo(sx - w / 2, sy + h / 2 + waveOffset);
  ctx.closePath();
  ctx.fill();
  
  // Ondas/reflejos
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(sx - 6 + waveOffset, sy + TH/3, 4, 1);
  ctx.fillRect(sx + 2 + waveOffset * 0.5, sy + TH/2, 3, 1);
  ctx.fillRect(sx - 4 + waveOffset * 0.7, sy + TH/4 + 2, 5, 1);
  
  // Brillos especulares
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillRect(sx - 2 + waveOffset, sy + TH/3 + 1, 1, 1);
  ctx.fillRect(sx + 5 + waveOffset * 0.8, sy + TH/2 - 1, 1, 1);
  
  // Borde de orilla (arena/tierra)
  ctx.fillStyle = 'rgba(210,180,120,0.6)';
  ctx.fillRect(sx - w/3, sy + h - 2, w*2/3, 2);
}

// === NIEBA BAJA CON PARTÍCULAS ===
function drawNiebla(sx, sy, w, h, densidad) {
  const v = ((sx * 374761393 + sy * 668265263) ^ 0x5bf03635) >>> 0;
  const nieblaOffset = Math.sin((frameCount * 0.02) + sx * 0.01) * 3;
  
  // Capas de niebla
  for (let i = 0; i < 3; i++) {
    const alpha = 0.08 - i * 0.02;
    ctx.fillStyle = `rgba(180,200,180,${alpha})`;
    ctx.fillRect(sx - w/3, sy + TH/2 + i * 2 + nieblaOffset, w*2/3, 3);
  }
  
  // Partículas flotantes
  ctx.fillStyle = 'rgba(200,220,200,0.3)';
  for (let i = 0; i < 3; i++) {
    const px = sx - 8 + ((v + i * 7) % 16);
    const py = sy + TH/4 + ((v + i * 11) % 6) + nieblaOffset;
    ctx.fillRect(px, py, 1, 1);
  }
}

// === HUMO ANIMADO DE CHIMENEA ===
function drawHumo(sx, sy) {
  const humoOffset = frameCount * 0.08;
  
  for (let i = 0; i < 4; i++) {
    const hy = sy - i * 6 - (humoOffset % 8);
    const hx = sx + Math.sin(humoOffset + i) * 2;
    const alpha = 0.4 - i * 0.1;
    const size = 2 + i;
    
    ctx.fillStyle = `rgba(180,180,180,${alpha})`;
    ctx.beginPath();
    ctx.arc(hx, hy, size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Luz cálida en la base
  ctx.fillStyle = 'rgba(255,200,100,0.2)';
  ctx.beginPath();
  ctx.arc(sx, sy - 2, 4, 0, Math.PI * 2);
  ctx.fill();
}

// === REFLEJO EN AGUA ===
function drawReflejoAgua(sx, sy, objeto, x, y) {
  const v = ((x * 374761393 + y * 668265263) ^ 0x5bf03635) >>> 0;
  const waveOffset = Math.sin((frameCount * 0.05) + (x + y) * 0.3) * 1;
  
  // Solo reflejar si hay agua cerca
  let tieneAgua = false;
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const nx = x + dx;
    const ny = y + dy;
    if (nx >= 0 && nx < WORLD_W && ny >= 0 && ny < WORLD_H) {
      if (world[ny][nx] === 1) tieneAgua = true;
    }
  }
  
  if (!tieneAgua) return;
  
  // Reflejo distorsionado
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(sx - 2 + waveOffset, sy + TH/2 + 2, 4, 2);
}

// === INCREMENTAR FRAME ===
function incrementarFrame() {
  frameCount++;
}

// === dev/render.js ===
// ============================================================================
// RENDER - Con texturas y efectos
// ============================================================================

let ctx;
let lastDir = {x: 0, y: 1};

function iso(x, y) {
  return {x: (x - y) * TW / 2, y: (x + y) * TH / 2};
}

function getCamera() {
  const p = iso(pl.fx, pl.fy);
  return {x: W / 2 - p.x, y: H / 2 - p.y};
}

function screenToCell(sx, sy) {
  const cam = getCamera();
  const rx = sx - cam.x;
  const ry = sy - cam.y;
  return {
    x: Math.round((rx / (TW / 2) + ry / (TH / 2)) / 2),
    y: Math.round((ry / (TH / 2) - rx / (TW / 2)) / 2)
  };
}

function drawDiamond(sx, sy, w, h, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx + w / 2, sy + h / 2);
  ctx.lineTo(sx, sy + h);
  ctx.lineTo(sx - w / 2, sy + h / 2);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

function shadeColor(color, percent) {
  const num = parseInt(color.replace('#',''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.min(255, Math.max(0, (num >> 16) + amt));
  const G = Math.min(255, Math.max(0, (num >> 8 & 0x00FF) + amt));
  const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

function drawPlayer(px, py, bo) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px, py + TH/2, 8, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(px - 3, py + TH/2 - 8, 2, 9 + bo);
  ctx.fillRect(px + 1, py + TH/2 - 8, 2, 9 + bo);
  
  const bodyGrad = ctx.createLinearGradient(px - 6, py + TH/2 - 20, px + 6, py + TH/2 - 4);
  bodyGrad.addColorStop(0, '#1565c0');
  bodyGrad.addColorStop(0.5, '#1976d2');
  bodyGrad.addColorStop(1, '#0d47a1');
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(px - 7, py + TH/2 - 22, 14, 16);
  
  ctx.fillStyle = '#ffc107';
  ctx.fillRect(px - 7, py + TH/2 - 8, 14, 2);
  
  const headGrad = ctx.createRadialGradient(px - 1, py + TH/2 - 28, 1, px, py + TH/2 - 26, 6);
  headGrad.addColorStop(0, '#fff3e0');
  headGrad.addColorStop(1, '#ffe0b2');
  ctx.fillStyle = headGrad;
  ctx.fillRect(px - 4, py + TH/2 - 32, 8, 7);
  
  ctx.fillStyle = '#3e2723';
  ctx.fillRect(px - 5, py + TH/2 - 34, 10, 4);
  
  ctx.fillStyle = '#fff';
  ctx.fillRect(px - 2, py + TH/2 - 29, 2, 2);
  ctx.fillRect(px + 1, py + TH/2 - 29, 2, 2);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(px - 1, py + TH/2 - 28, 1, 1);
  ctx.fillRect(px + 2, py + TH/2 - 28, 1, 1);
}

function drawNPC(px, py, npc) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px, py + TH/2, 7, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(px - 3, py + TH/2 - 7, 2, 8);
  ctx.fillRect(px + 1, py + TH/2 - 7, 2, 8);
  
  const bodyGrad = ctx.createLinearGradient(px - 6, py + TH/2 - 18, px + 6, py + TH/2 - 2);
  bodyGrad.addColorStop(0, npc.color);
  bodyGrad.addColorStop(0.5, shadeColor(npc.color, 15));
  bodyGrad.addColorStop(1, shadeColor(npc.color, -25));
  ctx.fillStyle = bodyGrad;

      ctx.lineTo(px - 12, py - 8);
      ctx.lineTo(px + 12, py - 8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#388e3c';

      ctx.moveTo(px, py - 30);
      ctx.lineTo(px - 8, py - 10);
      ctx.lineTo(px + 8, py - 10);
      ctx.closePath();
      ctx.fill();

    case 'palmera':

      ctx.fillRect(px - 3, py - 14, 6, 18);
      ctx.fillStyle = '#4caf50';

function renderMundo() {
  const cam = getCamera();
  
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  
  const pgx = Math.floor(pl.gx);
  const pgy = Math.floor(pl.gy);
  
  if (pl.path.length > 0) {
    const t = pl.path[0];
    const dx = t.x - pl.fx;
    const dy = t.y - pl.fy;
    if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
      lastDir = {x: Math.sign(dx), y: Math.sign(dy)};
    }
  }
  
  // Tiles
  for (let y = Math.max(0, pgy - VISION_RADIO - 2); y < Math.min(WORLD_H, pgy + VISION_RADIO + 2); y++) {
    for (let x = Math.max(0, pgx - VISION_RADIO - 2); x < Math.min(WORLD_W, pgx + VISION_RADIO + 2); x++) {
      const s = iso(x, y);
      const sx = s.x + cam.x - TW/2;
      const sy = s.y + cam.y - TH/2;
      if (sx < -TW || sx > W + TW || sy < -TH || sy > H + TH) continue;
      
      const dx = x - pgx;
      const dy = y - pgy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > VISION_RADIO + 0.5) continue;
      
      const bioma = BIOMAS[getBioma(x, y)];
      const tile = world[y][x];
      const inPath = pl.path.find(p => p.x === x && p.y === y);
      
      let alpha = 1.0;
      if (dist > VISION_RADIO - 3) {
        alpha = Math.max(0, 1.0 - ((dist - (VISION_RADIO - 3)) / 3.5));
      }
      
      ctx.globalAlpha = alpha;
      
      if (tile === 1) {
        drawAguaAnimada(sx, sy, TW, TH, x, y);
      } else {
        drawTileConProfundidad(sx, sy, TW, TH, bioma.color1, bioma.color2, x, y);
      }
      
      if (inPath) {
        ctx.fillStyle = 'rgba(200,200,80,0.2)';
        drawDiamond(sx, sy, TW, TH, 'rgba(200,200,80,0.2)', null);
      }
      
      ctx.globalAlpha = 1.0;
    }
  }
  
  // Decoraciones
  for (let y = Math.max(0, pgy - VISION_RADIO); y < Math.min(WORLD_H, pgy + VISION_RADIO); y++) {
    for (let x = Math.max(0, pgx - VISION_RADIO); x < Math.min(WORLD_W, pgx + VISION_RADIO); x++) {
      const dx = x - pgx;
      const dy = y - pgy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > VISION_RADIO) continue;
      if (world[y][x] !== 0) continue;
      
      const biomaId = getBioma(x, y);
      const s = iso(x, y);
      const px = s.x + cam.x;
      const py = s.y + cam.y;
      
      const v = ((x * 374761393 + y * 668265263) ^ 0x5bf03635) >>> 0;
      const tipo = v % 100;
      
      if (tipo < 8) {
        let tipoArbol = 'roble';
        switch(biomaId) {
          case 1: tipoArbol = v % 3 === 0 ? 'pino' : (v % 3 === 1 ? 'roble' : 'abedul'); break;
          case 2: tipoArbol = 'palmera'; break;
          case 3: tipoArbol = 'pino'; break;
          case 4: tipoArbol = v % 3 === 0 ? 'muerto' : 'roble'; break;
          case 5: tipoArbol = 'muerto'; break;
          default: tipoArbol = v % 2 === 0 ? 'roble' : 'abedul'; break;
        }
        drawArbol(px, py, tipoArbol);
      } else if (tipo < 12) {
        drawRoca(px, py);
      } else if (tipo < 14 && biomaId === 0) {
        drawCasa(px, py);
        drawHumo(px + 8, py - 28);
      } else if (tipo < 15 && biomaId === 0) {
        drawFuente(px, py);
      } else if (tipo < 17) {
        let colorFlor = '#fff';
        switch(biomaId) {
          case 0: colorFlor = v % 2 === 0 ? '#fff' : '#ffeb3b'; break;
          case 1: colorFlor = v % 2 === 0 ? '#9c27b0' : '#fff'; break;
          case 2: colorFlor = '#ff9800'; break;
          default: colorFlor = '#fff'; break;
        }
        drawFlor(px, py, colorFlor);
      } else if (tipo < 19) {
        const colorHongo = v % 2 === 0 ? '#8d6e63' : (v % 3 === 0 ? '#4caf50' : '#2196f3');
        drawHongo(px, py, colorHongo);
      } else if (tipo < 22) {
        drawArbusto(px, py, v % 2 === 0 ? '#388e3c' : '#2e7d32');
      }
    }
  }
  
  // Niebla en pantano
  if (getBioma(pgx, pgy) === 4) {
    for (let y = Math.max(0, pgy - VISION_RADIO); y < Math.min(WORLD_H, pgy + VISION_RADIO); y++) {
      for (let x = Math.max(0, pgx - VISION_RADIO); x < Math.min(WORLD_W, pgx + VISION_RADIO); x++) {
        const s = iso(x, y);
        const px = s.x + cam.x;
        const py = s.y + cam.y;
        drawNiebla(px, py, TW, TH, 0.5);
      }
    }
  }
  
  // Cofres
  for (const co of cofres) {
    if (co.abierto) continue;
    const dx = co.x - pgx;
    const dy = co.y - pgy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > VISION_RADIO) continue;
    
    const s = iso(co.x, co.y);
    const px = s.x + cam.x;
    const py = s.y + cam.y;
    
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(px - 4, py - 2, 8, 5);
    ctx.fillStyle = '#b8860b';
    ctx.fillRect(px - 4, py - 2, 8, 2);
  }
  
  // NPCs
  for (const n of npcs) {
    const dx = n.x - pgx;
    const dy = n.y - pgy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > VISION_RADIO) continue;
    
    const s = iso(n.x, n.y);
    const px = s.x + cam.x;
    const py = s.y + cam.y;
    
    drawNPC(px, py, n);
    ctx.fillStyle = '#fff';
    ctx.font = '6px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(n.nombre, px, py - 12);
  }
  
  // Jugador
  const ps = iso(pl.fx, pl.fy);
  const px = ps.x + cam.x;
  const py = ps.y + cam.y;
  
  drawPlayer(px, py, pl.frame === 0 ? 0 : 1);
}

// ============================================================================
// JUGADOR - Más lento, pathfinding
// ============================================================================

const pl = {
  gx: 8, gy: 8,
  fx: 8.0, fy: 8.0,
  path: [],
  frame: 0, ft: 0,
  hp: 100, mhp: 100,
  sed: 100, maxSed: 100,
  temp: 100, maxTemp: 100,
  nivel: 1, xp: 0,
  oro: 50,
  biomaActual: 0
};

function aplicarDificultad(dt) {
  const bioma = BIOMAS[pl.biomaActual];
  if (!bioma.dificultad) return;
  switch(bioma.dificultad) {
    case 'sed':
      pl.sed = Math.max(0, pl.sed - dt * 2);
      if (pl.sed === 0) pl.hp = Math.max(0, pl.hp - dt * 1);
      break;
    case 'frio':
      pl.temp = Math.max(0, pl.temp - dt * 2);
      if (pl.temp === 0) pl.hp = Math.max(0, pl.hp - dt * 1.5);
      break;
    case 'calor':
      pl.sed = Math.max(0, pl.sed - dt * 3);
      if (pl.sed === 0) pl.hp = Math.max(0, pl.hp - dt * 2);
      break;
    case 'veneno':
      if (Math.random() < 0.005) pl.hp = Math.max(0, pl.hp - dt * 3);
      break;
  }
}

function findPath(sx, sy, gx, gy) {
  if (!esCaminable(gx, gy)) return [];
  const open = [{x: sx, y: sy, p: []}];
  const vis = new Set();
  vis.add(sx + ',' + sy);
  while (open.length) {
    const c = open.shift();
    if (c.x === gx && c.y === gy) return c.p;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = c.x + dx, ny = c.y + dy, k = nx + ',' + ny;
      if (vis.has(k) || !esCaminable(nx, ny)) continue;
      vis.add(k);
      open.push({x: nx, y: ny, p: [...c.p, {x: nx, y: ny}]});
    }
  }
  return [];
}

function moverJugador(dt) {
  if (pl.path.length === 0) return;
  const t = pl.path[0];
  const speed = 2.5 * dt; // Más lento
  const dx = t.x - pl.fx;
  const dy = t.y - pl.fy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < speed || dist < 0.005) {
    pl.fx = t.x; pl.fy = t.y; pl.gx = t.x; pl.gy = t.y;
    pl.path.shift();
    if (!pl.path.length) guardar();
  } else {
    pl.fx += (dx/dist) * speed;
    pl.fy += (dy/dist) * speed;
  }
  pl.ft += dt;
  if (pl.ft > 0.15) { pl.ft = 0; pl.frame = (pl.frame + 1) % 2; }
}

// UI - HUD, Minimapa AJUSTADO (más grande, esquina inferior derecha), Mensajes

let mensaje = {titulo: '', texto: '', t: 0};

function mostrarMensaje(titulo, texto) {
  mensaje = {titulo, texto, t: 3};
}

function renderUI() {
  // Fondo UI
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(10, 10, 160, 70);
  
  // Nombre y nivel
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('Lv.' + pl.nivel + ' Hero', 18, 26);
  
  // Barra HP
  ctx.fillStyle = '#4a0000';
  ctx.fillRect(18, 34, 140, 8);
  ctx.fillStyle = '#e44';
  ctx.fillRect(19, 35, 138 * pl.hp / pl.mhp, 6);
  ctx.fillStyle = '#fff';
  ctx.font = '8px monospace';
  ctx.fillText(Math.floor(pl.hp) + '/' + pl.mhp, 75, 40);
  
  // Barra dificultad
  const bioma = BIOMAS[pl.biomaActual];
  if (bioma.dificultad === 'sed' || bioma.dificultad === 'calor') {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(18, 50, 140, 6);
    ctx.fillStyle = bioma.dificultad === 'sed' ? '#0288d1' : '#e65100';
    ctx.fillRect(18, 50, 140 * pl.sed / pl.maxSed, 6);
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.fillText('SED', 78, 55);
  } else if (bioma.dificultad === 'frio') {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(18, 50, 140, 6);
    ctx.fillStyle = '#0277bd';
    ctx.fillRect(18, 50, 140 * pl.temp / pl.maxTemp, 6);
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.fillText('TEMP', 76, 55);
  } else if (bioma.dificultad === 'veneno') {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(18, 50, 140, 6);
    ctx.fillStyle = '#7cb342';
    ctx.fillRect(18, 50, 140, 6);
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.fillText('TOXICO', 73, 55);
  }
  
  // Info inferior
  ctx.fillStyle = '#ffd700';
  ctx.font = '11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('Oro: ' + pl.oro, 18, H - 60);
  ctx.fillStyle = '#0f0';
  ctx.fillText('Bioma: ' + bioma.nombre, 18, H - 45);
  ctx.fillText('Pos: ' + Math.floor(pl.gx) + ',' + Math.floor(pl.gy), 18, H - 30);
  
  // === MINIMAPA MÁS GRANDE ===
  const mmW = 140, mmH = 140;
  const mmX = W - mmW - 15, mmY = H - mmH - 15;
  const mmCX = mmX + mmW / 2;
  const mmCY = mmY + mmH / 2;
  
  // Fondo
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(mmX, mmY, mmW, mmH);
  
  // Biomas en minimapa
  for (let y = 0; y < WORLD_H; y += 1) {
    for (let x = 0; x < WORLD_W; x += 1) {
      const mx = mmX + (x / WORLD_W) * mmW;
      const my = mmY + (y / WORLD_H) * mmH;
      
      const dx = mx - mmCX;
      const dy = my - mmCY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > mmW / 2 - 2) continue;
      
      const b = BIOMAS[getBioma(x, y)];
      ctx.fillStyle = b.color1;
      ctx.fillRect(mx - 1, my - 1, 3, 3);
    }
  }
  
  // NPCs en minimapa
  ctx.fillStyle = '#0ff';
  for (const n of npcs) {
    const nmx = mmX + (n.x / WORLD_W) * mmW;
    const nmy = mmY + (n.y / WORLD_H) * mmH;
    const ndx = nmx - mmCX;
    const ndy = nmy - mmCY;
    const ndist = Math.sqrt(ndx*ndx + ndy*ndy);
    if (ndist <= mmW / 2 - 2) {
      ctx.fillRect(nmx - 1, nmy - 1, 3, 3);
    }
  }
  
  // Fog of War circular
  const fogRadius = mmW / 2 - 2;
  const fogInner = fogRadius - 8;
  
  const gradient = ctx.createRadialGradient(mmCX, mmCY, fogInner, mmCX, mmCY, fogRadius + 4);
  gradient.addColorStop(0, 'rgba(0,0,0,0)');
  gradient.addColorStop(0.6, 'rgba(0,0,0,0.4)');
  gradient.addColorStop(1, 'rgba(0,0,0,0.95)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(mmCX, mmCY, fogRadius + 4, 0, Math.PI * 2);
  ctx.fill();
  
  // Jugador en minimapa
  ctx.fillStyle = '#ff0';
  ctx.fillRect(mmCX - 4, mmCY - 4, 8, 8);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(mmCX - 2, mmCY - 2, 4, 4);
  
  // Borde del minimapa
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.strokeRect(mmX, mmY, mmW, mmH);
  
  // Leyenda
  ctx.fillStyle = '#fff';
  ctx.font = '9px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('Mapa', mmX + 3, mmY - 6);
  
  // Mensaje flotante
  if (mensaje.t > 0) {
    const alpha = Math.min(1, mensaje.t);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(W/2 - 100, H/2 - 40, 200, 80);
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.strokeRect(W/2 - 100, H/2 - 40, 200, 80);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(mensaje.titulo, W/2, H/2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.fillText(mensaje.texto, W/2, H/2 + 15);
    ctx.globalAlpha = 1;
  }
}

// ============================================================================
// GUARDADO - LocalStorage
// ============================================================================

function guardar() {
  localStorage.setItem('pachamirai_save', JSON.stringify({
    gx: pl.gx, gy: pl.gy, fx: pl.fx, fy: pl.fy,
    hp: pl.hp, oro: pl.oro, sed: pl.sed, temp: pl.temp,
    nivel: pl.nivel, xp: pl.xp,
    cofres: cofres.map(c => ({x: c.x, y: c.y, abierto: c.abierto}))
  }));
}

function cargar() {
  const data = localStorage.getItem('pachamirai_save');
  if (!data) return;
  try {
    const s = JSON.parse(data);
    pl.gx = s.gx; pl.gy = s.gy; pl.fx = s.fx; pl.fy = s.fy;
    pl.hp = s.hp; pl.oro = s.oro; pl.sed = s.sed || 100; pl.temp = s.temp || 100;
    pl.nivel = s.nivel || 1; pl.xp = s.xp || 0;
    if (s.cofres) {
      for (const sc of s.cofres) {
        for (const co of cofres) {
          if (co.x === sc.x && co.y === sc.y) co.abierto = sc.abierto;
        }
      }
    }
  } catch(e) {}
}

// === dev/main.js ===
// ============================================================================
// MAIN - Game Loop, Input con tap preciso, Bootstrap
// ============================================================================

const c = document.getElementById('c');

function main() {
  calcularTileSize();
  window.addEventListener('resize', resize);
  
  ctx = c.getContext('2d');
  generarMundo();
  generarNPCs();
  generarCofres();
  
  window.addEventListener('beforeunload', guardar);
  cargar();
  
  // Input con tap preciso
  c.addEventListener('touchstart', e => {
    e.preventDefault();
    if (pl.path.length > 0) return;
    
    const t = e.changedTouches[0];
    const cell = screenToCell(t.clientX, t.clientY);
    
    // Verificar límites
    if (cell.x < 0 || cell.x >= WORLD_W || cell.y < 0 || cell.y >= WORLD_H) return;
    
    // Verificar NPC primero
    for (const n of npcs) {
      if (n.x === cell.x && n.y === cell.y) {
        mostrarMensaje('NPC: ' + n.nombre, 'Hola, viajero.');
        return;
      }
    }
    
    // Verificar cofre
    for (const co of cofres) {
      if (co.x === cell.x && co.y === cell.y && !co.abierto) {
        co.abierto = true;
        pl.oro += 10;
        mostrarMensaje('Cofre abierto', '+10 oro');
        guardar();
        return;
      }
    }
    
    // Verificar que la celda sea caminable
    if (world[cell.y][cell.x] !== 0) return;
    for (const n of npcs) {
      if (n.x === cell.x && n.y === cell.y) return;
    }
    for (const co of cofres) {
      if (co.x === cell.x && co.y === cell.y && !co.abierto) return;
    }
    
    // Guardar destino exacto del tap
    pl.tapTargetX = cell.x;
    pl.tapTargetY = cell.y;
    
    // Calcular camino
    pl.path = findPath(pl.gx, pl.gy, cell.x, cell.y);
  }, {passive: false});
  
  let last = performance.now();
  
  function loop(ts) {
    const dt = Math.min((ts - last) / 1000, 0.1);
    last = ts;
    
    if (mensaje.t > 0) mensaje.t -= dt;
    
    incrementarFrame();
    
    pl.biomaActual = getBioma(Math.floor(pl.gx), Math.floor(pl.gy));
    aplicarDificultad(dt);
    moverJugador(dt);
    
    renderMundo();
    renderUI();
    
    requestAnimationFrame(loop);
  }
  
  requestAnimationFrame(loop);
}

main();

</script>
