<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:monospace}canvas{display:block;position:fixed;top:0;left:0;image-rendering:pixelated}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.95);color:#ffd700;padding:24px 36px;border:2px solid #ffd700;border-radius:12px;font-size:14px;display:none;text-align:center;z-index:10;max-width:280px;box-shadow:0 4px 20px rgba(255,215,0,.3)"></div>
<script>
try{
const c=document.getElementById('c');
const ctx=c.getContext('2d');
const msgEl=document.getElementById('msg');
let msgTimeout=0;

// Resolución interna con tiles 64x64
const VW=960,VH=540;
const TW=64,TH=32;
let scale=1,offsetX=0,offsetY=0;

function resize(){
  c.width=window.innerWidth;
  c.height=window.innerHeight;
  scale=Math.min(c.width/VW,c.height/VH);
  offsetX=(c.width-VW*scale)/2;
  offsetY=(c.height-VH*scale)/2;
}
resize();
window.addEventListener('resize',resize);

const WORLD_W=64,WORLD_H=64,VR=10;

const PAL={
  pueblo:['#3a6b28','#4a8a32','#5a9f3c','#2d5a1e','#6ba54a'],
  bosque:['#1e4d15','#2d5a1e','#3a6b28','#143d0e','#4a8a32'],
  desierto:['#e67e22','#d35400','#f39c12','#ca6f1e','#e74c3c'],
  montana:['#7f8c8d','#566573','#95a5a6','#4d5656','#aab7b8'],
  pantano:['#3e2723','#2c1810','#4e342e','#1a0f0a','#5d4037'],
  volcan:['#922b21','#7b241c','#c0392b','#641e16','#d35400'],
  castillo:['#2c3e50','#1a252f','#34495e','#152238','#4a6978'],
  agua:['#1a5276','#154360','#0e3a54','#2471a3'],
  mar:['#2471a3','#1a5276','#154360','#2980b9'],
  nieve:['#ecf0f1','#d5dbdb','#bdc3c7','#f5f5f5'],
  madera:['#5d4037','#4e342e','#3e2723','#6d4c41'],
  hojas:['#27ae60','#2ecc71','#1e8449','#229954','#58d68d'],
  techo:['#c0392b','#2980b9','#f39c12','#27ae60','#8e44ad'],
  piedra:['#757575','#616161','#424242','#9e9e9e'],
  flor:['#e74c3c','#f1c40f','#ecf0f1','#e91e63','#e67e22','#9c27b0'],
  piel:['#f5cba7','#e5b897','#d4a574'],
  oro:['#ffd700','#f39c12','#ffeb3b','#b8860b']
};

function getBioma(x,y){
  const m=[[0,1,1,2,2,5,5,5],[1,1,2,2,3,5,5,6],[1,2,2,3,3,5,6,6],[2,2,3,3,4,5,6,6],[2,3,3,4,4,6,6,6],[3,3,4,4,4,6,6,6],[3,4,4,4,6,6,6,6],[4,4,4,6,6,6,6]];
  return m[Math.min(7,Math.floor(y/8))][Math.min(7,Math.floor(x/8))];
}

function getBiomaObj(id){
  const b=[
    {id:0,p:PAL.pueblo,wp:PAL.agua},
    {id:1,p:PAL.bosque,wp:PAL.agua},
    {id:2,p:PAL.desierto,wp:PAL.mar},
    {id:3,p:PAL.montana,wp:PAL.agua},
    {id:4,p:PAL.pantano,wp:PAL.agua},
    {id:5,p:PAL.volcan,wp:PAL.volcan},
    {id:6,p:PAL.castillo,wp:PAL.agua}
  ];
  return b[id]||b[0];
}

const world=[];
for(let y=0;y<WORLD_H;y++){
  world[y]=[];
  for(let x=0;x<WORLD_W;x++){
    if(x<1||x>=WORLD_W-1||y<1||y>=WORLD_H-1)world[y][x]=1;
    else{const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;world[y][x]=(v%20<1)?1:0;}
  }
}
world[8][8]=0;

const npcs=[
  {x:6,y:6,n:'Herrero',c:'#c0392b',d:'Forja armas y armaduras.\n"Acero y fuego, amigo."'},
  {x:9,y:7,n:'Mago',c:'#8e44ad',d:'Conocimiento arcano.\n"La magia fluye en ti."'},
  {x:7,y:9,n:'Comerciante',c:'#f39c12',d:'Compra y venta.\n"Tengo las mejores ofertas!"'}
];
const cofres=[
  {x:10,y:10,o:false,l:'Espada de Hierro'},
  {x:25,y:18,o:false,l:'Poción de Vida'},
  {x:40,y:22,o:false,l:'50 Monedas'}
];

const pl={gx:8,gy:8,fx:8,fy:8,path:[],frame:0,ft:0,hp:100,mhp:100,oro:50};
let frameCount=0;
const particles=[];

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}
function getCam(){const p=iso(pl.fx,pl.fy);return{x:VW/2-p.x,y:VH/2-p.y};}

function s2c(sx,sy){
  const cam=getCam();
  return{
    x:Math.round(((sx-cam.x)/TW*2+(sy-cam.y)/TH*2)/2),
    y:Math.round(((sy-cam.y)/TH*2-(sx-cam.x)/TW*2)/2)
  };
}

function showMsg(title,text){
  msgEl.innerHTML='<b style="font-size:16px">'+(title||'')+'</b><br><br>'+(text||'').replace(/\n/g,'<br>');
  msgEl.style.display='block';
  msgTimeout=3;
}

function addParticle(x,y,color){
  particles.push({x,y,vx:(Math.random()-0.5)*0.5,vy:-Math.random()*0.5,life:1,color});
}

function drawTile(sx,sy,bio,x,y){
  const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
  const pal=bio.p;
  const ps=4;
  
  for(let py=0;py<TH;py+=ps){
    for(let px=0;px<TW;px+=ps){
      const rx=sx-ps+px;
      const ry=sy+py;
      const dx=px-TW/2;
      const dy=py-TH/2;
      if(Math.abs(dx)/(TW/2)+Math.abs(dy)/(TH/2)<=1){
        const idx=((px+py+v)%pal.length);
        ctx.fillStyle=pal[idx];
        ctx.fillRect(Math.floor(rx),Math.floor(ry),ps,ps);
      }
    }
  }
  
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(sx+TW/2,sy+TH/2);
  ctx.lineTo(sx,sy+TH);
  ctx.lineTo(sx-TW/2,sy+TH/2);
  ctx.closePath();
  ctx.strokeStyle='rgba(0,0,0,0.15)';
  ctx.lineWidth=1;
  ctx.stroke();
}

function drawWater(sx,sy,bio,x,y){
  const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
  const pal=bio.wp;
  const ps=4;
  
  for(let py=0;py<TH;py+=ps){
    for(let px=0;px<TW;px+=ps){
      const rx=sx-ps+px;
      const ry=sy+py;
      const dx=px-TW/2;
      const dy=py-TH/2;
      if(Math.abs(dx)/(TW/2)+Math.abs(dy)/(TH/2)<=1){
        const idx=(px+py+v)%pal.length;
        ctx.fillStyle=pal[idx];
        ctx.fillRect(Math.floor(rx),Math.floor(ry),ps,ps);
      }
    }
  }
  
  ctx.fillStyle='rgba(255,255,255,0.3)';
  const wave=Math.sin((frameCount*0.06)+(x+y)*0.4)*2;
  ctx.fillRect(Math.floor(sx-6+wave),Math.floor(sy+TH/4),4,2);
  ctx.fillRect(Math.floor(sx+3+wave*0.7),Math.floor(sy+TH/2),3,2);
  
  if(bio.id===2&&v%6<2){
    const px=sx-6+((frameCount*0.3+v)%12);
    ctx.fillStyle='#e67e22';ctx.fillRect(Math.floor(px),Math.floor(sy+TH/3),4,3);
    ctx.fillStyle='#f39c12';ctx.fillRect(Math.floor(px-2),Math.floor(sy+TH/3),2,3);
  }
  
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(sx+TW/2,sy+TH/2);
  ctx.lineTo(sx,sy+TH);
  ctx.lineTo(sx-TW/2,sy+TH/2);
  ctx.closePath();
  ctx.strokeStyle='rgba(100,180,220,0.2)';
  ctx.lineWidth=1;
  ctx.stroke();
}

function drawTree(sx,sy,tipo,v,bio){
  const h=bio.id===3?TH*1.8:TH*1.4;
  
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(sx+4,sy+TH/2,10,4,0.3,0,Math.PI*2);
  ctx.fill();
  
  if(tipo==='pino'){
    ctx.fillStyle=PAL.madera[0];ctx.fillRect(sx-2,sy-h*0.5,4,h*0.5);
    ctx.fillStyle=PAL.madera[1];ctx.fillRect(sx-2,sy-h*0.5,2,h*0.5);
    ctx.fillStyle=PAL.hojas[2];
    ctx.beginPath();ctx.moveTo(sx,sy-h);ctx.lineTo(sx-10,sy-h*0.4);ctx.lineTo(sx+10,sy-h*0.4);ctx.closePath();ctx.fill();
    ctx.fillStyle=PAL.hojas[0];
    ctx.beginPath();ctx.moveTo(sx,sy-h*0.85);ctx.lineTo(sx-7,sy-h*0.45);ctx.lineTo(sx+7,sy-h*0.45);ctx.closePath();ctx.fill();
    ctx.fillStyle=PAL.hojas[4];ctx.fillRect(sx-3,sy-h*0.6,2,2);ctx.fillRect(sx+2,sy-h*0.5,2,2);
    if(bio.id===3){
      ctx.fillStyle=PAL.nieve[0];ctx.fillRect(sx-2,sy-h*0.9,4,2);
    }
  }else if(tipo==='palmera'){
    ctx.fillStyle=PAL.madera[0];ctx.fillRect(sx-3,sy-h*0.6,6,h*0.6);
    ctx.fillStyle=PAL.madera[1];ctx.fillRect(sx-3,sy-h*0.6,3,h*0.6);
    ctx.fillStyle=PAL.hojas[0];ctx.fillRect(sx-14,sy-h*0.7,8,2);ctx.fillRect(sx+6,sy-h*0.7,8,2);ctx.fillRect(sx-4,sy-h*0.8,8,2);
  }else if(tipo==='muerto'){
    ctx.fillStyle=PAL.madera[2];ctx.fillRect(sx-1,sy-h*0.7,3,h*0.7);
    ctx.strokeStyle=PAL.madera[3];ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sx,sy-h*0.7);ctx.lineTo(sx-8,sy-h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx,sy-h*0.5);ctx.lineTo(sx+6,sy-h*0.8);ctx.stroke();
  }else{
    ctx.fillStyle=PAL.madera[0];ctx.fillRect(sx-3,sy-h*0.4,6,h*0.4);
    ctx.fillStyle=PAL.madera[1];ctx.fillRect(sx-3,sy-h*0.4,3,h*0.4);
    ctx.fillStyle=PAL.hojas[0];ctx.beginPath();ctx.arc(sx,sy-h*0.55,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=PAL.hojas[4];ctx.fillRect(sx-5,sy-h*0.7,3,3);ctx.fillRect(sx+3,sy-h*0.6,3,3);
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.arc(sx-3,sy-h*0.75,3,0,Math.PI*2);ctx.fill();
  }
}

function drawRock(sx,sy,bio){
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();ctx.ellipse(sx+3,sy+TH/2,8,3,0.2,0,Math.PI*2);ctx.fill();
  
  ctx.fillStyle=PAL.piedra[0];
  ctx.beginPath();ctx.moveTo(sx-8,sy+TH/2);ctx.lineTo(sx-5,sy-8);ctx.lineTo(sx+3,sy-12);ctx.lineTo(sx+8,sy-6);ctx.lineTo(sx+8,sy+TH/2);ctx.closePath();ctx.fill();
  ctx.fillStyle=PAL.piedra[1];
  ctx.beginPath();ctx.moveTo(sx+3,sy-12);ctx.lineTo(sx+8,sy-6);ctx.lineTo(sx+8,sy+TH/2);ctx.lineTo(sx+3,sy+TH/2);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath();ctx.moveTo(sx-5,sy-8);ctx.lineTo(sx+3,sy-12);ctx.lineTo(sx-1,sy-6);ctx.closePath();ctx.fill();
}

function drawHouse(sx,sy,v){
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();ctx.ellipse(sx+6,sy+TH/2,14,5,0.3,0,Math.PI*2);ctx.fill();
  
  ctx.fillStyle=['#e8d8b0','#d4c49a','#c8b888'][v%3];
  ctx.fillRect(sx-10,sy-14,20,16);
  
  ctx.fillStyle=PAL.techo[v%5];
  ctx.beginPath();ctx.moveTo(sx,sy-28);ctx.lineTo(sx-14,sy-16);ctx.lineTo(sx+14,sy-16);ctx.closePath();ctx.fill();
  
  ctx.fillStyle=PAL.madera[0];ctx.fillRect(sx-3,sy-6,6,8);
  ctx.fillStyle=PAL.oro[0];ctx.fillRect(sx+1,sy-3,1,1);
  
  ctx.fillStyle='#3498db';ctx.fillRect(sx-8,sy-10,4,4);ctx.fillRect(sx+4,sy-10,4,4);
  
  if(frameCount%30<15){
    ctx.fillStyle='rgba(200,200,200,0.4)';
    ctx.beginPath();ctx.arc(sx+8,sy-32,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(200,200,200,0.3)';
    ctx.beginPath();ctx.arc(sx+9,sy-36,2,0,Math.PI*2);ctx.fill();
  }
}

function drawFlower(sx,sy,color,v){
  ctx.fillStyle=PAL.hojas[0];ctx.fillRect(sx-1,sy+TH/2-4,2,4);
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(sx,sy+TH/2-6,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.oro[0];ctx.fillRect(sx,sy+TH/2-6,1,1);
}

function loop(){
  frameCount++;
  const dt=1/60;
  
  ctx.fillStyle='#0d1b0d';
  ctx.fillRect(0,0,c.width,c.height);
  
  ctx.save();
  ctx.translate(offsetX,offsetY);
  ctx.scale(scale,scale);
  
  ctx.fillStyle='#0d1b0d';
  ctx.fillRect(0,0,VW,VH);
  
  if(pl.path.length>0){
    const t=pl.path[0];
    const dx=t.x-pl.fx,dy=t.y-pl.fy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<0.05){
      pl.fx=t.x;pl.fy=t.y;pl.gx=t.x;pl.gy=t.y;pl.path.shift();
    }else{
      pl.fx+=dx/dist*0.04;pl.fy+=dy/dist*0.04;
    }
    pl.ft+=dt;
    if(pl.ft>0.1){pl.ft=0;pl.frame=(pl.frame+1)%4;}
  }
  
  if(pl.path.length>0&&frameCount%3===0){
    const cam=getCam();
    const px=(pl.fx-pl.fy)*TW/2+cam.x;
    const py=(pl.fx+pl.fy)*TH/2+cam.y;
    addParticle(px+Math.random()*4-2,py+TH/2,'rgba(150,120,80,0.4)');
  }
  
  const cam=getCam();
  const pgx=Math.floor(pl.gx),pgy=Math.floor(pl.gy);
  
  for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR+2);y++){
    for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR+2);x++){
      const sx=(x-y)*TW/2+cam.x-TW/2;
      const sy=(x+y)*TH/2+cam.y-TH/2;
      
      const dist=Math.sqrt((x-pgx)*(x-pgx)+(y-pgy)*(y-pgy));
      if(dist>VR+0.5)continue;
      
      const biomaId=getBioma(x,y);
      const bio=getBiomaObj(biomaId);
      
      if(world[y][x]===1){
        drawWater(sx,sy,bio,x,y);
      }else{
        drawTile(sx,sy,bio,x,y);
      }
      
      if(pl.path.find(p=>p.x===x&&p.y===y)){
        ctx.fillStyle='rgba(255,255,100,0.2)';
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();ctx.fill();
      }
    }
  }
  
  for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR);y++){
    for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR);x++){
      const dist=Math.sqrt((x-pgx)*(x-pgx)+(y-pgy)*(y-pgy));
      if(dist>VR)continue;
      if(world[y][x]!==0)continue;
      
      const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
      const sx=(x-y)*TW/2+cam.x;
      const sy=(x+y)*TH/2+cam.y;
      const biomaId=getBioma(x,y);
      const bio=getBiomaObj(biomaId);
      const tipo=v%100;
      
      if(tipo<10){
        const treeType=biomaId===1&&v%3===0?'pino':biomaId===2?'palmera':biomaId===4&&v%2===0?'muerto':'roble';
        drawTree(sx,sy,treeType,v,bio);
      }else if(tipo<13){
        drawRock(sx,sy,bio);
      }else if(tipo<15&&biomaId===0){
        drawHouse(sx,sy,v);
      }else if(tipo<17){
        drawFlower(sx,sy,PAL.flor[v%PAL.flor.length],v);
      }else if(tipo<19&&biomaId===4){
        ctx.fillStyle='rgba(80,100,60,0.4)';
        ctx.beginPath();ctx.ellipse(sx,sy+TH/2,6,2,0,0,Math.PI*2);ctx.fill();
      }else if(tipo<21&&biomaId===5){
        ctx.fillStyle='rgba(0,0,0,0.3)';
        ctx.beginPath();ctx.ellipse(sx+2,sy+TH/2,6,2,0.2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#1c1c1c';
        ctx.beginPath();ctx.moveTo(sx-5,sy+TH/2);ctx.lineTo(sx-3,sy-5);ctx.lineTo(sx+2,sy-8);ctx.lineTo(sx+5,sy-4);ctx.lineTo(sx+5,sy+TH/2);ctx.closePath();ctx.fill();
        ctx.fillStyle='#e67e22';ctx.fillRect(sx,sy-4,1,3);
      }else if(tipo<23&&biomaId===3){
        ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect(sx-6,sy+TH/2,12,2);
      }
    }
  }
  
  if(getBioma(pgx,pgy)===4){
    for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR);y++){
      for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR);x++){
        const sx=(x-y)*TW/2+cam.x;
        const sy=(x+y)*TH/2+cam.y;
        const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
        const alpha=0.06+(v%3)*0.02;
        ctx.fillStyle=`rgba(180,200,180,${alpha})`;
        const offset=Math.sin((frameCount*0.02)+(x+y)*0.3)*2;
        ctx.fillRect(sx-10,sy+TH/2+offset+2,20,4);
      }
    }
  }
  
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=0.02;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,2,2);ctx.globalAlpha=1;
  }
  
  for(const co of cofres){
    if(co.o)continue;
    const dist=Math.sqrt((co.x-pgx)*(co.x-pgx)+(co.y-pgy)*(co.y-pgy));
    if(dist>VR)continue;
    const sx=(co.x-co.y)*TW/2+cam.x;
    const sy=(co.x+co.y)*TH/2+cam.y;
    
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(sx,sy+TH/2,5,2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd700';ctx.fillRect(sx-4,sy-2,8,5);
    ctx.fillStyle='#b8860b';ctx.fillRect(sx-4,sy-2,8,2);
    ctx.fillStyle='#ffeb3b';ctx.fillRect(sx-1,sy-1,2,1);
  }
  
  for(const n of npcs){
    const dist=Math.sqrt((n.x-pgx)*(n.x-pgx)+(n.y-pgy)*(n.y-pgy));
    if(dist>VR)continue;
    const sx=(n.x-n.y)*TW/2+cam.x;
    const sy=(n.x+n.y)*TH/2+cam.y;
    
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(sx,sy+TH/2,6,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=n.c;ctx.fillRect(sx-5,sy+TH/2-14,10,10);
    ctx.fillStyle=PAL.piel[0];ctx.fillRect(sx-3,sy+TH/2-19,6,5);
    ctx.fillStyle=PAL.madera[0];ctx.fillRect(sx-4,sy+TH/2-21,8,3);
    ctx.fillStyle='#fff';ctx.fillRect(sx-2,sy+TH/2-17,2,1);ctx.fillRect(sx+1,sy+TH/2-17,2,1);
    ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(sx,sy+TH/2-26,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='6px monospace';ctx.textAlign='center';ctx.fillText(n.n,sx,sy-8);
  }
  
  const px=(pl.fx-pl.fy)*TW/2+cam.x;
  const py=(pl.fx+pl.fy)*TH/2+cam.y;
  const bo=pl.path.length>0?(pl.frame%2):0;
  
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(px,py+TH/2,7,3,0,0,Math.PI*2);ctx.fill();
  
  ctx.fillStyle=PAL.madera[0];
  if(pl.path.length>0){
    if(pl.frame===0||pl.frame===2){ctx.fillRect(px-3,py+TH/2-8,2,8);ctx.fillRect(px+1,py+TH/2-8,2,8);}
    else if(pl.frame===1){ctx.fillRect(px-3,py+TH/2-9,2,9);ctx.fillRect(px+1,py+TH/2-7,2,7);}
    else{ctx.fillRect(px-3,py+TH/2-7,2,7);ctx.fillRect(px+1,py+TH/2-9,2,9);}
  }else{ctx.fillRect(px-3,py+TH/2-8,2,8);ctx.fillRect(px+1,py+TH/2-8,2,8);}
  
  ctx.fillStyle='#1976d2';ctx.fillRect(px-7,py+TH/2-20,14,14);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-7,py+TH/2-8,14,2);
  ctx.fillStyle=PAL.piel[0];ctx.fillRect(px-4,py+TH/2-26,8,6);
  ctx.fillStyle=PAL.madera[0];ctx.fillRect(px-5,py+TH/2-28,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(px-2,py+TH/2-24,2,2);ctx.fillRect(px+1,py+TH/2-24,2,2);
  ctx.fillStyle='#1a1a1a';ctx.fillRect(px-1,py+TH/2-23,1,1);ctx.fillRect(px+2,py+TH/2-23,1,1);
  
  ctx.fillStyle='rgba(0,0,0,0.85)';ctx.beginPath();ctx.roundRect(10,10,150,55,6);ctx.fill();
  ctx.strokeStyle='#ffd700';ctx.lineWidth=1;ctx.stroke();
  
  ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('Lv.1 Hero',18,26);
  
  ctx.fillStyle='#4a0000';ctx.beginPath();ctx.roundRect(18,34,134,8,3);ctx.fill();
  ctx.fillStyle='#e44';ctx.beginPath();ctx.roundRect(19,35,132,6,2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.fillText('100/100',75,39);
  
  ctx.fillStyle='#ffd700';ctx.font='10px monospace';ctx.fillText('Oro: '+pl.oro,18,50);
  
  ctx.fillStyle='#0f0';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText('Pos:'+Math.floor(pl.gx)+','+Math.floor(pl.gy),10,VH-15);
  
  const mmW=100,mmH=100,mmX=VW-mmW-10,mmY=VH-mmH-10;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(mmX,mmY,mmW,mmH);
  for(let y=0;y<WORLD_H;y+=2){
    for(let x=0;x<WORLD_W;x+=2){
      const biomaId=getBioma(x,y);
      const b=getBiomaObj(biomaId);
      ctx.fillStyle=world[y][x]===1?b.wp[0]:b.p[0];
      ctx.fillRect(mmX+(x/WORLD_W)*mmW,mmY+(y/WORLD_H)*mmH,2,2);
    }
  }
  ctx.fillStyle='#ff0';ctx.fillRect(mmX+(pl.gx/WORLD_W)*mmW-2,mmY+(pl.gy/WORLD_H)*mmH-2,4,4);
  ctx.strokeStyle='#ffd700';ctx.lineWidth=1;ctx.strokeRect(mmX,mmY,mmW,mmH);
  
  ctx.restore();
  requestAnimationFrame(loop);
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(pl.path.length>0)return;
  
  const cam=getCam();
  const t=e.changedTouches[0];
  const rx=(t.clientX-offsetX)/scale-cam.x;
  const ry=(t.clientY-offsetY)/scale-cam.y;
  const gx=Math.floor((rx/TW*2+ry/TH*2)/2);
  const gy=Math.floor((ry/TH*2-rx/TW*2)/2);
  
  if(gx<0||gx>=WORLD_W||gy<0||gy>=WORLD_H)return;
  
  for(const n of npcs){
    if(n.x===gx&&n.y===gy){showMsg(n.n,n.d);return;}
  }
  
  for(const co of cofres){
    if(co.x===gx&&co.y===gy&&!co.o){
      co.o=true;pl.oro+=10;
      showMsg('Cofre abierto','Encontraste: '+co.l+'\n+10 oro');
      return;
    }
  }
  
  if(world[gy][gx]!==0)return;
  
  const open=[{x:pl.gx,y:pl.gy,p:[]}];
  const vis=new Set();vis.add(pl.gx+','+pl.gy);
  while(open.length){
    const c=open.shift();
    if(c.x===gx&&c.y===gy){pl.path=c.p;break;}
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=c.x+dx,ny=c.y+dy,k=nx+','+ny;
      if(vis.has(k)||nx<0||nx>=WORLD_W||ny<0||ny>=WORLD_H||world[ny][nx]!==0)continue;
      vis.add(k);
      open.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]});
    }
  }
},{passive:false});

loop();
}catch(e){
  document.body.innerHTML='<h1 style="color:red;padding:20px">ERROR: '+e.message+'<br><br>'+e.stack+'</h1>';
}
</script>
</body>
</html>
