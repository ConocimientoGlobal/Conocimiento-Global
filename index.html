<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:monospace}canvas{display:block;position:fixed;top:0;left:0}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.95);color:#ffd700;padding:24px 36px;border:2px solid #ffd700;border-radius:12px;font-size:14px;display:none;text-align:center;z-index:10;max-width:280px;box-shadow:0 4px 20px rgba(255,215,0,.3)"></div>
<script>
try{
const c=document.getElementById('c');
const ctx=c.getContext('2d');
const msgEl=document.getElementById('msg');
let msgTimeout=0;

function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const WORLD_W=64,WORLD_H=64,VR=12;

const BIOMAS=[
  {id:0,n:'Pueblo',t:['#4caf50','#388e3c','#66bb6a','#8bc34a'],w:['#0288d1','#0277bd'],f:['#f44336','#ffeb3b','#fff','#e91e63','#ff9800']},
  {id:1,n:'Bosque',t:['#2e7d32','#1b5e20','#388e3c','#43a047'],w:['#1565c0','#0d47a1'],f:['#9c27b0','#fff','#e91e63','#ff5722','#ffeb3b']},
  {id:2,n:'Desierto',t:['#f9a825','#f57f17','#ffb300','#ff8f00'],w:['#0288d1','#039be5'],f:['#ff9800','#ffeb3b','#f44336','#fff']},
  {id:3,n:'Montaña',t:['#9e9e9e','#757575','#bdbdbd','#616161'],w:['#1565c0','#1976d2'],f:['#fff','#e3f2fd','#bbdefb','#90caf9']},
  {id:4,n:'Pantano',t:['#5d4037','#4e342e','#6d4c41','#3e2723'],w:['#0277bd','#01579b'],f:['#fff','#c8e6c9','#a5d6a7','#81c784']},
  {id:5,n:'Volcan',t:['#d84315','#bf360c','#e64a19','#f4511e'],w:['#d84315','#bf360c'],f:['#ffeb3b','#ff9800','#f44336','#fff']},
  {id:6,n:'Castillo',t:['#37474f','#263238','#455a64','#546e7a'],w:['#1565c0','#0d47a1'],f:['#f44336','#e91e63','#9c27b0','#ffeb3b']}
];

function getBioma(x,y){
  const m=[[0,1,1,2,2,5,5,5],[1,1,2,2,3,5,5,6],[1,2,2,3,3,5,6,6],[2,2,3,3,4,5,6,6],[2,3,3,4,4,6,6,6],[3,3,4,4,4,6,6,6],[3,4,4,4,6,6,6,6],[4,4,4,6,6,6,6]];
  return m[Math.min(7,Math.floor(y/8))][Math.min(7,Math.floor(x/8))];
}

const world=[];
for(let y=0;y<WORLD_H;y++){
  world[y]=[];
  for(let x=0;x<WORLD_W;x++){
    if(x<1||x>=WORLD_W-1||y<1||y>=WORLD_H-1)world[y][x]=1;
    else{const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;world[y][x]=(v%20<1)?1:0;}
  }
}
world[8][8]=0;

const npcs=[
  {x:6,y:6,n:'Herrero',c:'#e53935',d:'Forja armas y armaduras.\n"Acero y fuego, amigo."'},
  {x:9,y:7,n:'Mago',c:'#8e24aa',d:'Conocimiento arcano.\n"La magia fluye en ti."'},
  {x:7,y:9,n:'Comerciante',c:'#ffb300',d:'Compra y venta.\n"Tengo las mejores ofertas!"'}
];

const cofres=[
  {x:10,y:10,o:false,l:'Espada de Hierro'},
  {x:25,y:18,o:false,l:'Poción de Vida'},
  {x:40,y:22,o:false,l:'50 Monedas'}
];

const pl={gx:8,gy:8,fx:8,fy:8,path:[],frame:0,ft:0,hp:100,mhp:100,oro:50};
let frameCount=0;
const particles=[];

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}
function getCam(){const p=iso(pl.fx,pl.fy);return{x:W/2-p.x,y:H/2-p.y};}

function s2c(sx,sy){
  const cam=getCam();
  return{
    x:Math.round(((sx-cam.x)/(TW/2)+(sy-cam.y)/(TH/2))/2),
    y:Math.round(((sy-cam.y)/(TH/2)-(sx-cam.x)/(TW/2))/2)
  };
}

function showMsg(title,text){
  msgEl.innerHTML='<b style="font-size:16px">'+(title||'')+'</b><br><br>'+(text||'').replace(/\n/g,'<br>');
  msgEl.style.display='block';
  msgTimeout=3;
}

function addParticle(x,y,color,speed){
  particles.push({x,y,vx:(Math.random()-0.5)*speed,vy:-Math.random()*speed,life:1,color,speed});
}

function loop(){
  frameCount++;
  const dt=1/60;
  const W=c.width,H=c.height;
  const TW=Math.min(W,H)/4;
  const TH=TW/2;
  
  if(msgTimeout>0){msgTimeout-=dt;if(msgTimeout<=0)msgEl.style.display='none';}
  
  const bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#0d1b0d');
  bgGrad.addColorStop(1,'#1a2a1a');
  ctx.fillStyle=bgGrad;
  ctx.fillRect(0,0,W,H);
  
  if(pl.path.length>0){
    const t=pl.path[0];
    const dx=t.x-pl.fx,dy=t.y-pl.fy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<0.05){
      pl.fx=t.x;pl.fy=t.y;pl.gx=t.x;pl.gy=t.y;pl.path.shift();
    }else{
      pl.fx+=dx/dist*0.04;pl.fy+=dy/dist*0.04;
    }
    pl.ft+=dt;
    if(pl.ft>0.1){pl.ft=0;pl.frame=(pl.frame+1)%4;}
  }
  
  // Particulas al caminar
  if(pl.path.length>0&&frameCount%3===0){
    const px=(pl.fx-pl.fy)*TW/2+W/2-(pl.fx-pl.fy)*TW/2;
    const py=(pl.fx+pl.fy)*TH/2+H/2-(pl.fx+pl.fy)*TH/2;
    addParticle(px+Math.random()*4-2,py+TH/2,'rgba(150,120,80,0.4)',0.8);
  }
  
  const camX=W/2-(pl.fx-pl.fy)*TW/2;
  const camY=H/2-(pl.fx+pl.fy)*TH/2;
  const pgx=Math.floor(pl.gx),pgy=Math.floor(pl.gy);
  
  // === TILES ===
  for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR+2);y++){
    for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR+2);x++){
      const sx=(x-y)*TW/2+camX;
      const sy=(x+y)*TH/2+camY;
      
      const dist=Math.sqrt((x-pgx)*(x-pgx)+(y-pgy)*(y-pgy));
      if(dist>VR+0.5)continue;
      
      const biomaId=getBioma(x,y);
      const bio=BIOMAS[biomaId]||BIOMAS[0];
      
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.lineTo(sx+TW/2,sy+TH/2);
      ctx.lineTo(sx,sy+TH);
      ctx.lineTo(sx-TW/2,sy+TH/2);
      ctx.closePath();
      
      if(world[y][x]===1){
        const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
        ctx.fillStyle=bio.w[v%bio.w.length];
        ctx.fill();
        
        ctx.fillStyle='rgba(255,255,255,0.2)';
        const wave=Math.sin((frameCount*0.05)+(x+y)*0.5)*2;
        ctx.fillRect(sx-6+wave,sy+TH/3,4,1);
        
        if(biomaId===2&&v%7<2){
          const px=sx-6+((frameCount*0.2+v)%12);
          ctx.fillStyle='#ff8f00';
          ctx.fillRect(px,sy+TH/3,3,2);
          ctx.fillStyle='#ffcc02';
          ctx.fillRect(px-1,sy+TH/3,1,2);
        }
        
        ctx.strokeStyle='rgba(100,180,220,0.15)';
        ctx.lineWidth=1;
        ctx.stroke();
      }else{
        const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
        ctx.fillStyle=bio.t[v%bio.t.length];
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(sx+TW/2,sy+TH/2);
        ctx.lineTo(sx,sy+TH/2);
        ctx.lineTo(sx-TW/2,sy+TH/2);
        ctx.closePath();
        ctx.fillStyle='rgba(255,255,255,0.06)';
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(sx,sy+TH);
        ctx.lineTo(sx+TW/2,sy+TH/2);
        ctx.lineTo(sx+TW/2,sy+TH+2);
        ctx.lineTo(sx-TW/2,sy+TH+2);
        ctx.lineTo(sx-TW/2,sy+TH/2);
        ctx.closePath();
        ctx.fillStyle='rgba(0,0,0,0.1)';
        ctx.fill();
        
        ctx.strokeStyle='rgba(0,0,0,0.05)';
        ctx.lineWidth=1;
        ctx.stroke();
      }
      
      if(pl.path.find(p=>p.x===x&&p.y===y)){
        ctx.fillStyle='rgba(255,255,100,0.2)';
        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(sx+TW/2,sy+TH/2);
        ctx.lineTo(sx,sy+TH);
        ctx.lineTo(sx-TW/2,sy+TH/2);
        ctx.closePath();
        ctx.fill();
      }
    }
  }
  
  // === DECORACIONES ===
  for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR);y++){
    for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR);x++){
      const dist=Math.sqrt((x-pgx)*(x-pgx)+(y-pgy)*(y-pgy));
      if(dist>VR)continue;
      if(world[y][x]!==0)continue;
      
      const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
      const sx=(x-y)*TW/2+camX;
      const sy=(x+y)*TH/2+camY;
      const biomaId=getBioma(x,y);
      const tipo=v%100;
      const bio=BIOMAS[biomaId]||BIOMAS[0];
      
      if(tipo<10){
        const treeType=biomaId===1&&v%3===0?'pino':biomeId===2?'palmera':biomaId===4&&v%2===0?'muerto':'roble';
        
        ctx.fillStyle='rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(sx+5,sy+TH/2,12*0.8,5*0.8,0.3,0,Math.PI*2);
        ctx.fill();
        
        if(treeType==='pino'){
          ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy-10,4,12);
          ctx.fillStyle='#4e342e';ctx.fillRect(sx-2,sy-10,2,12);
          ctx.fillStyle='#2e7d32';
          ctx.beginPath();ctx.moveTo(sx,sy-28);ctx.lineTo(sx-10,sy-8);ctx.lineTo(sx+10,sy-8);ctx.closePath();ctx.fill();
          ctx.fillStyle='#388e3c';
          ctx.beginPath();ctx.moveTo(sx,sy-23);ctx.lineTo(sx-7,sy-10);ctx.lineTo(sx+7,sy-10);ctx.closePath();ctx.fill();
          ctx.fillStyle='#43a047';ctx.fillRect(sx-3,sy-18,2,2);ctx.fillRect(sx+2,sy-16,2,2);
        }else if(treeType==='palmera'){
          ctx.fillStyle='#8d6e63';ctx.fillRect(sx-3,sy-12,6,14);
          ctx.fillStyle='#6d4c41';ctx.fillRect(sx-3,sy-12,3,14);
          ctx.fillStyle='#4caf50';ctx.fillRect(sx-14,sy-16,8,2);ctx.fillRect(sx+6,sy-16,8,2);ctx.fillRect(sx-4,sy-22,8,2);
        }else if(treeType==='muerto'){
          ctx.fillStyle='#4e342e';ctx.fillRect(sx-1,sy-20,3,22);
          ctx.strokeStyle='#3e2723';ctx.lineWidth=2;
          ctx.beginPath();ctx.moveTo(sx,sy-20);ctx.lineTo(sx-8,sy-28);ctx.moveTo(sx,sy-16);ctx.lineTo(sx+6,sy-24);ctx.stroke();
        }else{
          ctx.fillStyle='#5d4037';ctx.fillRect(sx-3,sy-8,6,10);
          ctx.fillStyle='#4e342e';ctx.fillRect(sx-3,sy-8,3,10);
          ctx.fillStyle='#388e3c';ctx.beginPath();ctx.arc(sx,sy-18,10,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.arc(sx-3,sy-20,3,0,Math.PI*2);ctx.fill();
        }
      }else if(tipo<13){
        ctx.fillStyle='rgba(0,0,0,0.25)';
        ctx.beginPath();ctx.ellipse(sx+3,sy+TH/2,8,3,0.2,0,Math.PI*2);ctx.fill();
        
        ctx.fillStyle='#757575';
        ctx.beginPath();ctx.moveTo(sx-8,sy+TH/2);ctx.lineTo(sx-5,sy-8);ctx.lineTo(sx+3,sy-12);ctx.lineTo(sx+8,sy-6);ctx.lineTo(sx+8,sy+TH/2);ctx.closePath();ctx.fill();
        ctx.fillStyle='#616161';
        ctx.beginPath();ctx.moveTo(sx+3,sy-12);ctx.lineTo(sx+8,sy-6);ctx.lineTo(sx+8,sy+TH/2);ctx.lineTo(sx+3,sy+TH/2);ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.15)';
        ctx.beginPath();ctx.moveTo(sx-5,sy-8);ctx.lineTo(sx+3,sy-12);ctx.lineTo(sx-1,sy-6);ctx.closePath();ctx.fill();
      }else if(tipo<15&&biomaId===0){
        ctx.fillStyle='rgba(0,0,0,0.25)';
        ctx.beginPath();ctx.ellipse(sx+6,sy+TH/2,14,5,0.3,0,Math.PI*2);ctx.fill();
        
        ctx.fillStyle='#e8d8b0';ctx.fillRect(sx-10,sy-14,20,16);
        ctx.fillStyle='#c62828';
        ctx.beginPath();ctx.moveTo(sx,sy-28);ctx.lineTo(sx-14,sy-16);ctx.lineTo(sx+14,sy-16);ctx.closePath();ctx.fill();
        ctx.fillStyle='#5d4037';ctx.fillRect(sx-3,sy-6,6,8);
        ctx.fillStyle='#4fc3f7';ctx.fillRect(sx-8,sy-10,4,4);ctx.fillRect(sx+4,sy-10,4,4);
        
        // Humo chimenea
        if(frameCount%30<15){
          ctx.fillStyle='rgba(200,200,200,0.4)';
          ctx.beginPath();ctx.arc(sx+8,sy-32,3,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='rgba(200,200,200,0.3)';
          ctx.beginPath();ctx.arc(sx+9,sy-36,2,0,Math.PI*2);ctx.fill();
        }
      }else if(tipo<17){
        // Flores
        ctx.fillStyle='#4caf50';ctx.fillRect(sx-1,sy+TH/2-4,2,4);
        ctx.fillStyle=bio.f[v%bio.f.length];
        ctx.beginPath();ctx.arc(sx,sy+TH/2-6,2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffeb3b';ctx.fillRect(sx,sy+TH/2-6,1,1);
      }else if(tipo<19&&biomaId===4){
        ctx.fillStyle='rgba(80,100,60,0.4)';
        ctx.beginPath();ctx.ellipse(sx,sy+TH/2,6,2,0,0,Math.PI*2);ctx.fill();
      }else if(tipo<21&&biomaId===5){
        ctx.fillStyle='rgba(0,0,0,0.3)';
        ctx.beginPath();ctx.ellipse(sx+2,sy+TH/2,6,2,0.2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#424242';
        ctx.beginPath();ctx.moveTo(sx-5,sy+TH/2);ctx.lineTo(sx-3,sy-5);ctx.lineTo(sx+2,sy-8);ctx.lineTo(sx+5,sy-4);ctx.lineTo(sx+5,sy+TH/2);ctx.closePath();ctx.fill();
        ctx.fillStyle='#ff6f00';ctx.fillRect(sx,sy-4,1,3);
      }else if(tipo<23&&biomaId===3){
        // Nieve
        ctx.fillStyle='rgba(255,255,255,0.6)';
        ctx.fillRect(sx-6,sy+TH/2,12,2);
      }
    }
  }
  
  // === NIEBLA PANTANO ===
  if(getBioma(pgx,pgy)===4){
    for(let y=Math.max(0,pgy-VR);y<Math.min(WORLD_H,pgy+VR);y++){
      for(let x=Math.max(0,pgx-VR);x<Math.min(WORLD_W,pgx+VR);x++){
        const sx=(x-y)*TW/2+camX;
        const sy=(x+y)*TH/2+camY;
        
        const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;
        const alpha=0.06+(v%3)*0.02;
        ctx.fillStyle=`rgba(180,200,180,${alpha})`;
        const offset=Math.sin((frameCount*0.02)+(x+y)*0.3)*2;
        ctx.fillRect(sx-10,sy+TH/2+offset+2,20,4);
      }
    }
  }
  
  // === PARTICULAS ===
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=0.05;
    p.life-=0.02;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,2,2);
    ctx.globalAlpha=1;
  }
  
  // === COFRES ===
  for(const co of cofres){
    if(co.o)continue;
    const dist=Math.sqrt((co.x-pgx)*(co.x-pgx)+(co.y-pgy)*(co.y-pgy));
    if(dist>VR)continue;
    const sx=(co.x-co.y)*TW/2+camX;
    const sy=(co.x+co.y)*TH/2+camY;
    
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(sx,sy+TH/2,5,2,0,0,Math.PI*2);ctx.fill();
    
    ctx.fillStyle='#ffd700';ctx.fillRect(sx-4,sy-2,8,5);
    ctx.fillStyle='#b8860b';ctx.fillRect(sx-4,sy-2,8,2);
    ctx.fillStyle='#ffeb3b';ctx.fillRect(sx-1,sy-1,2,1);
  }
  
  // === NPCs ===
  for(const n of npcs){
    const dist=Math.sqrt((n.x-pgx)*(n.x-pgx)+(n.y-pgy)*(n.y-pgy));
    if(dist>VR)continue;
    const sx=(n.x-n.y)*TW/2+camX;
    const sy=(n.x+n.y)*TH/2+camY;
    
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(sx,sy+TH/2,6,3,0,0,Math.PI*2);ctx.fill();
    
    ctx.fillStyle=n.c;ctx.fillRect(sx-5,sy+TH/2-14,10,10);
    ctx.fillStyle='#ffe0b2';ctx.fillRect(sx-3,sy+TH/2-19,6,5);
    ctx.fillStyle='#3e2723';ctx.fillRect(sx-4,sy+TH/2-21,8,3);
    ctx.fillStyle='#fff';ctx.fillRect(sx-2,sy+TH/2-17,2,1);ctx.fillRect(sx+1,sy+TH/2-17,2,1);
    
    ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(sx,sy+TH/2-26,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(sx-1,sy+TH/2-27,1,0,Math.PI*2);ctx.fill();
    
    ctx.fillStyle='#fff';ctx.font='6px monospace';ctx.textAlign='center';ctx.fillText(n.n,sx,sy-8);
  }
  
  // === JUGADOR ===
  const px=(pl.fx-pl.fy)*TW/2+camX;
  const py=(pl.fx+pl.fy)*TH/2+camY;
  
  // Sombra
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(px,py+TH/2,7,3,0,0,Math.PI*2);ctx.fill();
  
  // Piernas con animacion
  ctx.fillStyle='#5d4037';
  if(pl.path.length>0){
    if(pl.frame===0||pl.frame===2){
      ctx.fillRect(px-3,py+TH/2-8,2,8);
      ctx.fillRect(px+1,py+TH/2-8,2,8);
    }else if(pl.frame===1){
      ctx.fillRect(px-3,py+TH/2-9,2,9);
      ctx.fillRect(px+1,py+TH/2-7,2,7);
    }else{
      ctx.fillRect(px-3,py+TH/2-7,2,7);
      ctx.fillRect(px+1,py+TH/2-9,2,9);
    }
  }else{
    ctx.fillRect(px-3,py+TH/2-8,2,8);
    ctx.fillRect(px+1,py+TH/2-8,2,8);
  }
  
  // Cuerpo
  ctx.fillStyle='#1976d2';ctx.fillRect(px-7,py+TH/2-20,14,14);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-7,py+TH/2-8,14,2);
  
  // Cabeza
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-4,py+TH/2-26,8,6);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-5,py+TH/2-28,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(px-2,py+TH/2-24,2,2);ctx.fillRect(px+1,py+TH/2-24,2,2);
  ctx.fillStyle='#1a1a1a';ctx.fillRect(px-1,py+TH/2-23,1,1);ctx.fillRect(px+2,py+TH/2-23,1,1);
  
  // === UI ===
  ctx.fillStyle='rgba(0,0,0,0.85)';ctx.beginPath();ctx.roundRect(10,10,150,55,6);ctx.fill();
  ctx.strokeStyle='#ffd700';ctx.lineWidth=1;ctx.stroke();
  
  ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('Lv.1 Hero',18,26);
  
  ctx.fillStyle='#4a0000';ctx.beginPath();ctx.roundRect(18,34,134,8,3);ctx.fill();
  ctx.fillStyle='#e44';ctx.beginPath();ctx.roundRect(19,35,132,6,2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.fillText('100/100',75,39);
  
  ctx.fillStyle='#ffd700';ctx.font='10px monospace';ctx.fillText('Oro: '+pl.oro,18,50);
  
  ctx.fillStyle='#0f0';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText('Pos:'+Math.floor(pl.gx)+','+Math.floor(pl.gy),10,H-15);
  
  // Minimapa
  const mmW=100,mmH=100,mmX=W-mmW-10,mmY=H-mmH-10;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(mmX,mmY,mmW,mmH);
  for(let y=0;y<WORLD_H;y+=2){
    for(let x=0;x<WORLD_W;x+=2){
      const biomaId=getBioma(x,y);
      const b=BIOMAS[biomaId]||BIOMAS[0];
      ctx.fillStyle=world[y][x]===1?b.w[0]:b.t[0];
      ctx.fillRect(mmX+(x/WORLD_W)*mmW,mmY+(y/WORLD_H)*mmH,2,2);
    }
  }
  ctx.fillStyle='#ff0';ctx.fillRect(mmX+(pl.gx/WORLD_W)*mmW-2,mmY+(pl.gy/WORLD_H)*mmH-2,4,4);
  ctx.strokeStyle='#ffd700';ctx.lineWidth=1;ctx.strokeRect(mmX,mmY,mmW,mmH);
  
  requestAnimationFrame(loop);
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(pl.path.length>0)return;
  const W=c.width,H=c.height;
  const TW=Math.min(W,H)/4,TH=TW/2;
  const camX=W/2-(pl.fx-pl.fy)*TW/2;
  const camY=H/2-(pl.fx+pl.fy)*TH/2;
  
  const t=e.changedTouches[0];
  const rx=t.clientX-camX,ry=t.clientY-camY;
  const gx=Math.floor((rx/(TW/2)+ry/(TH/2))/2);
  const gy=Math.floor((ry/(TH/2)-rx/(TW/2))/2);
  
  if(gx<0||gx>=WORLD_W||gy<0||gy>=WORLD_H)return;
  
  for(const n of npcs){
    if(n.x===gx&&n.y===gy){
      showMsg(n.n,n.d);
      return;
    }
  }
  
  for(const co of cofres){
    if(co.x===gx&&co.y===gy&&!co.o){
      co.o=true;
      pl.oro+=10;
      showMsg('Cofre abierto','Encontraste: '+co.l+'\n+10 oro');
      return;
    }
  }
  
  if(world[gy][gx]!==0)return;
  
  const open=[{x:pl.gx,y:pl.gy,p:[]}];
  const vis=new Set();vis.add(pl.gx+','+pl.gy);
  while(open.length){
    const c=open.shift();
    if(c.x===gx&&c.y===gy){pl.path=c.p;break;}
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=c.x+dx,ny=c.y+dy,k=nx+','+ny;
      if(vis.has(k)||nx<0||nx>=WORLD_W||ny<0||ny>=WORLD_H||world[ny][nx]!==0)continue;
      vis.add(k);
      open.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]});
    }
  }
},{passive:false});

loop();
}catch(e){
  document.body.innerHTML='<h1 style="color:red;padding:20px">ERROR: '+e.message+'<br><br>'+e.stack+'</h1>';
}
</script>
</body>
</html>
