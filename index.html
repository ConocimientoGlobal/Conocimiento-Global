<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}html,body{width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const MW=15,MH=15,TW=80,TH=40;

const world=[];
for(let y=0;y<MH;y++){world[y]=[];for(let x=0;x<MW;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;world[y][x]=v%12<2?1:0;}}

const pl={gx:7,gy:7,px:7,py:7,frame:0,ft:0,hp:100,mhp:100,path:[]};
const en=[{x:5,y:5,hp:40,mhp:40,c:'#c62828'},{x:11,y:8,hp:50,mhp:50,c:'#6a1b9a'},{x:8,y:13,hp:30,mhp:30,c:'#1565c0'}];

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

function s2g(sx,sy){
  const cam=iso(pl.gx,pl.gy);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  const wx=sx-ox,wy=sy-oy;
  return {x:Math.floor((wx/(TW/2)+wy/(TH/2))/2),y:Math.floor((wy/(TH/2)-wx/(TW/2))/2)};
}

function findPath(sx,sy,gx,gy){
  if(gx<0||gx>=MW||gy<0||gy>=MH||world[gy][gx]===1)return [];
  const open=[{x:sx,y:sy,path:[]}];const vis=new Set();vis.add(sx+','+sy);
  while(open.length){
    const c=open.shift();
    if(c.x===gx&&c.y===gy)return c.path;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=c.x+dx,ny=c.y+dy,k=nx+','+ny;
      if(nx<0||nx>=MW||ny<0||ny>=MH||vis.has(k)||world[ny][nx]===1)continue;
      let blocked=false;for(const e of en)if(e.x===nx&&e.y===ny&&e.hp>0){blocked=true;break;}
      if(blocked)continue;
      vis.add(k);open.push({x:nx,y:ny,path:[...c.path,{x:nx,y:ny}]});
    }
  }
  return [];
}

// Tap en pantalla = mover a esa celda
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  const g=s2g(t.clientX,t.clientY);
  pl.path=findPath(Math.floor(pl.gx),Math.floor(pl.gy),g.x,g.y);
},{passive:false});

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  // Avanzar por el camino (celda por celda)
  if(pl.path.length>0){
    const t=pl.path[0];const sp=8*dt;
    if(pl.px<t.x)pl.px=Math.min(t.x,pl.px+sp);else if(pl.px>t.x)pl.px=Math.max(t.x,pl.px-sp);
    if(pl.py<t.y)pl.py=Math.min(t.y,pl.py+sp);else if(pl.py>t.y)pl.py=Math.max(t.y,pl.py-sp);
    if(Math.abs(pl.px-t.x)<0.05&&Math.abs(pl.py-t.y)<0.05){pl.gx=t.x;pl.gy=t.y;pl.path.shift();}
    pl.ft+=dt;if(pl.ft>0.15){pl.ft=0;pl.frame=(pl.frame+1)%2;}
  }
  
  ctx.fillStyle='#1a3a1a';ctx.fillRect(0,0,W,H);
  const cam=iso(pl.gx,pl.gy);const ox=W/2-cam.x,oy=H/2-cam.y;
  
  // Camino visual
  for(const p of pl.path){const s=iso(p.x,p.y),sx=s.x+ox,sy=s.y+oy;ctx.fillStyle='rgba(255,255,0,0.4)';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();ctx.fill();}
  
  // Tiles
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const s=iso(x,y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-TW||sx>W+TW||sy<-TH*2||sy>H+TH)continue;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();
    const t=world[y][x];ctx.fillStyle=t===1?'#1565c0':'#4caf50';ctx.fill();ctx.strokeStyle=t===1?'#0d47a1':'#388e3c';ctx.lineWidth=1;ctx.stroke();
    if(t===0){ctx.fillStyle='#7cb342';ctx.fillRect(sx-6,sy+6,1,3);ctx.fillRect(sx+4,sy+8,1,3);}
    if(t===1){ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(sx-8,sy+10,6,1);}
  }
  
  // Enemigos
  for(const e of en){
    if(e.hp<=0)continue;
    const s=iso(e.x,e.y),sx=s.x+ox,sy=s.y+oy;
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+12,8,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=e.c;ctx.fillRect(sx-6,sy-4,12,14);ctx.fillStyle='#fff';ctx.fillRect(sx-4,sy-2,3,3);ctx.fillRect(sx+1,sy-2,3,3);
    ctx.fillStyle='#333';ctx.fillRect(sx-10,sy-12,20,3);ctx.fillStyle='#e44';ctx.fillRect(sx-9,sy-11,18*e.hp/e.mhp,1);
  }
  
  // Jugador
  const p=iso(pl.px,pl.py),px=p.x+ox,py=p.y-10,bo=pl.frame===0?0:1;
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(px,py+16,10,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';ctx.fillRect(px-4,py+2,3,7+bo);ctx.fillRect(px+1,py+2,3,7+bo);
  ctx.fillStyle='#1976d2';ctx.fillRect(px-6,py-6,12,10);ctx.fillStyle='#1565c0';ctx.fillRect(px-6,py-6,12,3);ctx.fillStyle='#ffc107';ctx.fillRect(px-6,py,12,2);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-4,py-12,8,6);ctx.fillStyle='#3e2723';ctx.fillRect(px-4,py-14,8,2);
  ctx.fillStyle='#fff';ctx.fillRect(px-2,py-8,2,2);ctx.fillRect(px+1,py-8,2,2);ctx.fillStyle='#000';ctx.fillRect(px-1,py-7,1,1);ctx.fillRect(px+2,py-7,1,1);
  
  // UI
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(10,10,130,45);ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('Lv.1 Hero',18,25);
  ctx.fillStyle='#4a0000';ctx.fillRect(18,32,110,8);ctx.fillStyle='#e44';ctx.fillRect(19,33,108,6);ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.fillText('100/100',60,38);
  
  ctx.fillStyle='#0f0';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('Pos:'+pl.gx+','+pl.gy+' Path:'+pl.path.length+' W:'+W+' H:'+H,10,H-10);
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
