<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
html,body{width:100vw;height:100vh;overflow:hidden;background:red}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();

const TW=64,TH=32,MW=25,MH=25;
const pl={x:12,y:12,f:0,t:0,hp:100,mhp:100,mp:50,mmp:50,lv:1,xp:0,g:0};
const w=[];
for(let y=0;y<MH;y++){w[y]=[];for(let x=0;x<MW;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%10<2)t=1;else if(v%15<2)t=2;else if(v%20<2)t=3;else if(v%25<2)t=4;else if(v%12<1)t=5;else if(v%18<1)t=6;w[y][x]=t;}}
const en=[{x:8,y:8,hp:40,mhp:40,c:'#c62828'},{x:15,y:10,hp:50,mhp:50,c:'#6a1b9a'},{x:10,y:15,hp:60,mhp:60,c:'#1565c0'}];
const pts=[];

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

let jx=0,jy=0,ja=false,jsx=0,jsy=0;
const btns=[
  {l:'⚔️',x:0,y:0,r:30,c:'#c62828'},
  {l:'✨',x:0,y:0,r:26,c:'#1565c0'},
  {l:'🐾',x:0,y:0,r:24,c:'#2e7d32'},
  {l:'👆',x:0,y:0,r:26,c:'#ff8f00'}
];

function posUI(){
  const p=15;
  btns[0].x=W-p-30;btns[0].y=H-p-100;
  btns[1].x=W-p-80;btns[1].y=H-p-60;
  btns[2].x=W-p-30;btns[2].y=H-p-20;
  btns[3].x=W-p-80;btns[3].y=H-p-20;
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(let t of e.changedTouches){
    if(t.clientX<W*0.5){
      ja=true;jsx=t.clientX;jsy=t.clientY;jx=0;jy=0;
    } else {
      for(let b of btns){
        const dx=t.clientX-b.x,dy=t.clientY-b.y;
        if(Math.sqrt(dx*dx+dy*dy)<b.r){
          if(b.l==='⚔️'){en[0].hp-=10;pts.push({x:iso(en[0].x,en[0].y).x,y:iso(en[0].x,en[0].y).y,vx:0,vy:-2,l:1,c:'#f44'});}
          if(b.l==='✨'){for(const e of en)e.hp-=5;}
          if(b.l==='🐾'){for(const e of en)e.hp-=8;}
          if(b.l==='👆'){pl.x++;if(pl.x>=MW)pl.x=0;}
          b.p=true;
        }
      }
    }
  }
},{passive:false});

c.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(let t of e.changedTouches){
    if(ja){
      const dx=t.clientX-jsx,dy=t.clientY-jsy;
      const d=Math.sqrt(dx*dx+dy*dy),m=40;
      if(d>m){jx=dx/d;jy=dy/d;}else{jx=dx/m;jy=dy/m;}
    }
  }
},{passive:false});

c.addEventListener('touchend',e=>{ja=false;jx=0;jy=0;for(let b of btns)b.p=false;},{passive:false});

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  if(ja){
    const s=8*dt;
    const nx=pl.x+jx*s,ny=pl.y+jy*s;
    if(nx>=0&&nx<MW&&ny>=0&&ny<MH&&w[Math.floor(ny)][Math.floor(nx)]!==1){
      pl.x=nx;pl.y=ny;pl.t+=dt;
      if(pl.t>0.2){pl.t=0;pl.f=(pl.f+1)%2;}
    }
  }
  
  for(let i=pts.length-1;i>=0;i--){pts[i].x+=pts[i].vx;pts[i].y+=pts[i].vy;pts[i].l-=dt*2;if(pts[i].l<=0)pts.splice(i,1);}
  
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  
  const cam=iso(pl.x,pl.y);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const s=iso(x,y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-TW||sx>W+TW||sy<-TH*2||sy>H+TH)continue;
    const t=w[y][x];
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();
    if(t===0){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();ctx.fillStyle='#7cb342';ctx.fillRect(sx-5,sy+4,1,3);ctx.fillRect(sx+3,sy+6,1,3);}
    else if(t===1){ctx.fillStyle='#1565c0';ctx.fill();}
    else if(t===2){ctx.fillStyle='#8d6e63';ctx.fill();}
    else if(t===3){ctx.fillStyle='#757575';ctx.fill();}
    else if(t===4){ctx.fillStyle='#e0c878';ctx.fill();}
    else if(t===5){ctx.fillStyle='#4caf50';ctx.fill();ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.moveTo(sx,sy-20);ctx.lineTo(sx-12,sy+2);ctx.lineTo(sx+12,sy+2);ctx.closePath();ctx.fill();ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy+2,4,8);}
    else{ctx.fillStyle='#4caf50';ctx.fill();ctx.fillStyle='#9e9e9e';ctx.beginPath();ctx.ellipse(sx,sy+8,10,6,0,Math.PI,0);ctx.fill();}
  }
  
  for(const e of en){
    if(e.hp<=0)continue;
    const s=iso(e.x,e.y),sx=s.x+ox,sy=s.y+oy;
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+12,8,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=e.c;ctx.fillRect(sx-6,sy-4,12,14);
    ctx.fillStyle='#fff';ctx.fillRect(sx-4,sy-2,3,3);ctx.fillRect(sx+1,sy-2,3,3);
    ctx.fillStyle='#333';ctx.fillRect(sx-12,sy-12,24,4);ctx.fillStyle='#e44';ctx.fillRect(sx-11,sy-11,22*e.hp/e.mhp,2);
  }
  
  const p=iso(pl.x,pl.y),px=p.x+ox,py=p.y+oy,bo=pl.f===0?0:1;
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(px,py+16,10,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';ctx.fillRect(px-5,py+4,3,8+bo);ctx.fillRect(px+2,py+4,3,8+bo);
  ctx.fillStyle='#1976d2';ctx.fillRect(px-7,py-6,14,12);ctx.fillStyle='#1565c0';ctx.fillRect(px-7,py-6,14,3);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-7,py,14,2);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-5,py-12,10,6);ctx.fillStyle='#3e2723';ctx.fillRect(px-5,py-14,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(px-3,py-10,2,2);ctx.fillRect(px+1,py-10,2,2);
  ctx.fillStyle='#000';ctx.fillRect(px-2,py-9,1,1);ctx.fillRect(px+2,py-9,1,1);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-9,py-4,2,5);ctx.fillRect(px+7,py-4,2,5);
  
  for(const pt of pts){
    ctx.globalAlpha=pt.l;ctx.fillStyle=pt.c;
    ctx.beginPath();ctx.arc(pt.x+ox,pt.y+oy,4,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  
  if(ja){
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.arc(jsx,jsy,50,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(jsx+jx*40,jsy+jy*40,18,0,Math.PI*2);ctx.fill();
  }
  
  for(const b of btns){
    ctx.fillStyle=b.p?'rgba(255,255,255,0.3)':'rgba(0,0,0,0.6)';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=b.c;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=b.r*0.9+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.l,b.x,b.y+2);
  }
  
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,35);
  ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(`Lv.${pl.lv} HP:${pl.hp}/${pl.mhp}`,8,18);
  ctx.fillStyle='#ffc107';ctx.textAlign='right';ctx.fillText(`💰${pl.g}`,W-8,18);
  
  ctx.fillStyle='#0f0';ctx.font='10px monospace';ctx.textAlign='left';
  ctx.fillText(`W:${W} H:${H}`,8,H-10);
  
  requestAnimationFrame(loop);
}

posUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
