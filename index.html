<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}html,body{width:100%;height:100%;overflow:hidden;background:#000}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const MW=20,MH=20,TW=80,TH=40;
const world=[];
for(let y=0;y<MH;y++){world[y]=[];for(let x=0;x<MW;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%10<2)t=1;else if(v%16<2)t=2;else if(v%22<2)t=3;else if(v%28<2)t=4;else if(v%14<1)t=5;else if(v%20<1)t=6;world[y][x]=t;}}

let px=10,py=10,path=[],frame=0,ft=0;
let msg1='Toca una celda',msg2='';
const particles=[];

const enemies=[
  {x:8,y:8,type:'goblin',hp:40,mhp:40,name:'Goblin',lv:1},
  {x:15,y:12,type:'skeleton',hp:50,mhp:50,name:'Esqueleto',lv:2},
  {x:12,y:16,type:'slime',hp:60,mhp:60,name:'Slime',lv:1}
];

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

function s2g(sx,sy){
  const cam=iso(px,py);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  const wx=sx-ox,wy=sy-oy;
  return {x:Math.floor((wx/(TW/2)+wy/(TH/2))/2),y:Math.floor((wy/(TH/2)-wx/(TW/2))/2)};
}

function findPath(sx,sy,gx,gy){
  if(gx<0||gx>=MW||gy<0||gy>=MH||world[gy][gx]===1)return[];
  for(const e of enemies){if(e.x===gx&&e.y===gy&&e.hp>0)return [];}
  const open=[{x:sx,y:sy,path:[]}];const vis=new Set();
  while(open.length){
    const c=open.shift();
    if(c.x===gx&&c.y===gy)return c.path;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=c.x+dx,ny=c.y+dy,k=nx+','+ny;
      if(nx<0||nx>=MW||ny<0||ny>=MH||vis.has(k)||world[ny][nx]===1)continue;
      vis.add(k);open.push({x:nx,y:ny,path:[...c.path,{x:nx,y:ny}]});
    }
  }
  return [];
}

function spawnParticles(gx,gy,color,n){
  const s=iso(gx,gy);
  for(let i=0;i<n;i++){
    particles.push({x:s.x,y:s.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-2,l:1,c:color});
  }
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  const g=s2g(t.clientX,t.clientY);
  msg1=`Celda: ${g.x},${g.y}`;
  path=findPath(Math.floor(px),Math.floor(py),g.x,g.y);
  msg2=path.length>0?`Camino: ${path.length} celdas`:'Sin camino';
},{passive:false});

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  
  if(path.length>0){
    const t=path[0];
    const sp=8*dt;
    if(px<t.x)px=Math.min(t.x,px+sp);else if(px>t.x)px=Math.max(t.x,px-sp);
    if(py<t.y)py=Math.min(t.y,py+sp);else if(py>t.y)py=Math.max(t.y,py-sp);
    if(Math.abs(px-t.x)<0.05&&Math.abs(py-t.y)<0.05){px=t.x;py=t.y;path.shift();}
    ft+=dt;if(ft>0.15){ft=0;frame=(frame+1)%2;}
  }
  
  for(let i=particles.length-1;i>=0;i--){
    particles[i].x+=particles[i].vx;particles[i].y+=particles[i].vy;
    particles[i].vy+=0.1;particles[i].l-=dt*2.5;
    if(particles[i].l<=0)particles.splice(i,1);
  }
  
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  
  const cam=iso(px,py);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  
  // Tiles
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const s=iso(x,y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-TW||sx>W+TW||sy<-TH*2||sy>H+TH)continue;
    const t=world[y][x];
    const inPath=path.find(p=>p.x===x&&p.y===y);
    
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();
    
    if(inPath){
      ctx.fillStyle='rgba(255,255,0,0.4)';ctx.fill();
    } else if(t===0){
      ctx.fillStyle='#4caf50';ctx.fill();
      ctx.strokeStyle='#388e3c';ctx.stroke();
      ctx.fillStyle='#7cb342';ctx.fillRect(sx-6,sy+5,1,3);ctx.fillRect(sx+4,sy+7,1,3);ctx.fillRect(sx+9,sy+6,1,2);
    } else if(t===1){
      ctx.fillStyle='#1565c0';ctx.fill();ctx.strokeStyle='#0d47a1';ctx.stroke();
      ctx.fillStyle='#42a5f5';ctx.fillRect(sx-7,sy+10,5,1);ctx.fillRect(sx+5,sy+16,4,1);
    } else if(t===2){
      ctx.fillStyle='#8d6e63';ctx.fill();ctx.strokeStyle='#5d4037';ctx.stroke();
    } else if(t===3){
      ctx.fillStyle='#757575';ctx.fill();ctx.strokeStyle='#424242';ctx.stroke();
    } else if(t===4){
      ctx.fillStyle='#e0c878';ctx.fill();ctx.strokeStyle='#c8a840';ctx.stroke();
    } else if(t===5){
      ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();
      ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.moveTo(sx,sy-20);ctx.lineTo(sx-12,sy+2);ctx.lineTo(sx+12,sy+2);ctx.closePath();ctx.fill();
      ctx.fillStyle='#5d4037';ctx.fillRect(sx-2,sy+2,4,8);
    } else {
      ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();
      ctx.fillStyle='#9e9e9e';ctx.beginPath();ctx.ellipse(sx,sy+8,10,6,0,Math.PI,0);ctx.fill();
    }
  }
  
  // Enemigos
  for(const e of enemies){
    if(e.hp<=0)continue;
    const s=iso(e.x,e.y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-60||sx>W+60||sy<-60||sy>H+60)continue;
    
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx,sy+14,10,4,0,0,Math.PI*2);ctx.fill();
    
    if(e.type==='goblin'){
      ctx.fillStyle='#4caf50';ctx.fillRect(sx-7,sy-6,14,14);
      ctx.fillStyle='#388e3c';ctx.fillRect(sx-7,sy+4,14,4);
      ctx.fillStyle='#fff';ctx.fillRect(sx-5,sy-3,3,3);ctx.fillRect(sx+2,sy-3,3,3);
      ctx.fillStyle='#f44336';ctx.fillRect(sx-4,sy-2,2,2);ctx.fillRect(sx+3,sy-2,2,2);
    } else if(e.type==='skeleton'){
      ctx.fillStyle='#e0e0e0';ctx.fillRect(sx-6,sy-8,12,14);
      ctx.fillStyle='#bdbdbd';ctx.fillRect(sx-6,sy-8,12,4);
      ctx.fillStyle='#212121';ctx.fillRect(sx-4,sy-5,3,3);ctx.fillRect(sx+1,sy-5,3,3);
      ctx.fillRect(sx-2,sy,4,2);ctx.fillRect(sx-3,sy+3,6,2);
    } else if(e.type==='slime'){
      const squish=Math.sin(ts*0.004)*0.1+1;
      ctx.save();ctx.translate(sx,sy);ctx.scale(squish,1/squish);ctx.translate(-sx,-sy);
      ctx.fillStyle='#03a9f4';ctx.beginPath();ctx.ellipse(sx,sx+4,10,7,0,Math.PI,Math.PI*2);ctx.fill();
      ctx.fillStyle='#0288d1';ctx.beginPath();ctx.ellipse(sx,sx+6,8,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#212121';ctx.fillRect(sx-4,sx,2,2);ctx.fillRect(sx+2,sx,2,2);
      ctx.restore();
    }
    
    ctx.fillStyle='#333';ctx.fillRect(sx-12,sy-12,24,4);ctx.fillStyle='#e44';ctx.fillRect(sx-11,sy-11,22*e.hp/e.mhp,2);
    ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(`${e.name} Lv${e.lv}`,sx,sy-14);
  }
  
  // Jugador
  const p=iso(px,py),pxx=p.x+ox,pyy=p.y+oy,bo=frame===0?0:1;
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(pxx,pyy+16,10,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';ctx.fillRect(pxx-5,pyy+4,3,8+bo);ctx.fillRect(pxx+2,pyy+4,3,8+bo);
  ctx.fillStyle='#3e2723';ctx.fillRect(pxx-6,pyy+11+bo,4,3);ctx.fillRect(pxx+2,pyy+11+bo,4,3);
  ctx.fillStyle='#1976d2';ctx.fillRect(pxx-7,pyy-6,14,12);
  ctx.fillStyle='#1565c0';ctx.fillRect(pxx-7,pyy-6,14,3);
  ctx.fillStyle='#ffc107';ctx.fillRect(pxx-7,pyy,14,2);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(pxx-5,pyy-12,10,6);
  ctx.fillStyle='#3e2723';ctx.fillRect(pxx-5,pyy-14,10,3);
  ctx.fillStyle='#fff';ctx.fillRect(pxx-3,pyy-10,2,2);ctx.fillRect(pxx+1,pyy-10,2,2);
  ctx.fillStyle='#000';ctx.fillRect(pxx-2,pyy-9,1,1);ctx.fillRect(pxx+2,pyy-9,1,1);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(pxx-9,pyy-4,2,5);ctx.fillRect(pxx+7,pyy-4,2,5);
  
  // Partículas
  for(const pt of particles){
    ctx.globalAlpha=pt.l;ctx.fillStyle=pt.c;
    ctx.beginPath();ctx.arc(pt.x+ox,pt.y+oy,4*pt.l,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  
  // UI
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(5,5,300,50);
  ctx.fillStyle='#fff';ctx.font='14px monospace';ctx.textAlign='left';
  ctx.fillText(msg1,10,20);
  ctx.fillText(msg2,10,40);
  
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(10,10,130,45);
  ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(`🦸 Hero Lv.1`,18,25);
  ctx.fillStyle='#4a0000';ctx.fillRect(18,32,110,8);ctx.fillStyle='#e44';ctx.fillRect(19,33,108*100/100,6);
  ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.fillText(`100/100`,60,38);
  
  ctx.fillStyle='#0f0';ctx.font='10px monospace';ctx.textAlign='left';
  ctx.fillText(`Pos:${px.toFixed(0)},${py.toFixed(0)} W:${W} H:${H}`,10,H-10);
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
