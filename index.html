<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}html,body{width:100%;height:100%;overflow:hidden;background:#000}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const MW=15,MH=15,TW=64,TH=32;
const world=[];
for(let y=0;y<MH;y++){world[y]=[];for(let x=0;x<MW;x++){const v=((x*374761393+y*668265263)^0x5bf03635)>>>0;let t=0;if(v%12<2)t=1;else if(v%20<2)t=2;else if(v%25<2)t=3;world[y][x]=t;}}

const pl={gx:7,gy:7,px:7,py:7,frame:0,ft:0,hp:100,mhp:100};
const en=[{x:5,y:5,hp:40,mhp:40,c:'#c62828'},{x:10,y:8,hp:50,mhp:50,c:'#6a1b9a'},{x:8,y:12,hp:30,mhp:30,c:'#1565c0'}];

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2};}

let jx=0,jy=0,ja=false,jsx=0,jsy=0,moveCD=0;

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  // Joystick
  if(t.clientX<W*0.5){
    ja=true;jsx=t.clientX;jsy=t.clientY;jx=0;jy=0;
  }
  // Tap en celda
  else if(moveCD<=0){
    const cam=iso(pl.gx,pl.gy);
    const ox=W/2-cam.x,oy=H/2-cam.y;
    const wx=t.clientX-ox,wy=t.clientY-oy;
    const gx=Math.floor((wx/(TW/2)+wy/(TH/2))/2);
    const gy=Math.floor((wy/(TH/2)-wx/(TW/2))/2);
    const dx=Math.abs(gx-pl.gx),dy=Math.abs(gy-pl.gy);
    if(dx<=1&&dy<=1&&(dx+dy>0)&&gx>=0&&gx<MW&&gy>=0&&gy<MH&&world[gy][gx]!==1){
      pl.gx=gx;pl.gy=gy;moveCD=0.3;
    }
  }
},{passive:false});

c.addEventListener('touchmove',e=>{e.preventDefault();if(!ja)return;for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];const dx=t.clientX-jsx,dy=t.clientY-jsy;const d=Math.sqrt(dx*dx+dy*dy),m=40;if(d>m){jx=dx/d;jy=dy/d;}else{jx=dx/m;jy=dy/m;}}},{passive:false});
c.addEventListener('touchend',e=>{ja=false;jx=0;jy=0;},{passive:false});

let last=performance.now();

function loop(ts){
  const dt=Math.min((ts-last)/1000,0.1);
  last=ts;
  moveCD=Math.max(0,moveCD-dt);
  
  // Joystick por celdas
  if(ja&&(jx>0.5||jx<-0.5||jy>0.5||jy<-0.5)&&moveCD<=0){
    let dx=0,dy=0;
    if(Math.abs(jx)>Math.abs(dy)){dx=jx>0?1:-1;}else{dy=jy>0?1:-1;}
    const nx=pl.gx+dx,ny=pl.gy+dy;
    if(nx>=0&&nx<MW&&ny>=0&&ny<MH&&world[ny][nx]!==1){pl.gx=nx;pl.gy=ny;moveCD=0.25;}
  }
  
  // Animación suave
  const sp=6*dt;
  if(pl.px<pl.gx)pl.px=Math.min(pl.gx,pl.px+sp);else if(pl.px>pl.gx)pl.px=Math.max(pl.gx,pl.px-sp);
  if(pl.py<pl.gy)pl.py=Math.min(pl.gy,pl.py+sp);else if(pl.py>pl.gy)pl.py=Math.max(pl.gy,pl.py-sp);
  if(Math.abs(pl.px-pl.gx)<0.05&&Math.abs(pl.py-pl.gy)<0.05){pl.px=pl.gx;pl.py=pl.gy;}
  
  pl.ft+=dt;if(pl.ft>0.2&&pl.px===pl.gx&&pl.py===pl.gy){pl.ft=0;pl.frame=(pl.frame+1)%2;}
  
  // Render
  ctx.fillStyle='#1a3a1a';ctx.fillRect(0,0,W,H);
  
  const cam=iso(pl.gx,pl.gy);
  const ox=W/2-cam.x,oy=H/2-cam.y;
  
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const s=iso(x,y),sx=s.x+ox,sy=s.y+oy;
    if(sx<-TW||sx>W+TW||sy<-TH*2||sy>H+TH)continue;
    const t=world[y][x];
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();
    if(t===0){ctx.fillStyle='#4caf50';ctx.fill();ctx.strokeStyle='#388e3c';ctx.stroke();ctx.fillStyle='#7cb342';ctx.fillRect(sx-5,sy+4,1,3);ctx.fillRect(sx+3,sy+6,1,3);}
    else if(t===1){ctx.fillStyle='#1565c0';ctx.fill();}
    else if(t===2){ctx.fillStyle='#8d6e63';ctx.fill();}
    else if(t===3){ctx.fillStyle='#757575';ctx.fill();}
    
    // Indicador de celda válida (estilo Waven)
    const dx=Math.abs(x-pl.gx),dy=Math.abs(y-pl.gy);
    if(dx<=1&&dy<=1&&(dx+dy>0)&&t!==1){
      ctx.strokeStyle='rgba(76,175,80,0.3)';ctx.lineWidth=1;ctx.stroke();
    }
  }
  
  for(const e of en){
    if(e.hp<=0)continue;
    const s=iso(e.x,e.y),sx=s.x+ox,sy=s.y+oy;
    ctx.fillStyle=e.c;ctx.fillRect(sx-7,sy-5,14,14);
    ctx.fillStyle='#fff';ctx.fillRect(sx-5,sy-3,3,3);ctx.fillRect(sx+2,sy-3,3,3);
    ctx.fillStyle='#333';ctx.fillRect(sx-10,sy-12,20,3);ctx.fillStyle='#e44';ctx.fillRect(sx-9,sy-11,18*e.hp/e.mhp,1);
  }
  
  const p=iso(pl.px,pl.py),px=p.x+ox,py=p.y+oy,bo=pl.frame===0?0:1;
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(px,py+14,8,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';ctx.fillRect(px-4,py+2,3,7+bo);ctx.fillRect(px+1,py+2,3,7+bo);
  ctx.fillStyle='#1976d2';ctx.fillRect(px-6,py-6,12,10);
  ctx.fillStyle='#1565c0';ctx.fillRect(px-6,py-6,12,3);
  ctx.fillStyle='#ffc107';ctx.fillRect(px-6,py,12,2);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-4,py-10,8,5);
  ctx.fillStyle='#3e2723';ctx.fillRect(px-4,py-12,8,2);
  ctx.fillStyle='#fff';ctx.fillRect(px-2,py-8,2,2);ctx.fillRect(px+1,py-8,2,2);
  ctx.fillStyle='#000';ctx.fillRect(px-1,py-7,1,1);ctx.fillRect(px+2,py-7,1,1);
  ctx.fillStyle='#ffe0b2';ctx.fillRect(px-8,py-4,2,5);ctx.fillRect(px+7,py-4,2,5);
  
  if(ja){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.arc(jsx,jsy,50,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(jsx+jx*40,jsy+jy*40,18,0,Math.PI*2);ctx.fill();}
  
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(10,10,120,40);
  ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.textAlign='left';
  ctx.fillText('Lv.1 Hero HP:'+pl.hp+'/'+pl.mhp,18,28);
  ctx.fillStyle='#e44';ctx.fillRect(18,34,100,4);ctx.fillStyle='#4f4';ctx.fillRect(18,34,100*pl.hp/pl.mhp,4);
  
  ctx.fillStyle='#0f0';ctx.font='10px monospace';
  ctx.fillText('Grid:'+pl.gx+','+pl.gy+' Mov:'+(moveCD>0?'Sí':'No'),10,H-10);
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
